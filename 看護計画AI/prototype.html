<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 患者タブ → 左にカルテ(根拠の出どころ)、右にAI計画案。カルテと計画を並べて照合する二面構成 */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --ink: #17324d;          /* 月報と同じ紺 */
  --fg: #1d2833;
  --muted: #5b6a78;
  --line: #d7dee5;
  --tint: #e7eef5;
  --accent: #1f5f8b;
  --accent-soft: #e2edf6;
  --flash: #fff1c2;
  --good: #2e7d4f;  --good-soft: #e3f2e8;
  --warn: #9a6400;  --warn-soft: #fbf0d9;
  --bad:  #a33a3a;  --bad-soft:  #f7e4e4;
  --f-display: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-data: "BIZ UDGothic", "Hiragino Sans", "Yu Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --ink: #cfe0f0; --fg: #e3e9ef; --muted: #9aa9b7;
    --line: #2b3844; --tint: #1f2b36; --accent: #7fb6de; --accent-soft: #1d3446; --flash: #4a3d12;
    --good: #7fd3a0; --good-soft: #193526; --warn: #e8c071; --warn-soft: #3a2e14; --bad: #ef9a9a; --bad-soft: #3d1f1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --ink: #cfe0f0; --fg: #e3e9ef; --muted: #9aa9b7;
  --line: #2b3844; --tint: #1f2b36; --accent: #7fb6de; --accent-soft: #1d3446; --flash: #4a3d12;
  --good: #7fd3a0; --good-soft: #193526; --warn: #e8c071; --warn-soft: #3a2e14; --bad: #ef9a9a; --bad-soft: #3d1f1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); text-wrap: balance; margin: 0; line-height: 1.35; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: grid; gap: 6px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; color: var(--muted); }
.notice {
  display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--fg);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 8px; padding: 10px 14px; font-size: .88rem;
}
.notice b { color: var(--warn); white-space: nowrap; }

.patients { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pt {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  color: var(--fg); display: grid; gap: 2px;
}
.pt .nm { font-family: var(--f-display); font-weight: 700; color: var(--ink); }
.pt .sub { font-size: .85rem; color: var(--muted); }
.pt[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }

.main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > .hd { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.panel > .hd p { margin: 0; font-size: .85rem; color: var(--muted); }

/* カルテ */
.chart { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.chart .body { overflow: auto; padding: 4px 16px 16px; }
.cat { margin-top: 12px; }
.cat h3 { font-size: .8rem; letter-spacing: .06em; color: var(--muted); font-family: var(--f-body); font-weight: 700; padding-bottom: 4px; border-bottom: 1px dashed var(--line); }
.item { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; padding: 6px 4px; border-radius: 6px; transition: background .4s; }
.item .id { font-family: var(--f-data); font-size: .78rem; color: var(--accent); padding-top: 2px; }
.item .lb { font-size: .82rem; color: var(--muted); }
.item .vl { font-size: .92rem; }
.item.cited .id { font-weight: 700; }
.item.flash { background: var(--flash); }

/* 計画 */
.plan .hd { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.plan .hd .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; color: var(--muted); }
.src { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.src.ai { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 7px 14px; font-size: .9rem; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status { padding: 10px 16px; font-size: .88rem; border-bottom: 1px solid var(--line); background: var(--tint); }
.status.err { background: var(--bad-soft); color: var(--bad); }

.problems { display: grid; gap: 14px; padding: 16px; }
.prob { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.prob[data-st="採用"] { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.prob[data-st="修正"] { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.prob[data-st="不採用"] { opacity: .6; }
.prob .ph { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; padding: 12px 14px; background: var(--tint); }
.prob .ph h3 { font-size: 1.05rem; }
.prob .ph .no { font-family: var(--f-data); color: var(--accent); margin-right: 6px; }
.decide { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.decide button { border: 0; background: transparent; padding: 4px 12px; font-size: .85rem; color: var(--muted); }
.decide button + button { border-left: 1px solid var(--line); }
.decide button[aria-pressed="true"][data-v="採用"] { background: var(--good-soft); color: var(--good); font-weight: 700; }
.decide button[aria-pressed="true"][data-v="修正"] { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.decide button[aria-pressed="true"][data-v="不採用"] { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.pb { padding: 12px 14px 14px; display: grid; gap: 10px; }
.ev { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev .lbl, .row .lbl { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.chip { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; font-size: .8rem; }
.chip b { font-family: var(--f-data); margin-right: 4px; }
.row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; align-items: start; }
.row .lbl { padding-top: 3px; font-weight: 700; }
.ed { border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
.ed:hover { background: var(--tint); }
ul.lst { margin: 0; padding-left: 1.1em; display: grid; gap: 2px; }
.indiv { background: var(--good-soft); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.indiv .lbl { color: var(--good); font-weight: 700; margin-right: 6px; }
.missing { margin: 0 16px 16px; border: 1px dashed color-mix(in srgb, var(--warn) 55%, var(--line)); border-radius: 10px; padding: 12px 14px; }
.missing h3 { color: var(--warn); font-size: .95rem; margin-bottom: 4px; }
.missing ul { margin: 0; padding-left: 1.1em; }

.final { margin: 0 16px 16px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; font-variant-numeric: tabular-nums; }
.counts span b { font-family: var(--f-data); }
pre.out { margin: 0; white-space: pre-wrap; background: var(--tint); border-radius: 8px; padding: 12px 14px; font-family: var(--f-data); font-size: .82rem; line-height: 1.65; max-height: 420px; overflow: auto; }
.foot { font-size: .8rem; color: var(--muted); }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .chart { position: static; max-height: 420px; }
  .patients { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .item { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">浅井病院 DX推進 ・ 試作版(デモ)</div>
    <h1>個別看護計画AI 試作版</h1>
    <div class="notice"><b>架空データ</b><span>表示している患者・カルテ情報はすべて架空です。この試作版はカルテと連携しておらず、確定してもカルテには登録されません。実在の患者情報は入力しないでください。</span></div>
  </header>

  <nav class="patients" id="patients" role="tablist" aria-label="架空の患者"></nav>

  <div class="main">
    <section class="panel chart" aria-labelledby="chartTitle">
      <div class="hd">
        <h2 id="chartTitle">カルテ情報</h2>
        <p>ベンダー連携で取得する想定の項目です。計画案の根拠タグを押すと該当箇所が光ります。</p>
      </div>
      <div class="body" id="chart"></div>
    </section>

    <section class="panel plan" aria-labelledby="planTitle">
      <div class="hd">
        <h2 id="planTitle">看護計画案</h2>
        <div class="actions">
          <button class="btn" id="stopBtn" hidden>中止</button>
          <button class="btn primary" id="genBtn">AIで計画案を作成</button>
        </div>
        <div class="meta"><span class="src" id="srcTag">事前作成の例</span><span id="srcNote">各問題を「採用・修正・不採用」で判断してください。文章は直接クリックして修正できます。</span></div>
      </div>
      <div class="status" id="status" hidden></div>
      <div class="problems" id="problems"></div>
      <div class="missing" id="missing"></div>
      <div class="final">
        <div class="counts" id="counts"></div>
        <div class="actions" style="justify-content:flex-start">
          <button class="btn primary" id="finBtn">確定(試作)</button>
          <button class="btn" id="copyBtn" hidden>テキストをコピー</button>
          <button class="btn" id="resetBtn">事前作成の例に戻す</button>
        </div>
        <pre class="out" id="out" hidden></pre>
        <div class="foot">AIの出力は下書きです。最終判断と確定は看護師が行います(要件定義書 第2章・第7章)。</div>
      </div>
    </section>
  </div>
</div>

const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const state = { idx: 0, plans: {} };
PATIENTS.forEach(p => { state.plans[p.key] = freshPlan(clone(p.sample), "sample"); });

function freshPlan(data, source) {
  data.problems.forEach(pr => { pr.status = "未判断"; });
  return { ...data, source, finalized: false };
}
function cur() { return PATIENTS[state.idx]; }
function plan() { return state.plans[cur().key]; }

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function renderPatients() {
  const nav = $("patients"); nav.textContent = "";
  PATIENTS.forEach((p, i) => {
    nav.append(el("button", { class: "pt", role: "tab", "aria-selected": String(i === state.idx), onclick: () => { state.idx = i; renderAll(); } },
      el("span", { class: "nm" }, p.name), el("span", { class: "sub" }, p.sub)));
  });
}

function renderChart() {
  const box = $("chart"); box.textContent = "";
  const cited = new Set(plan().problems.flatMap(pr => pr.evidence));
  let lastCat = null, group;
  for (const [cat, id, label, value] of cur().chart) {
    if (cat !== lastCat) { group = el("div", { class: "cat" }, el("h3", {}, cat)); box.append(group); lastCat = cat; }
    group.append(el("div", { class: "item" + (cited.has(id) ? " cited" : ""), id: "c-" + id },
      el("span", { class: "id" }, id),
      el("div", {}, el("div", { class: "lb" }, label), el("div", { class: "vl" }, value))));
  }
}

function flash(id) {
  const n = document.getElementById("c-" + id); if (!n) return;
  n.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  n.classList.add("flash"); setTimeout(() => n.classList.remove("flash"), 1600);
}

function editable(text, onEdit) {
  const s = el("span", { class: "ed", contenteditable: "true", spellcheck: "false" }, text);
  s.addEventListener("input", () => onEdit(s.textContent));
  return s;
}

function renderPlan() {
  const p = plan(), patient = cur();
  const labelOf = Object.fromEntries(patient.chart.map(c => [c[1], c[2]]));
  $("srcTag").textContent = p.source === "ai" ? "AIが作成した案" : "事前作成の例";
  $("srcTag").className = "src" + (p.source === "ai" ? " ai" : "");
  const box = $("problems"); box.textContent = "";
  p.problems.forEach((pr, i) => {
    const markEdit = () => { if (pr.status !== "不採用") { pr.status = "修正"; updateCard(card, pr); renderCounts(); } };
    const listRow = (lbl, key) => el("div", { class: "row" }, el("span", { class: "lbl" }, lbl),
      el("ul", { class: "lst" }, ...pr[key].map((t, j) => el("li", {}, editable(t, v => { pr[key][j] = v; markEdit(); })))));
    const decide = el("div", { class: "decide", role: "group", "aria-label": "判断" },
      ...["採用", "修正", "不採用"].map(v => el("button", { "data-v": v, "aria-pressed": "false", onclick: () => { pr.status = v; updateCard(card, pr); renderCounts(); } }, v)));
    const card = el("article", { class: "prob" },
      el("div", { class: "ph" }, el("h3", {}, el("span", { class: "no" }, "#" + (i + 1)), pr.title), decide),
      el("div", { class: "pb" },
        el("div", { class: "ev" }, el("span", { class: "lbl" }, "根拠"),
          ...pr.evidence.map(id => el("button", { class: "chip", onclick: () => flash(id), title: "カルテの該当箇所を表示" }, el("b", {}, id), labelOf[id] || ""))),
        el("div", { class: "row" }, el("span", { class: "lbl" }, "長期目標"), editable(pr.longGoal, v => { pr.longGoal = v; markEdit(); })),
        el("div", { class: "row" }, el("span", { class: "lbl" }, "短期目標"), editable(pr.shortGoal, v => { pr.shortGoal = v; markEdit(); })),
        listRow("OP 観察", "op"), listRow("TP 援助", "tp"), listRow("EP 指導", "ep"),
        el("div", { class: "row" }, el("span", { class: "lbl" }, "評価日"), editable(pr.evalDate, v => { pr.evalDate = v; markEdit(); })),
        el("div", { class: "indiv" }, el("span", { class: "lbl" }, "個別性"), pr.individuality)));
    updateCard(card, pr);
    box.append(card);
  });
  const m = $("missing"); m.textContent = "";
  m.append(el("h3", {}, "カルテに記録がなく、確認が必要な情報"),
    p.missing.length ? el("ul", {}, ...p.missing.map(t => el("li", {}, t))) : el("p", {}, "なし"));
  $("out").hidden = !p.finalized; $("copyBtn").hidden = !p.finalized;
  if (p.finalized) $("out").textContent = planText();
  renderCounts();
}

function updateCard(card, pr) {
  card.dataset.st = pr.status;
  card.querySelectorAll(".decide button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === pr.status)));
}

function renderCounts() {
  const c = { 採用: 0, 修正: 0, 不採用: 0, 未判断: 0 };
  plan().problems.forEach(pr => c[pr.status]++);
  const box = $("counts"); box.textContent = "";
  for (const k of ["採用", "修正", "不採用", "未判断"]) box.append(el("span", {}, k + " ", el("b", {}, String(c[k]))));
  $("finBtn").disabled = c.未判断 > 0;
  $("finBtn").title = c.未判断 > 0 ? "すべての問題を判断すると確定できます" : "";
}

function planText() {
  const p = plan(), lines = [`看護計画(${cur().name})  ※試作版・架空データ`, ""];
  p.problems.filter(pr => pr.status !== "不採用").forEach((pr, i) => {
    lines.push(`#${i + 1} ${pr.title}`, `長期目標:${pr.longGoal}`, `短期目標:${pr.shortGoal}`,
      "OP:", ...pr.op.map(t => "・" + t), "TP:", ...pr.tp.map(t => "・" + t), "EP:", ...pr.ep.map(t => "・" + t),
      `評価日:${pr.evalDate}`, "");
  });
  return lines.join("\n");
}

function setStatus(msg, err) { const s = $("status"); s.hidden = !msg; s.textContent = msg || ""; s.className = "status" + (err ? " err" : ""); }

function renderAll() { renderPatients(); renderChart(); renderPlan(); setStatus(""); }

$("finBtn").onclick = () => { plan().finalized = true; renderPlan(); setStatus("確定しました(試作版のため、カルテには登録されません)。"); };
$("resetBtn").onclick = () => { state.plans[cur().key] = freshPlan(clone(cur().sample), "sample"); renderAll(); };
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent); setStatus("コピーしました。"); }
  catch { const r = document.createRange(); r.selectNodeContents($("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setStatus("テキストを選択しました。コピーしてください。"); }
};

// ---- AI作成(sample capability) ----
function buildPrompt(p) {
  const chartText = p.chart.map(([cat, id, label, value]) => `[${id}] ${cat}/${label}:${value}`).join("\n");
  return `あなたは日本の急性期病院の経験豊富な看護師です。以下の電子カルテ情報だけを使い、この患者に合った個別性のある看護計画の下書きを作成してください。今日は2026年10月14日です。

# ルール
- 看護問題は優先順位の高い順に2〜4つ。
- 各問題の evidence には、根拠にしたカルテ情報のID(例 "R1")を必ず入れる。カルテにない情報を根拠にしない。推測で事実を作らない。
- 目標は患者を主語にし、期限と観察できる状態を入れる。
- OP(観察)・TP(援助)・EP(指導)はこの患者の生活背景・意向・できるADLを反映した具体的な内容にする。標準的な一般論だけにしない。
- 医師の指示を超える薬剤・治療を提案しない。必要なら「医師に相談」と書く。
- individuality には標準看護計画から変えた点とその理由を1文で書く。
- 計画に必要だがカルテに記録がない情報は missing に挙げる。
- evalDate は "10/17" の形式。
- 日本語で、看護記録として自然な表現にする。

# カルテ情報
${chartText}

# 出力
次の形のJSONだけを返してください。説明文やコードブロックは不要です。
{"problems":[{"title":"","evidence":["ID"],"longGoal":"","shortGoal":"","op":[""],"tp":[""],"ep":[""],"evalDate":"","individuality":""}],"missing":[""]}`;
}

function validPlan(data, p) {
  const ids = new Set(p.chart.map(c => c[1]));
  const str = (v) => typeof v === "string" ? v : "";
  const arr = (v) => Array.isArray(v) ? v.map(String).filter(Boolean) : [];
  if (!data || !Array.isArray(data.problems) || !data.problems.length) return null;
  return {
    problems: data.problems.slice(0, 5).map(pr => ({
      title: str(pr.title) || "(無題)", evidence: arr(pr.evidence).filter(id => ids.has(id)),
      longGoal: str(pr.longGoal), shortGoal: str(pr.shortGoal), op: arr(pr.op), tp: arr(pr.tp), ep: arr(pr.ep),
      evalDate: str(pr.evalDate), individuality: str(pr.individuality)
    })),
    missing: arr(data.missing)
  };
}

const ERR = {
  not_granted: "AIの利用が許可されていません。事前作成の例でお試しください。",
  rate_limited: "AIへの依頼が集中しています。少し時間をおいてからもう一度押してください。",
  invalid_json: "AIの回答を読み取れませんでした。もう一度押してください。",
  refused: "AIが作成できませんでした。事前作成の例でお試しください。",
  prompt_too_large: "カルテ情報が多すぎて送れませんでした。"
};

let sample = null, ctl = null;
$("genBtn").hidden = true;
(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) $("genBtn").hidden = false;
  else $("srcNote").textContent = "この画面ではAI作成を利用できないため、事前作成の例を表示しています。";
})();

$("stopBtn").onclick = () => ctl?.abort();
$("genBtn").onclick = async () => {
  if (!sample) return;
  const p = cur(), key = p.key;
  ctl = new AbortController();
  $("genBtn").disabled = true; $("stopBtn").hidden = false;
  setStatus("AIがカルテ情報を読んで計画案を作成しています(30秒〜1分ほどかかります)…");
  try {
    const data = await sample.json(buildPrompt(p), { signal: ctl.signal, modelTier: "default" });
    const v = validPlan(data, p);
    if (!v) throw { code: "invalid_json" };
    state.plans[key] = freshPlan(v, "ai");
    if (cur().key === key) { renderChart(); renderPlan(); setStatus("AIの計画案を表示しました。根拠を確かめてから判断してください。"); }
  } catch (e) {
    if (e?.code === "cancelled") setStatus("中止しました。");
    else { setStatus(ERR[e?.code] || "AIの作成に失敗しました。もう一度押してください。", true); if (e?.code === "not_granted") $("genBtn").hidden = true; }
  } finally {
    $("genBtn").disabled = false; $("stopBtn").hidden = true;
  }
};

renderAll();
</script>
