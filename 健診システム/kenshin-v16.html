    + siHTML('協会けんぽ',sl.bKyokaiPm,bl.pmKyokai,'午後')
    + siHTML('一般・その他',sl.bGeneralPm,bl.pmGeneral,'午後')
    + siHTML('午後合計',sl.pmTotal,bl.pmTotal,'午後')
    + (sl.bUnsetPm>0?siHTML('種別未設定',sl.bUnsetPm,0,'午後'):'<div></div>')
    + '</div></div>'
    + '<div class="ss"><div class="ss-title">1日合計</div>'
    + '<div class="sg4">'
    + siHTML('子宮',sl.shikyu,lm.shikyu,'1日')+siHTML('健診',sl.kenshin,lm.kenshin,'1日')
    + siHTML('🍣誠寿司',sl.seisushi,0,'')+'<div></div>'+'</div>'
    + ((sl.dwibs||sl.rocomo||sl.daicho)?'<div class="sg4" style="margin-top:5px;">'+siHTML('DWIBS',sl.dwibs,0,'')+siHTML('ロコモ',sl.rocomo,0,'')+siHTML('大腸F',sl.daicho,0,'')+'<div></div></div>':'')
    + '</div>';
}

// ═══════════════════════════════════════════
// カレンダー
// ═══════════════════════════════════════════
function renderCalendar() {
  var el = document.getElementById('tab-calendar-content');
  if (!el) return;
  var y = currentYear, m = currentMonth;
  var first = new Date(y,m,1), last = new Date(y,m+1,0);
  var today = todayStr();
  var baseYear = new Date().getFullYear();
  var cells = [];
  for (var i = 0; i < first.getDay(); i++) cells.push(null);
  for (var d = 1; d <= last.getDate(); d++) cells.push(new Date(y,m,d));
  while (cells.length%7 !== 0) cells.push(null);
  // 月によって高さが変わらないよう、常に6週（42セル）で表示する
  while (cells.length < 42) cells.push(null);

  var grid = '';
  for (var i = 0; i < 7; i++) {
    grid += '<div class="cal-head '+(i===0?'c-sun':i===6?'c-sat':'')+'">' + DOW[i] + '</div>';
  }
  for (var ci = 0; ci < cells.length; ci++) {
    var dt = cells[ci];
    if (!dt) { grid += '<div class="cal-cell empty"></div>'; continue; }
    var ds = y+'-'+pad(m+1)+'-'+pad(dt.getDate());
    var dow = dt.getDay();
    var sl = calcSlots(ds), lm = getLimits(ds);
    var active = reservations.filter(function(r){return r.date===ds&&(r.status==='reserved'||r.status==='changed');}).length;
    var hasComp = reservations.some(function(r){return r.date===ds&&r.reservationType==='company'&&(r.status==='reserved'||r.status==='changed');});
    var hasLocker = !!lockerOverrides[ds];
    var hasSlotOv = hasSlotOverride(ds);
    // ドクター変更・休みの反映用
    var docOv = doctorOverrides.find(function(o){return o.date===ds;});
    var docOffList = [];
    if (docOv) {
      var _def = DEF_DOCS[dow]||[];
      docOffList = _def.filter(function(d){ return (docOv.doctors||[]).indexOf(d)<0; });
      (docOv.off||[]).forEach(function(d){ if (docOffList.indexOf(d)<0) docOffList.push(d); });
    }

    // ── 検査項目ごとの満枠チェック（MAXに達した項目名を集める）──
    var fullItems = [];
    if (sl.amGf>=lm.gfAm)         fullItems.push('胃カメ午前');
    if (sl.pmGf>=lm.gfPm)         fullItems.push('胃カメ午後');
    if (lm.bariumAm!==null && lm.bariumAm!==undefined && sl.amBarium>=lm.bariumAm) fullItems.push('バリウム午前');
    if (lm.mammoAm!==null && lm.mammoAm!==undefined && sl.amMammo>=lm.mammoAm) fullItems.push('マンモ午前');
    if (lm.mammoPm!==null && lm.mammoPm!==undefined && sl.pmMammo>=lm.mammoPm) fullItems.push('マンモ午後');
    if (lm.bariumPm!==null && lm.bariumPm!==undefined && sl.pmBarium>=lm.bariumPm) fullItems.push('バリウム午後');
    if (sl.amMri>=lm.mriAm)       fullItems.push('MRI午前');
    if (sl.pmMri>=lm.mriPm)       fullItems.push('MRI午後');
    if (sl.amKeinyuu>=lm.keinyuuAm) fullItems.push('頚乳午前');
    if (sl.pmKeinyuu>=lm.keinyuuPm) fullItems.push('頚乳午後');
    if (sl.amMale>=lm.amMale)   fullItems.push('男午前');
    if (sl.pmMale>=lm.pmMale)   fullItems.push('男午後');
    if (sl.amFemale>=lm.amFemale) fullItems.push('女午前');
    if (sl.pmFemale>=lm.pmFemale) fullItems.push('女午後');
    if (sl.shikyu>=lm.shikyu)   fullItems.push('子宮');
    if (sl.kenshin>=lm.kenshin) fullItems.push('健診');

    // ── 種別枠（バケット）の注意/満枠/超過判定 ──
    var bl = getBucketLimits(ds);
    var overItems = [];
    function bktTier(used, limit, name) {
      if (limit<=0) return;
      if (used>limit) overItems.push(name);
      else if (used===limit) fullItems.push(name);
      else if (used/limit>=0.8) nearItems.push(name);
    }

    // ── 80%以上（もうすぐ満枠）の項目 ──
    var nearItems = [];
    if (sl.amGf<lm.gfAm && sl.amGf/lm.gfAm>=0.8)         nearItems.push('胃カメ午前');
    if (sl.pmGf<lm.gfPm && sl.pmGf/lm.gfPm>=0.8)         nearItems.push('胃カメ午後');
    if (lm.bariumAm!==null && lm.bariumAm!==undefined && lm.bariumAm>0 && sl.amBarium<lm.bariumAm && sl.amBarium/lm.bariumAm>=0.8) nearItems.push('バリウム午前');
    if (lm.mammoAm!==null && lm.mammoAm!==undefined && lm.mammoAm>0 && sl.amMammo<lm.mammoAm && sl.amMammo/lm.mammoAm>=0.8) nearItems.push('マンモ午前');
    if (lm.mammoPm!==null && lm.mammoPm!==undefined && lm.mammoPm>0 && sl.pmMammo<lm.mammoPm && sl.pmMammo/lm.mammoPm>=0.8) nearItems.push('マンモ午後');
    if (lm.bariumPm!==null && lm.bariumPm!==undefined && lm.bariumPm>0 && sl.pmBarium<lm.bariumPm && sl.pmBarium/lm.bariumPm>=0.8) nearItems.push('バリウム午後');
    if (sl.amMri<lm.mriAm && sl.amMri/lm.mriAm>=0.8)     nearItems.push('MRI午前');
    if (sl.pmMri<lm.mriPm && sl.pmMri/lm.mriPm>=0.8)     nearItems.push('MRI午後');
    if (sl.amKeinyuu<lm.keinyuuAm && sl.amKeinyuu/lm.keinyuuAm>=0.8) nearItems.push('頚乳午前');
    if (sl.pmKeinyuu<lm.keinyuuPm && sl.pmKeinyuu/lm.keinyuuPm>=0.8) nearItems.push('頚乳午後');
    if (sl.amMale<lm.amMale && sl.amMale/lm.amMale>=0.8) nearItems.push('男午前');
    if (sl.amFemale<lm.amFemale && sl.amFemale/lm.amFemale>=0.8) nearItems.push('女午前');

    // 種別枠バケット＋午前/午後合計（80%注意・100%満枠・100%超過）
    bktTier(sl.bDockAm,    bl.dockAm,    'ドック');
    bktTier(sl.bOtherAm,   bl.amOther,   '協会一般');
    bktTier(sl.bKyokaiPm,  bl.pmKyokai,  '午後協会');
    bktTier(sl.bGeneralPm, bl.pmGeneral, '午後一般他');
    bktTier(sl.amTotal,    bl.amTotal,   '午前計');
    bktTier(sl.pmTotal,    bl.pmTotal,   '午後計');

    var isOver = overItems.length > 0;
    var isFull = !isOver && fullItems.length > 0;
    var isNear = !isOver && !isFull && nearItems.length > 0;
    var clx = 'cal-cell'
      + (ds===selectedDate?' sel':'')
      + ((isFull||isOver)&&dow!==0?' full-c':'')
      + (isNear&&dow!==0?' near-c':'')
      + (ds===today?' today-c':'');
    var onclick = dow===0 ? '' : ' onclick="selectDate(\'' + ds + '\')" ondblclick="openDayView(\'' + ds + '\')"';

    // 超過タグ（最優先・濃赤）
    var overTagsHTML = '';
    if (overItems.length>0 && dow!==0) {
      overTagsHTML = '<div class="cal-full-wrap">'
        + overItems.slice(0,3).map(function(name){return '<span class="cal-over-tag">超過'+name+'</span>';}).join('')
        + (overItems.length>3?'<span class="cal-over-tag">+'+(overItems.length-3)+'</span>':'')
        + '</div>';
    }
    // 満枠タグHTML（最大4個まで表示、それ以上は「+N」）
    var fullTagsHTML = '';
    if (fullItems.length>0 && dow!==0) {
      var showFull = fullItems.slice(0,4);
      fullTagsHTML = '<div class="cal-full-wrap">'
        + showFull.map(function(name){return '<span class="cal-full-tag">満'+name+'</span>';}).join('')
        + (fullItems.length>4?'<span class="cal-full-tag">+'+(fullItems.length-4)+'</span>':'')
        + '</div>';
    }
    // 80%タグ（満枠・超過がない時だけ表示）
    var nearTagsHTML = '';
    if (!isFull && !isOver && nearItems.length>0 && dow!==0) {
      nearTagsHTML = '<div class="cal-full-wrap">'
        + nearItems.slice(0,3).map(function(name){return '<span class="cal-near-tag">'+name+'</span>';}).join('')
        + '</div>';
    }
    // 午前/午後合計の極小行（予約がある日のみ）
    var ampmHTML = (dow!==0 && (sl.amTotal>0||sl.pmTotal>0))
      ? '<div class="cal-ampm">AM '+sl.amTotal+'/'+bl.amTotal+'・PM '+sl.pmTotal+'/'+bl.pmTotal+'</div>'
      : '';

    grid += '<div class="'+clx+'"'+onclick+'>'
      + '<div class="cal-dn '+(dow===0?'c-sun':dow===6?'c-sat':'')+'">' + dt.getDate() + '</div>'

      + ampmHTML
      + overTagsHTML
      + fullTagsHTML
      + nearTagsHTML
      + '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;align-items:center;">'
      + (hasLocker?'<span style="font-size:13px;">🔒</span>':'')
      + (hasSlotOv?'<span style="font-size:13px;">⚡</span>':'')
      + (hasTypeLimitOverride(ds)?'<span style="font-size:13px;">📊</span>':'')
      + (hasComp?'<span style="font-size:13px;">🏢</span>':'')
      + (sl.seisushi>0?'<span style="font-size:13px;">🍣</span>':'')
      + (massageOffs[ds]?'<span style="font-size:12px;background:#F3E8FF;color:#7E22CE;border-radius:4px;padding:1px 4px;font-weight:700;" title="'+esc(massageOffs[ds].note||'')+'">💆'+(massageOffs[ds].type==='all'?'休':massageOffs[ds].type==='am'?'AM休':'PM休')+'</span>':'')
      + (docOv?'<span style="font-size:11px;background:#E0E7FF;color:#3730A3;border-radius:4px;padding:0 3px;font-weight:700;" title="担当医: '+esc((docOv.doctors||[]).join('、'))+(docOffList.length?' ／ 休: '+esc(docOffList.join('、')):'')+'">🩺'+(docOffList.length?'':'変')+'</span>':'')

      + (dow===0?'<span style="font-size:11px;color:#F87171;font-weight:600;">休診</span>':'')
      + '</div>'
      + (docOffList.length
          ? '<div title="この日お休みの担当医" style="margin-top:3px;border-radius:5px;padding:2px 5px;font-size:10.5px;font-weight:700;text-align:center;background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;line-height:1.3;">🩺 休 '+esc(docOffList.join('、'))+'</div>'
          : '')
      + ((dow!==0 && (sl.amTotal>0||sl.pmTotal>0))
          ? '<div onclick="event.stopPropagation();toggleKartePrep(\''+ds+'\')" title="クリックでカルテ準備の 済／未 を切替'+(isKartePrepDone(ds)&&kartePrepDone[ds].by?'（'+esc(kartePrepDone[ds].by)+'）':'')+'" '
            + 'style="margin-top:3px;cursor:pointer;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:700;text-align:center;'
            + (isKartePrepDone(ds)
                ? 'background:#DCFCE7;color:#166534;border:1px solid #86EFAC;">✅ カルテ済'
                : 'background:#FFF7ED;color:#C2410C;border:1px dashed #FDBA74;">📋 カルテ未')
            + '</div>'
          : '')
      + ((dow!==0 && (sl.amTotal>0||sl.pmTotal>0))
          ? (function(){ var hs=hassouStatus(ds); if(hs.total<=0) return '';
              var allSent = hs.sent===hs.total;
              return '<div onclick="event.stopPropagation();bulkHassou(\''+ds+'\')" title="クリックで事前送付を一括発送済／解除（'+hs.sent+'/'+hs.total+'）" style="margin-top:3px;cursor:pointer;border-radius:5px;padding:2px 5px;font-size:10.5px;font-weight:700;text-align:center;line-height:1.3;'
                + (allSent ? 'background:#E0F2FE;color:#075985;border:1px solid #7DD3FC;">📮 発送済'
                           : hs.sent>0 ? 'background:#F0F9FF;color:#0369A1;border:1px solid #BAE6FD;">📮 発送 '+hs.sent+'/'+hs.total
                           : 'background:#F8FAFC;color:#64748b;border:1px dashed #CBD5E1;">📮 未発送')
                + '</div>'; })()
          : '')
      + '</div>';
  }

  var isNY = y > baseYear;
  el.innerHTML = '<div class="card">'
    + '<div class="card-head"><div class="ym-nav">'
    + '<button class="btn" onclick="prevMonth()">‹ 前月</button>'
    + '<select class="ym-sel" onchange="currentYear=parseInt(this.value);renderCalendar()">'+yearOptions(y)+'</select>'
    + '<select class="ym-sel" onchange="currentMonth=parseInt(this.value)-1;renderCalendar()">'+monthOptions(m)+'</select>'
    + '<button class="btn" onclick="nextMonth()">翌月 ›</button>'
    + (isNY?'<span class="ny-badge">翌年表示中</span>':'')
    + '</div></div>'
    + '<div class="cal-grid">'+grid+'</div>'
    + '<div class="leg-row">'
    + '<div class="leg-it"><span class="cal-full-tag">満胃カメ午前</span>検査が満枠</div>'
    + '<div class="leg-it"><span class="cal-near-tag">胃カメ午前</span>80%超</div>'
    + '<div class="leg-it"><span class="cal-over-tag">超過ドック</span>上限超過</div>'
    + '<div class="leg-it">🔒ロッカー変更</div><div class="leg-it">⚡検査枠変更</div><div class="leg-it">📊種別枠変更</div><div class="leg-it">🏢企業予約</div><div class="leg-it">🍣誠寿司</div><div class="leg-it"><span style="background:#F3E8FF;color:#7E22CE;border-radius:4px;padding:0 3px;font-size:10px;">💆休</span> マッサージ休み</div><div class="leg-it"><span style="background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;border-radius:4px;padding:0 3px;font-size:10px;">🩺 休 医師名</span> ドクター休み</div><div class="leg-it"><span style="background:#DCFCE7;color:#166534;border-radius:4px;padding:0 3px;font-size:10px;">✅カルテ済</span> / <span style="background:#FFF7ED;color:#C2410C;border-radius:4px;padding:0 3px;font-size:10px;">📋カルテ未</span>（クリックで切替）</div><div class="leg-it"><span style="background:#E0F2FE;color:#075985;border:1px solid #7DD3FC;border-radius:4px;padding:0 3px;font-size:10px;">📮 発送済</span> 事前送付</div>'
    + '</div></div>'
    + '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 14px;font-size:13px;color:#1D4ED8;margin-bottom:10px;">'
    + '選択中: <strong>'+selectedDate+'</strong>'+(isNY?'<span class="ny-badge">'+y+'年</span>':'')+'<span style="font-size:11px;color:#64748b;margin-left:8px;">💡 日付をダブルクリックで日別予約へ</span>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;">'
    + '<button class="btn" style="flex:1;min-width:150px;" onclick="openMassageModal()">💆 マッサージ休みを設定</button>'
    + '<button class="btn" style="flex:1;min-width:150px;" onclick="openDoctorModal()">🩺 ドクター休み・変更を設定</button>'
    + '</div>'
    + '<button onclick="toggleKartePrep(\''+selectedDate+'\')" style="width:100%;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;border:1px solid '
    + (isKartePrepDone(selectedDate) ? '#86EFAC;background:#DCFCE7;color:#166534;">✅ カルテ準備 済（クリックで未に戻す）' : '#FDBA74;background:#FFF7ED;color:#C2410C;">📋 カルテ準備を「済」にする')
    + (isKartePrepDone(selectedDate)&&kartePrepDone[selectedDate].by ? '<span style="font-size:11px;font-weight:400;margin-left:6px;">'+esc(kartePrepDone[selectedDate].by)+' '+esc(kartePrepDone[selectedDate].at||'')+'</span>' : '')
    + '</button>'
    + '<button onclick="bulkHassou(\''+selectedDate+'\')" style="width:100%;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;border:1px solid #7DD3FC;background:#E0F2FE;color:#075985;">📮 事前送付を一括で発送済にする（もう一度で解除）</button>'
    + '<div style="font-size:11px;color:#64748b;margin-bottom:6px;">↑ 選択中の日（'+selectedDate+'）に対して設定します。設定するとこのカレンダーにマークが表示されます。</div>'
    + '<button class="btn btn-primary" style="width:100%;padding:10px;" onclick="goToDayView()">📋 '+selectedDate+' の予約一覧を見る</button>';
}
function prevMonth() { if(currentMonth===0){currentYear--;currentMonth=11;}else currentMonth--; renderCalendar(); }
function nextMonth() { if(currentMonth===11){currentYear++;currentMonth=0;}else currentMonth++; renderCalendar(); }
function selectDate(ds) {
  selectedDate = ds;
  document.getElementById('sel-disp').textContent = '選択: ' + ds;
  renderCalendar();
}
function openDayView(ds) {
  selectedDate = ds;
  document.getElementById('sel-disp').textContent = '選択: ' + ds;
  switchTab('day');
}

function resRowHTML(r, isHist) {
  var stLabel = {reserved:'予約中',changed:'変更あり',rescheduled:'日程変更済み',cancelled:'キャンセル済み',noshow:'当日未受診'}[r.status] || r.status;
  var stBCl = {reserved:'bd-blue',changed:'bd-amber',rescheduled:'bd-sky',cancelled:'bd-red',noshow:'bd-purple'}[r.status] || 'bd-gray';
  var stTag = r.stomachExamType==='camera' ? '胃カメラ'+((r.stomachExamTime||r.timeSlot)==='pm'?'(PM)':'(AM)')
            : r.stomachExamType==='barium' ? '胃バリウム'+((r.stomachExamTime||r.timeSlot)==='pm'?'(PM)':'(AM)')
            : r.stomachExamType==='none'   ? '胃なし' : '';
  var mmTag = r.hasMammo ? 'マンモ'+((r.mammoTime||r.timeSlot)==='pm'?'(PM)':'(AM)') : '';
  var examTags = [stTag,mmTag,r.hasMRI&&'MRI',r.hasKeidou&&'頚動脈',r.hasNyuecho&&'乳エコー',r.hasShikyu&&'子宮',r.hasMRCP&&'MRCP',r.hasDWIBS&&'DWIBS',r.hasRocomo&&'ロコモ',r.hasDaicho&&'大腸F',r.hasCT&&'CT',r.hasNinchi&&'認知',r.hasKotsu&&'骨密度',r.hasMD&&'M-D',r.hasShiya&&'視野',r.hasKekka&&'結果説明',r.hasMRIKekka&&'MRI結果説明',r.hasMassage&&'マッサージ'].filter(Boolean);
  var slotB = r.timeSlot==='am'
    ? '<span class="badge" style="background:#EFF6FF;color:#3B82F6;font-size:10px;">午前</span>'
    : '<span class="badge" style="background:#F5F3FF;color:#7C3AED;font-size:10px;">午後</span>';
  var karteCl = r.karte==='prepared'?'bd-green':r.karte==='sent'?'bd-blue':r.karte==='unnecessary'?'bd-gray':'bd-amber';
  var karteLbl = {prepared:'準備済み',unprepared:'未準備',sent:'📮 送付済',unnecessary:'不要'}[r.karte] || '';
  if (r.karte==='sent' && r.documentSentAt) karteLbl += '（'+r.documentSentAt.slice(5).replace('-','/')+'）';
  var cc = r.reservationType==='company' ? getCC(r) : null;
  var stripe = cc ? '<div class="co-stripe" style="background:'+cc.stripe+';"></div>' : '';
  var compB = cc ? '<span class="badge" style="background:'+cc.bg+';color:'+cc.text+';border:1px solid '+cc.stripe+';font-size:10px;margin-left:3px;">🏢 '+r.companyName+'</span>' : '';
  var examH = examTags.map(function(t){return '<span class="badge bd-indigo" style="margin-right:2px;font-size:10px;">'+t+'</span>';}).join('');
  if (r.stomachExamType==='camera' && r.gfDoctor) {
    examH += '<span class="badge" style="background:#E0F2FE;color:#0369A1;border:1px solid #7DD3FC;margin-right:2px;font-size:10px;">🩺 胃カメラ指名: '+r.gfDoctor+'</span>';
  }
  var histH = (r.changeHistory&&r.changeHistory.length>0)
    ? '<div class="hist-box">変更履歴: '+r.changeHistory.map(function(h){return h.at+' '+h.by+'「'+h.memo+'」';}).join(' / ')+'</div>'
    : '';
  var metaH = (r.updatedAt||r.updatedBy) ? '<div class="rmeta">更新: '+(r.updatedAt||'')+' '+(r.updatedBy?'('+r.updatedBy+')':'')+'</div>' : '';
  var actH = !isHist
    ? '<div class="ract">'

function fsInit(r) {
  FS.timeSlot   = r ? (r.timeSlot||'am') : 'am';
  FS.gender     = r ? (r.gender||'male') : 'male';
  FS.resType    = r ? (r.reservationType||'individual') : 'individual';
  FS.isKenshin  = r ? !!r.isKenshin : false;
  FS.stomachType = r ? (r.stomachExamType||'') : '';
  FS.stomachTime = r ? (r.stomachExamTime||'') : '';
  FS.hasMRI     = r ? !!r.hasMRI : false;
  FS.hasKeidou  = r ? ((r.hasKeidou!==undefined) ? !!r.hasKeidou : !!r.hasKeinyuu) : false;
  FS.hasNyuecho = r ? ((r.hasNyuecho!==undefined) ? !!r.hasNyuecho : !!r.hasKeinyuu) : false;
  FS.mammoTime  = r ? (r.hasMammo ? (r.mammoTime||r.timeSlot||'am') : '') : '';
  FS.hasShikyu  = r ? !!r.hasShikyu : false;
  FS.firstVisit = r ? !!r.firstVisit : false;
  FS.preMonshinStatus = r ? (r.preMonshinStatus||'') : '';
  FS.hasMRCP    = r ? !!r.hasMRCP : false;
  FS.hasDWIBS   = r ? !!r.hasDWIBS : false;
  FS.hasRocomo  = r ? !!r.hasRocomo : false;
  FS.hasDaicho  = r ? !!r.hasDaicho : false;
  FS.seisushi   = r ? (r.seisushi||'no') : 'no';
  FS.karteStatus= r ? (r.karte||'unprepared') : 'unprepared';
  FS.sushiMealType = r ? (r.sushiMealType||'unknown') : 'unknown';
  FS.examTypeId = r ? (r.examTypeId||'') : '';
  FS.akibaRequired = r ? !!r.akibaRequired : false;
  FS.akibaTimeSlot = r ? (r.akibaTimeSlot || '') : '';
  FS.companyColorIdx = r ? (r.companyColorIdx||0) : 0;
  FS.gfDoctor   = r ? (r.gfDoctor||'') : '';
}

function fsRender() {
  // 単一選択グループの更新関数
  function setSingle(prefix, values, active) {
    values.forEach(function(v) {
      var el = document.getElementById(prefix+'-'+v);
      if (!el) return;
      el.classList.toggle('on-blue', v===active);
    });
  }

  setSingle('fm-slot', ['am','pm'], FS.timeSlot);
  setSingle('fm-etype', EXAM_TYPES.map(function(t){return t.id;}), FS.examTypeId);
  setSingle('fm-gender', ['male','female'], FS.gender);

  // 予約区分（企業は紫）
  var indEl = document.getElementById('fm-restype-individual');
  var compEl = document.getElementById('fm-restype-company');
  if (indEl) { indEl.classList.toggle('on-blue', FS.resType==='individual'); }
  if (compEl) { compEl.classList.toggle('on-purple', FS.resType==='company'); }
  var cf = document.getElementById('fm-company-fields');
  if (cf) cf.style.display = FS.resType==='company' ? 'block' : 'none';

  // 誠寿司（お店／弁当／なしの3択）
  var ssStore = document.getElementById('fm-sushi-store');
  var ssBento = document.getElementById('fm-sushi-bento');
  var ssNone  = document.getElementById('fm-sushi-none');
  var sushiOn = (FS.seisushi === 'yes');
  if (ssStore) ssStore.classList.toggle('on-amber', sushiOn && FS.sushiMealType === 'store');
  if (ssBento) ssBento.classList.toggle('on-amber', sushiOn && FS.sushiMealType === 'bento');
  if (ssNone)  ssNone.classList.toggle('on-blue', !sushiOn);

  // 秋葉医院連動
  setSingle('fm-akiba', ['yes','no'], FS.akibaRequired ? 'yes' : 'no');
  var akd = document.getElementById('fm-akiba-detail');
  if (akd) akd.style.display = FS.akibaRequired ? 'block' : 'none';
  setSingle('fm-akam', ['am','blank'], FS.akibaTimeSlot==='am' ? 'am' : 'blank');

  // 事前書類（旧: 紙カルテ）
  setSingle('fm-karte', ['unprepared','prepared','sent','unnecessary'], FS.karteStatus);
  var ffy = document.getElementById('fm-first-yes'), ffn = document.getElementById('fm-first-no');
  if (ffy) ffy.classList.toggle('on-indigo', !!FS.firstVisit);
  if (ffn) ffn.classList.toggle('on-indigo', !FS.firstVisit);

  // 誠寿司 人数（お店／弁当のとき表示）
  var sd = document.getElementById('fm-sushi-detail');
  if (sd) sd.style.display = sushiOn ? 'block' : 'none';

  // 健診枠（トグル=緑）
  var kEl = document.getElementById('fm-kenshin');
  if (kEl) kEl.classList.toggle('on-green', FS.isKenshin);

  // 検査項目（複数=藍）
  var examKeys = ['hasMRI','hasKeidou','hasNyuecho','hasShikyu','hasMRCP','hasDWIBS','hasRocomo','hasDaicho','hasCT','hasNinchi','hasKotsu','hasMD','hasShiya','hasKekka','hasMRIKekka','hasMassage'];
  // 胃検査（5タブ: 種類×時間帯の組合せ／未選択は無選択表示＝既存の空欄データを保持）
  var stKey = (FS.stomachType==='none') ? 'none'
            : (FS.stomachType==='camera'||FS.stomachType==='barium') ? (FS.stomachType+'-'+(FS.stomachTime||FS.timeSlot))
            : '';
  setSingle('fm-st', ['camera-am','camera-pm','barium-am','barium-pm','none'], stKey);
  // マンモ（頸乳とは別の独立項目）
  setSingle('fm-mm', ['none','am','pm'], FS.mammoTime==='am' ? 'am' : FS.mammoTime==='pm' ? 'pm' : 'none');
  // 子宮は実施日（月・火・水・第2土／祝日除く）のみ選択可
  var shEl = document.getElementById('fm-hasShikyu');
  if (shEl) {
    var fd = dpVal('fm-date') || selectedDate;
    var canSh = isShikyuDay(fd);
    shEl.disabled = !canSh;
    shEl.style.opacity = canSh ? '' : '0.4';
    shEl.style.cursor = canSh ? '' : 'not-allowed';
    shEl.title = canSh ? '' : '子宮検査は ' + shikyuDayLabel() + ' のみ実施です（祝日を除く）';
    if (!canSh && FS.hasShikyu) FS.hasShikyu = false;
  }
  examKeys.forEach(function(k) {
    var el = document.getElementById('fm-'+k);
    if (el) el.classList.toggle('on-indigo', !!FS[k]);
  });

  // 胃カメラ指名医欄：GF選択時のみ表示
  var gfWrap = document.getElementById('fm-gfdoc-wrap');
  if (gfWrap) {
    gfWrap.style.display = FS.stomachType==='camera' ? 'block' : 'none';
    // GFを外したら指名医もクリア
    if (FS.stomachType!=='camera') FS.gfDoctor = '';
  }

  // カラースウォッチ
  var swatches = document.querySelectorAll('#color-picker .color-sw');
  swatches.forEach(function(el, i) { el.classList.toggle('on', i===FS.companyColorIdx); });

  checkWarn();
}

// クリックハンドラ（即反映）
function fmSetSlot(v)   {
  // 人間ドック系（ドック枠）は午前のみ
  var et = examTypeById(FS.examTypeId);
  if (v==='pm' && et && !et.pm) {
    alert('⚠ '+et.name+'は午前実施です。午後には設定できません。');
    return;
  }
  FS.timeSlot=v;    fsRender();
}
function fmSetExamType(id) {
  if (FS.examTypeId === id) { FS.examTypeId = ''; fsRender(); return; }  // 再クリックで解除
  FS.examTypeId = id;
  var et = examTypeById(id);
  if (et && !et.pm && FS.timeSlot==='pm') {
    FS.timeSlot = 'am';
    alert(et.name+'は午前実施のため、午前に切り替えました。');
  }
  fsRender();
}
function fmSetGender(v) { FS.gender=v;      fsRender(); }
function fmSetRT(v)     { FS.resType=v;     fsRender(); }
function fmTogK()       { FS.isKenshin=!FS.isKenshin; fsRender(); }
function fmTogE(k)      { FS[k]=!FS[k];    fsRender(); }
function fmSetGfDoc(v)  { FS.gfDoctor=v;   }
function fmSetMammo(v) { FS.mammoTime = v; fsRender(); checkWarn(); }
function fmSetStomach(t, time) {
  FS.stomachType = t;
  FS.stomachTime = (t==='camera' || t==='barium') ? (time || FS.timeSlot) : '';
  // 胃なしは時間帯を持たず、保存時に予約全体のAM/PMが入る
  fsRender(); checkWarn();
}
function buildGfDocOptions(doctors) {
  var opts = '<option value="">指名なし</option>';
  (doctors||[]).forEach(function(d){
    opts += '<option value="'+d+'"'+(FS.gfDoctor===d?' selected':'')+'>'+d+'</option>';
  });
  // 既存の指名医が当日担当に含まれない場合も選択肢に残す
  if (FS.gfDoctor && (doctors||[]).indexOf(FS.gfDoctor)<0) {
    opts += '<option value="'+FS.gfDoctor+'" selected>'+FS.gfDoctor+'（担当外）</option>';

function fmSetFirst(v)  { FS.firstVisit=v; fsRender(); }
function fmSetSMeal(v)  { FS.sushiMealType=v; fsRender(); }

/* 旧メモ（特記事項/受付/検査/連絡/重要）を1つのメモ欄へ結合して表示する。
   統合済み(memoMerged=true)の予約は memo をそのまま使う。
   旧データはDBから削除せず残したまま、表示だけを統合する。 */
function buildMergedMemo(r) {
  if (!r) return '';
  if (r.memoMerged) return r.memo || '';
  var parts = [];
  if (r.memo)          parts.push(r.memo);
  if (r.receptionMemo) parts.push('【受付メモ】\n' + r.receptionMemo);
  if (r.examMemo)      parts.push('【検査メモ】\n' + r.examMemo);
  if (r.contactMemo)   parts.push('【連絡メモ】\n' + r.contactMemo);
  if (r.importantMemo) parts.push('【重要メモ】\n' + r.importantMemo);
  return parts.join('\n\n');
}
function fmToggleDMemo() {
  var w = document.getElementById('fm-dmemo-wrap');
  var b = document.getElementById('fm-dmemo-btn');
  if (!w) return;
  var open = w.style.display !== 'none';
  w.style.display = open ? 'none' : 'block';
  if (b) b.textContent = open ? '▶ 開く' : '▼ 閉じる';
}

    + '<div id="fm-warn"></div>'

function checkWarn() {
  var date = dpVal('fm-date') || selectedDate;
  var lm = getLimits(date);
  var warns = [];
  var isAm = FS.timeSlot==='am', slot = FS.timeSlot;
  var ex = editTarget;
  function adj(fn) {
    return reservations.filter(function(r){
      return r.date===date&&(r.status==='reserved'||r.status==='changed')&&r.id!==ex&&fn(r);
    }).length;
  }
  var stT = FS.stomachTime || slot;   // 胃検査時間帯（未選択時は予約の時間帯）
  var stAm = stT==='am';
  if (FS.stomachType==='camera' && adj(function(r){return r.stomachExamType==='camera'&&(r.stomachExamTime||r.timeSlot)===stT;})+1>(stAm?lm.gfAm:lm.gfPm)) warns.push('⚡ 胃カメラ（'+(stAm?'午前':'午後')+'）上限超え');
  if (FS.stomachType==='barium') {
    var bLim = stAm ? lm.bariumAm : lm.bariumPm;
    // 上限なし運用: 枠が設定されている日のみ超過を警告（未設定は制限なしのため警告なし）
    if (bLim!==null && bLim!==undefined && adj(function(r){return r.stomachExamType==='barium'&&(r.stomachExamTime||r.timeSlot)===stT;})+1>bLim) warns.push('⚡ 胃バリウム（'+(stAm?'午前':'午後')+'）上限超え');
  }
  if (FS.hasMRI && adj(function(r){return r.hasMRI&&r.timeSlot===slot;})+1>(isAm?lm.mriAm:lm.mriPm)) warns.push('⚡ MRI（'+(isAm?'午前':'午後')+'）上限超え');
  if ((FS.hasKeidou||FS.hasNyuecho) && adj(function(r){return (r.hasKeidou||r.hasNyuecho)&&r.timeSlot===slot;})+1>(isAm?lm.keinyuuAm:lm.keinyuuPm)) warns.push('⚡ 頚動脈・乳エコー（'+(isAm?'午前':'午後')+'）上限超え');
  if (FS.mammoTime) {
    var mLim = FS.mammoTime==='am' ? lm.mammoAm : lm.mammoPm;
    if (mLim!==null && mLim!==undefined && adj(function(r){return r.hasMammo&&(r.mammoTime||r.timeSlot)===FS.mammoTime;})+1>mLim) warns.push('⚡ マンモ（'+(FS.mammoTime==='am'?'午前':'午後')+'）上限超え');
  }
  // 種別枠（バケット）の上限チェック
  var etW = examTypeById(FS.examTypeId);
  if (etW) {
    var blW = getBucketLimits(date);
    var bkCnt = adj(function(r){ var e2=examTypeById(r.examTypeId); return e2 && e2.bucket===etW.bucket && r.timeSlot===slot; }) + 1;
    var bkLim = null, bkName = '';
    if (etW.bucket==='dock' && isAm) { bkLim=blW.dockAm; bkName='人間ドック枠'; }
    else if (etW.bucket!=='dock' && isAm) {
      bkCnt = adj(function(r){ var e2=examTypeById(r.examTypeId); return e2 && e2.bucket!=='dock' && r.timeSlot==='am'; }) + 1;
      bkLim = blW.amOther; bkName='協会・一般枠（午前）';
    }
    else if (etW.bucket==='kyokai' && !isAm) { bkLim=blW.pmKyokai; bkName='協会けんぽ枠（午後）'; }
    else if (etW.bucket==='general' && !isAm) { bkLim=blW.pmGeneral; bkName='一般・その他枠（午後）'; }
    if (bkLim!==null && bkCnt>bkLim) warns.push('📊 '+bkName+' 上限超え（'+bkCnt+'/'+bkLim+'）');
    // 午前/午後の合計枠チェック
    var totalCnt = adj(function(r){return r.timeSlot===slot;}) + 1;
    var totalLim = isAm ? blW.amTotal : blW.pmTotal;
    if (totalCnt>totalLim) warns.push('📊 '+(isAm?'午前':'午後')+'合計 上限超え（'+totalCnt+'/'+totalLim+'）');
  }
  if (FS.gender==='male' && adj(function(r){return r.gender==='male'&&r.timeSlot===slot;})+1>(isAm?lm.amMale:lm.pmMale)) warns.push('⚡ 男性（'+(isAm?'午前':'午後')+'）上限超え');
  if (FS.gender==='female' && adj(function(r){return r.gender==='female'&&r.timeSlot===slot;})+1>(isAm?lm.amFemale:lm.pmFemale)) warns.push('⚡ 女性（'+(isAm?'午前':'午後')+'）上限超え');
  if (FS.hasShikyu && adj(function(r){return r.hasShikyu;})+1>lm.shikyu) warns.push('⚡ 子宮（1日）上限超え');
  if (FS.isKenshin && adj(function(r){return r.isKenshin;})+1>lm.kenshin) warns.push('⚡ 健診枠（1日）上限超え');
  var w = document.getElementById('fm-warn');
  if (w) w.innerHTML = warns.length ? '<div class="warn-box">'+warns.join('<br>')+'</div>' : '';
}

    var e = document.getElementById('fm-warn');
    if (e) e.innerHTML = '<div class="err-box">カルテ番号・氏名・カナのいずれか1つと、予約日は必須です</div>';

    var e2 = document.getElementById('fm-warn');

    course: '',
    hasGF:FS.stomachType==='camera',
    stomachExamType: FS.stomachType || '',
    stomachExamTime: (FS.stomachType==='none') ? FS.timeSlot
                   : (FS.stomachType==='camera'||FS.stomachType==='barium') ? (FS.stomachTime||FS.timeSlot)
                   : '',
    hasMRI:FS.hasMRI, hasKeidou:FS.hasKeidou, hasNyuecho:FS.hasNyuecho, hasKeinyuu:!!(FS.hasKeidou||FS.hasNyuecho), hasShikyu:FS.hasShikyu,
    hasCT:FS.hasCT, hasNinchi:FS.hasNinchi, hasKotsu:FS.hasKotsu, hasMD:FS.hasMD,
    hasShiya:FS.hasShiya, hasKekka:FS.hasKekka, hasMRIKekka:FS.hasMRIKekka, hasMassage:FS.hasMassage,
    hasMammo: !!FS.mammoTime,
    mammoTime: FS.mammoTime || '',
    hasMRCP:FS.hasMRCP, hasDWIBS:FS.hasDWIBS, hasRocomo:FS.hasRocomo, hasDaicho:FS.hasDaicho,
    firstVisit: !!FS.firstVisit,

    sushiPeopleCount: (function(){ var el=document.getElementById('fm-scount'); var n=el?parseInt(el.value):1; return (isNaN(n)||n<1)?1:n; })(),

    receptionMemo: (editTarget&&reservations.find(function(x){return x.id===editTarget;}))?(reservations.find(function(x){return x.id===editTarget;}).receptionMemo||''):'',
    examMemo: (editTarget&&reservations.find(function(x){return x.id===editTarget;}))?(reservations.find(function(x){return x.id===editTarget;}).examMemo||''):'',
    contactMemo: (editTarget&&reservations.find(function(x){return x.id===editTarget;}))?(reservations.find(function(x){return x.id===editTarget;}).contactMemo||''):'',
    importantMemo: (editTarget&&reservations.find(function(x){return x.id===editTarget;}))?(reservations.find(function(x){return x.id===editTarget;}).importantMemo||''):'',
    memoMerged: true,
    documentSentAt: FS.karteStatus==='sent' ? todayStr() : '',
    documentMemo: '',
    examTypeId: FS.examTypeId || '',
    akibaRequired: !!FS.akibaRequired,
    akibaTimeSlot: FS.akibaRequired ? (FS.akibaTimeSlot==='am' ? 'am' : '') : '',
    akibaMemo: (editTarget&&reservations.find(function(x){return x.id===editTarget;}))?(reservations.find(function(x){return x.id===editTarget;}).akibaMemo||''):'',
    examTypeName: (function(){ var et = examTypeById(FS.examTypeId); return et ? et.name : ''; })(),
    gfDoctor: FS.stomachType==='camera' ? FS.gfDoctor : '',
    memo: document.getElementById('fm-memo')?document.getElementById('fm-memo').value:'',
    karte:FS.karteStatus,
    reservationType:isComp?'company':'individual',
    companyName:isComp&&document.getElementById('fm-cname')?document.getElementById('fm-cname').value:'',
    companyGroupId:isComp?cgid:'', companyColorIdx:FS.companyColorIdx,
    status:editTarget?'changed':'reserved', changeHistory:[],
    doctors:di.doctors, doctorChanged:di.changed,
    createdBy:by, updatedBy:by, updatedAt:now
  };
  if (editTarget) {
    var old = reservations.find(function(r){return r.id===editTarget;});
    // 事前書類：モーダルでの選択を反映（v11の巻き戻し挙動を修正）。発送日は初回のみ記録
    if (FS.karteStatus==='sent') {
      data.documentSentAt = (old&&old.documentSentAt) ? old.documentSentAt : todayStr();
    } else {
      data.documentSentAt = old ? (old.documentSentAt||'') : '';
    }
    data.documentMemo = old ? (old.documentMemo||'') : '';
  var savePromise = null;
  var idx = reservations.findIndex(function(r){return r.id===editTarget;});
    if (idx>=0) {
      var merged = {};
      for (var k in reservations[idx]) merged[k] = reservations[idx][k];
      for (var k in data) merged[k] = data[k];
      reservations[idx] = merged;
      savePromise = sbUpsertReservation(merged);
      // 変更された項目を自動検出して履歴に記録
      var diffs = diffRes(old, merged);
      var summary = diffs.length>0 ? diffs.map(function(d){return d.field;}).join('・')+'を変更' : '内容を確認（変更なし）';
      merged.changeHistory = (old&&old.changeHistory?old.changeHistory:[]).concat([{at:now, by:by, memo:summary, prevStatus:old?old.status:'reserved'}]);
      if (diffs.length>0) sbInsertHistory(merged, 'edit', diffs, '', by);
      sbInsertLog(merged.id, 'edit', summary, old?old.status:null, merged.status);
      akApplyResLink(old, merged);
    }
  } else {
    // 企業予約の場合、companies テーブルへも登録
    if (isComp && cgid) sbUpsertCompany(cgid, data.companyName, FS.companyColorIdx);
    reservations.push(data);
    savePromise = sbUpsertReservation(data);
    sbInsertHistory(data, 'create', [], '新規予約を登録', by);
    sbInsertLog(data.id, 'create', '新規予約', null, data.status);
    akApplyResLink(null, data);
  }
  // Supabase接続時は保存完了を待ってから画面更新。失敗時はフォームを閉じない。
  if (SB_READY && savePromise) {
    var sbtn = document.getElementById('fm-save-btn');
    if (sbtn) { sbtn.disabled = true; sbtn.textContent = '保存中...'; }
    var okSaved = true;
    try { okSaved = await savePromise; } catch(e) { okSaved = false; }
    if (sbtn) { sbtn.disabled = false; sbtn.textContent = '登録する'; }
    if (okSaved === false) {
      showError('保存に失敗しました。通信状況をご確認のうえ、もう一度お試しください。');
      return; // フォームは開いたまま
    }
  }
  selectedDate = formDate;
  var dObj = parseYMD(formDate);
  currentYear = dObj.y; currentMonth = dObj.m-1;
  document.getElementById('sel-disp').textContent = '選択: ' + formDate;
  closeModal('form-modal');
  if (currentTab==='psearch') { renderCurrentTab(); runPSearch(); }  // 検索タブから編集時は結果を最新化
  else if (currentTab==='calendar') renderCalendar();
  else renderDay();
}

async function confResch(id) {
  var nd = dpVal('rsch-date');
  if (!nd) { alert('日付を選択してください'); return; }
  var r = reservations.find(function(x){return x.id===id;});
  if (!r) return;
  var rb2 = document.getElementById('rb2');
  var by = requireStaff('rb2', 'resch-warn');
  if (!by) return;
  var rp = document.getElementById('rp');
  var ts = (rp&&rp.classList.contains('on-blue')) ? 'pm' : 'am';
  var nid = uid();
  var di = getDoctors(nd);
  var now = nowStr();
  var _pOld = null, _pNew = null;
  var idx = reservations.findIndex(function(x){return x.id===id;});
  if (idx>=0) {
    var merged = {};
    for (var k in reservations[idx]) merged[k] = reservations[idx][k];
    merged.status = 'rescheduled';
    merged.newReservationId = nid;
    merged.changeHistory = (reservations[idx].changeHistory||[]).concat([{at:now,by:by,memo:'日程変更 → '+nd+'（'+(ts==='am'?'午前':'午後')+'）',prevStatus:r.status}]);
    reservations[idx] = merged;
    _pOld = sbUpsertReservation(merged);
    sbInsertHistory(merged, 'reschedule', [{field:'予約日', before:r.date, after:nd}], '日程変更', by);
    sbInsertLog(merged.id, 'reschedule', '日程変更 → '+nd, r.status, 'rescheduled');
    akApplyResLink(r, merged);
  }
  var newR = {};
  for (var k in r) newR[k] = r[k];
  newR.id = nid; newR.date = nd; newR.timeSlot = ts; newR.status = 'changed';
  newR.originalReservationId = id; newR.doctors = di.doctors; newR.doctorChanged = di.changed;
  newR.changeHistory = [{at:now,by:by,memo:r.date+'より日程変更',prevStatus:'reserved'}];
  newR.createdBy = by; newR.updatedBy = by; newR.updatedAt = now;
  reservations.push(newR);
  _pNew = sbUpsertReservation(newR);
  sbInsertHistory(newR, 'create', [], r.date+'から日程変更して登録', by);
  sbInsertLog(newR.id, 'create', r.date+'から日程変更', null, 'changed');
  akApplyResLink(null, newR);
  if (SB_READY && (_pOld || _pNew)) {
    var okr = true;
    try { var rs = await Promise.all([_pOld, _pNew]); okr = rs.every(function(x){ return x !== false; }); } catch(e){ okr = false; }
    if (okr === false) { showError('日程変更の保存に失敗しました。もう一度お試しください。'); return; }
  }
  closeModal('resch-modal');
  renderDay();
}

function saveDoctors() {
  var input = document.getElementById('doc-input');
  var reasonEl = document.getElementById('doc-reason');
  var byEl = document.getElementById('doc-by');
  if (!input) return;
  // 読点・改行・スラッシュ・スペースで分割
  var raw = input.value.replace(/[\/／\n]/g,'、');
  var doctors = raw.split('、').map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
  if (doctors.length===0 && !confirm('この日は担当ドクターなし（全員お休み）として登録しますか？')) return;
  var reason = reasonEl ? reasonEl.value : '';
  var by = (typeof staffVal==='function' ? staffVal('doc-by') : '') || (byEl ? byEl.value.trim() : '') || CURRENT_STAFF || '';
  var prevDi = getDoctors(selectedDate);

  // 既存の変更があれば上書き、なければ新規追加
  var existing = doctorOverrides.findIndex(function(o){return o.date===selectedDate;});
  var entry = {
    id: uid(), date: selectedDate,
    doctors: doctors,
    prev: prevDi.doctors,
    off: docOffGet(),
    by: by, at: nowStr(), reason: reason
  };
  if (existing>=0) {
    entry.id = doctorOverrides[existing].id;
    doctorOverrides[existing] = entry;
  } else {
    doctorOverrides.push(entry);
  }
  sbUpsertDoctorOverride(entry);
  saveLocal();
  // その日の予約のdoctors・doctorChangedも更新
  reservations.forEach(function(r, i){
    if (r.date===selectedDate) {
      reservations[i] = Object.assign({}, r, {doctors:doctors, doctorChanged:true});
      sbUpsertReservation(reservations[i]);
    }
  });
  closeModal('doctor-modal');
  if (currentTab==='calendar') renderCalendar();
  else renderDay();
}

function resetDoctors() {
  if (!confirm('通常の担当ドクターに戻しますか？')) return;
  var idx = doctorOverrides.findIndex(function(o){return o.date===selectedDate;});
  if (idx>=0) doctorOverrides.splice(idx,1);
  sbDeleteDoctorOverride(selectedDate);
  saveLocal();
  // 予約のdoctorsも通常に戻す
  var def = DEF_DOCS[new Date(selectedDate).getDay()]||[];
  reservations.forEach(function(r,i){
    if (r.date===selectedDate) {
      reservations[i] = Object.assign({}, r, {doctors:def, doctorChanged:false});
      sbUpsertReservation(reservations[i]);
    }
  });
  closeModal('doctor-modal');
  if (currentTab==='calendar') renderCalendar();
  else renderDay();
}

    var el = document.getElementById('sg-'+(x==='none'?'none':x));

  });

function runSearch() {
  var s = dpVal('s-start'), e = dpVal('s-end');
  if (!s||!e) { alert('検索期間を入力してください'); return; }
  if (s>e) { alert('開始日は終了日以前にしてください'); return; }
  var fGF  = document.getElementById('s-gf')  && document.getElementById('s-gf').classList.contains('on-indigo');
  var fBarium = document.getElementById('s-barium') && document.getElementById('s-barium').classList.contains('on-indigo');
  var fMammo = document.getElementById('s-mammo') && document.getElementById('s-mammo').classList.contains('on-indigo');
  var fMRI = document.getElementById('s-mri') && document.getElementById('s-mri').classList.contains('on-indigo');
  var fK   = document.getElementById('s-kn')  && document.getElementById('s-kn').classList.contains('on-indigo');
  var fSh  = document.getElementById('s-sh')  && document.getElementById('s-sh').classList.contains('on-indigo');
  var list = document.getElementById('sl');
  var countEl = document.getElementById('s-count');
  if (!list) return;
  var results = [];
  var cur = new Date(s), endD = new Date(e), safety = 0;
  while (cur <= endD && safety < 400) {
    safety++;
    var ds = cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate());
    if (cur.getDay() !== 0) {
      var sl = calcSlots(ds), lm = getLimits(ds);
      var avail = {}, ok = true;
      var slots = [];
      if (sAP!=='pm') slots.push('am');
      if (sAP!=='am') slots.push('pm');
      for (var si = 0; si < slots.length; si++) {
        var slot = slots[si], lb = slot==='am'?'午前':'午後';
        if (fGF)  { var rem=(slot==='am'?lm.gfAm:lm.gfPm)-sl[slot+'Gf'];       if(rem<=0)ok=false; else avail['胃カメラ'+lb]=rem; }
        if (fMammo) {
          var ml2=(slot==='am'?lm.mammoAm:lm.mammoPm);
          if (ml2===null||ml2===undefined) { avail['マンモ'+lb]='上限なし'; }
          else { var remM=ml2-sl[slot==='am'?'amMammo':'pmMammo']; if(remM<=0)ok=false; else avail['マンモ'+lb]=remM; }
        }
        if (fBarium) {
          var bl2=(slot==='am'?lm.bariumAm:lm.bariumPm);
          if (bl2===null||bl2===undefined) { avail['胃バリウム'+lb]='上限なし'; }   // 未設定=制限なし
          else { var remB=bl2-sl[slot==='am'?'amBarium':'pmBarium']; if(remB<=0)ok=false; else avail['胃バリウム'+lb]=remB; }
        }
        if (fMRI) { var rem=(slot==='am'?lm.mriAm:lm.mriPm)-sl[slot+'Mri'];      if(rem<=0)ok=false; else avail['MRI'+lb]=rem; }
        if (fK)   { var rem=(slot==='am'?lm.keinyuuAm:lm.keinyuuPm)-sl[slot+'Keinyuu']; if(rem<=0)ok=false; else avail['頚動脈・乳'+lb]=rem; }
        if (sG==='male')   { var key=slot+'Male';   var rem=lm[key]-sl[key]; if(rem<=0)ok=false; else avail['男性'+lb]=rem; }
        if (sG==='female') { var key=slot+'Female'; var rem=lm[key]-sl[key]; if(rem<=0)ok=false; else avail['女性'+lb]=rem; }
      }
      if (fSh) { var rem=lm.shikyu-sl.shikyu; if(rem<=0)ok=false; else avail['子宮(1日)']=rem; }
      var anyF = fGF||fBarium||fMammo||fMRI||fK||fSh||sG;
      var active = reservations.filter(function(r){return r.date===ds&&(r.status==='reserved'||r.status==='changed');}).length;
      if (!anyF||ok) results.push({ds:ds,avail:avail,sl:sl,lm:lm,active:active,dow:DOW[cur.getDay()],year:cur.getFullYear()});
    }
    cur.setDate(cur.getDate()+1);
  }
  if (countEl) countEl.textContent = results.length+'件';
  var baseYear = new Date().getFullYear();
  var lastYear = null;
  if (!results.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;">条件に合う空き日がありません</div>'; return; }
  list.innerHTML = results.slice(0,60).map(function(item){
    var yH = '';
    if (item.year !== lastYear) {
      yH = '<div style="padding:6px 14px;background:#F8FAFC;font-size:12px;font-weight:600;color:#64748b;border-bottom:1px solid #e2e8f0;">'
        + item.year+'年'+(item.year>baseYear?'<span class="ny-badge">翌年</span>':'')+'</div>';
      lastYear = item.year;
    }
    var tags = Object.keys(item.avail).map(function(k){
      return '<span class="badge bd-green" style="font-size:10px;">残'+k+':'+item.avail[k]+'</span>';
    }).join(' ');
    return yH + '<div class="search-row" onclick="goDate(\''+item.ds+'\')">'
      + '<div><span style="font-weight:600;">'+item.ds+'</span>'
      + '<span style="font-size:12px;color:#64748b;margin-left:5px;">('+item.dow+') 予約'+item.active+'件</span></div>'
      + '<div style="display:flex;gap:3px;flex-wrap:wrap;">'+(tags||'<span class="badge bd-blue" style="font-size:10px;">午前 男残'+(item.lm.amMale-item.sl.amMale)+'/女残'+(item.lm.amFemale-item.sl.amFemale)+'</span>')+'</div>'
      + '</div>';
  }).join('');
}

  selectedDate = ds;
  var ymd = parseYMD(ds);
  currentYear = ymd.y; currentMonth = ymd.m-1;
  document.getElementById('sel-disp').textContent = '選択: ' + ds;
  switchTab('day');

/* ── 予約管理⇄秋葉医院予約表の連動 ──
   予約編集で「🏥秋葉医院: あり」にすると、その日の秋葉予約表に患者名を自動掲載。
   連動エントリはresIdで識別し、手入力エントリ（resIdなし）とは干渉しない。 */
function akYmDay(dateStr) {
  var p = parseYMD(dateStr);
  return {ym: p.y + '-' + p.m, day: p.d};
}
function akRemoveResEntry(dateStr, resId) {
  if (!dateStr || !resId) return;
  var k = akYmDay(dateStr);
  var mo = akibaData[k.ym];
  if (!mo || !mo[k.day] || !mo[k.day].patients) return;
  var before = mo[k.day].patients.length;
  mo[k.day].patients = mo[k.day].patients.filter(function(p){ return p.resId !== resId; });
  if (mo[k.day].patients.length !== before) akQueueSync(k.ym, k.day);
}
function akApplyResLink(oldR, newR) {
  if (!newR) return;
  var active = !!newR.akibaRequired && (newR.status==='reserved' || newR.status==='changed');
  // 旧日付からの除去（日付変更・連動解除・キャンセル・日程変更・未受診）
  if (oldR && oldR.date && (!active || oldR.date !== newR.date)) akRemoveResEntry(oldR.date, oldR.id);
  if (!active) { akRemoveResEntry(newR.date, newR.id); return; }
  var k = akYmDay(newR.date);
  if (!akibaData[k.ym]) akibaData[k.ym] = {};
  if (!akibaData[k.ym][k.day]) {
    var w = new Date(newR.date).getDay();
    akibaData[k.ym][k.day] = {status:(w===1||w===4)?'teikyu':'open', note:'', patients:[]};
  }
  var day = akibaData[k.ym][k.day];
  if (!day.patients) day.patients = [];
  var found = null;
  for (var i=0;i<day.patients.length;i++) {
    if (day.patients[i].resId === newR.id) { found = day.patients[i]; break; }
  }
  if (found) { found.name = newR.name; found.am = (newR.akibaTimeSlot==='am'); }
  else day.patients.push({name:newR.name, am:(newR.akibaTimeSlot==='am'), resId:newR.id});
  akQueueSync(k.ym, k.day);
  if (day.status !== 'open') {
    alert('⚠ '+newR.date+' は秋葉医院が休診設定の日です。\n秋葉医院タブで診療日に変更するまで、FAX送信票には掲載されません。');
  }
}

// ═══════════════════════════════════════════
// 秋葉医院 予約表（v14統合：元アプリのデザイン・FAX印刷を維持）
// データ: akibaData['YYYY-M'][day] = {status, note, patients:[{name, am}]}
// ═══════════════════════════════════════════
var AK_WEEK = ['月','火','水','木','金','土'];
var AK_STATUSES = [
  {v:'open',    label:'診療日'},
  {v:'teikyu',  label:'休診（定休）'},
  {v:'rinji',   label:'臨時休診'},
  {v:'typhoon', label:'台風のため休診'},
  {v:'other',   label:'その他（自由入力）'}
];
var AK_CLOSED_LABEL = {teikyu:'休 診', rinji:'臨時休診', typhoon:'休 診', other:'休 診'};
var AK_CLOSED_SUB   = {typhoon:'（台風のため）'};
var akibaData = {};
var akibaStaff = '';
var akCur = {year: new Date().getFullYear(), month: new Date().getMonth()+1};
var akView = 'edit';
var akOri = 'landscape';

function akMonthKey() { return akCur.year + '-' + akCur.month; }
function akDow(d) { return new Date(akCur.year, akCur.month-1, d).getDay(); }
function akDaysInMonth() { return new Date(akCur.year, akCur.month, 0).getDate(); }
function akGetDay(d) {
  var mk = akMonthKey();
  if (!akibaData[mk]) akibaData[mk] = {};
  if (!akibaData[mk][d]) {
    var w = akDow(d);
    akibaData[mk][d] = {status: (w===1||w===4) ? 'teikyu' : 'open', note:'', patients:[]};
  }
  return akibaData[mk][d];
}
function akBuildWeeks() {
  var weeks = [], row = [null,null,null,null,null,null], used = false;
  for (var d=1; d<=akDaysInMonth(); d++) {
    var w = akDow(d);
    if (w===0) { if (used) { weeks.push(row); row=[null,null,null,null,null,null]; used=false; } continue; }
    var col = w-1;
    if (row[col]!==null) { weeks.push(row); row=[null,null,null,null,null,null]; }
    row[col]=d; used=true;
    if (w===6) { weeks.push(row); row=[null,null,null,null,null,null]; used=false; }
  }
  if (used) weeks.push(row);
  return weeks;
}

/* ── 同期（akiba_days: ym+day 単位でupsert・0.5秒デバウンス）── */
var AKIBA_SYNC_READY = false;
var akPend = {};
var akFlushTimer = null;
function akQueueSync(ym, d) {
  saveLocal();
  if (!SB_READY || !AKIBA_SYNC_READY) return;
  akPend[ym+'|'+d] = {ym:ym, d:d};
  if (akFlushTimer) clearTimeout(akFlushTimer);
  akFlushTimer = setTimeout(akFlushSync, 500);
}
async function akFlushSync() {
  akFlushTimer = null;
  if (!SB_READY || !AKIBA_SYNC_READY) return;
  var pend = akPend; akPend = {};
  var rows = [];
  Object.keys(pend).forEach(function(k){
    var p = pend[k];
    var day = (akibaData[p.ym]||{})[p.d];
    if (!day) return;
    rows.push({ym:p.ym, day:parseInt(p.d), status:day.status, note:day.note||'', patients:day.patients||[]});
  });
  if (rows.length===0) return;
  try {
    var res = await SB.from('akiba_days').upsert(rows, {onConflict:'ym,day'});
    if (res.error) console.error('[SB] akiba_days upsert', res.error);
  } catch(e) { console.error('[SB] akiba flush', e); }
}
function akSyncMonth(ym) {  // JSON読込時などの一括同期
  var mo = akibaData[ym]||{};
  Object.keys(mo).forEach(function(d){ akQueueSync(ym, d); });
}

function akRenderEdit() {
  var weeks = akBuildWeeks();

/* ── 編集ハンドラ ── */
function akSetStatus(d, v) { akGetDay(d).status = v; akQueueSync(akMonthKey(), d); akRenderEdit(); }
function akSetNote(d, v)   { akGetDay(d).note = v; akQueueSync(akMonthKey(), d); }
function akSetPName(d, i, v) { var day=akGetDay(d); if(day.patients[i]){day.patients[i].name=v; akQueueSync(akMonthKey(), d);} }
function akToggleAM(d, i)  { var day=akGetDay(d); if(day.patients[i]){day.patients[i].am=!day.patients[i].am; akQueueSync(akMonthKey(), d); akRenderEdit();} }
function akDelP(d, i)      { akGetDay(d).patients.splice(i,1); akQueueSync(akMonthKey(), d); akRenderEdit(); }
function akAddP(d) {
  akGetDay(d).patients.push({name:'', am:false});
  akQueueSync(akMonthKey(), d);
  akRenderEdit();
  var inputs = document.querySelectorAll('input.ak-pname[data-d="'+d+'"]');
  if (inputs.length) inputs[inputs.length-1].focus();
}

}
// プレビューを画面幅に合わせて縮小表示（A4横が画面より広いときの切れ防止）
function akFitPreview(retry) {
  var wrap = document.getElementById('ak-faxwrap');
  var sheet = document.getElementById('ak-sheet');
  if (!wrap || !sheet) return;
  sheet.style.transform = '';
  sheet.style.transformOrigin = '';
  sheet.style.marginLeft = '';
  wrap.style.height = '';
  var sw = sheet.offsetWidth, sh = sheet.offsetHeight;
  var ww = wrap.clientWidth - 8;
  if ((sw === 0 || ww === 0) && !retry) {
    // 非表示中などで測定できない場合は次フレームで再試行
    setTimeout(function(){ akFitPreview(true); }, 60);
    return;
  }
  if (sw > ww && ww > 100) {
    var sc = ww / sw;
    sheet.style.transformOrigin = 'top left';
    sheet.style.transform = 'scale(' + sc + ')';
    wrap.style.height = Math.ceil(sh * sc + 14) + 'px';
  } else if (sw > 0 && ww > sw) {
    // 画面が広いときは中央寄せ（flexを使わずマージンで）
    sheet.style.marginLeft = Math.floor((ww - sw) / 2) + 'px';
  }
}

function akPrint() {
  // 印刷専用の独立HTML文書を新しいタブで開く（本体ページとは完全分離・自動で印刷開始）
  var doc = akBuildFaxDoc(true);
  var blob = new Blob([doc], {type: 'text/html'});
  var url = URL.createObjectURL(blob);
  var win = window.open(url, '_blank');
  if (!win) {
    // ポップアップブロック時のフォールバック: blob srcのiframeから印刷
    var frame = document.getElementById('ak-print-frame');
    if (frame) frame.parentNode.removeChild(frame);
    frame = document.createElement('iframe');
    frame.id = 'ak-print-frame';
    frame.style.position = 'fixed';
    frame.style.right = '0';
    frame.style.bottom = '0';
    frame.style.width = '0';
    frame.style.height = '0';
    frame.style.border = '0';
    frame.src = URL.createObjectURL(new Blob([akBuildFaxDoc(false)], {type:'text/html'}));
    frame.onload = function() {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch(e) { alert('印刷を開始できませんでした。ポップアップを許可してから再度お試しください。'); }
    };
    document.body.appendChild(frame);
  }
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

// key（該当検査）: [その前に終了しておく検査key...]
var PASS_PREREQ = {
  'ixp':       ['monshin','shindenz','shinsatsu','kyoubu','ct','fukuecho','kotsu'], // 胃バリウム(胃XP)：問診・心電図・診察・胸XP・胸CT・腹部エコー・骨密度

};
// 案内可否チェック（未完了の前提検査があれば確認。OK=案内、キャンセル=戻る）
function passPrereqCheck(resId, targetKey) {
  var need = PASS_PREREQ[targetKey];
  if (!need || !need.length) return true;
  var r = reservationById(resId);
  if (!r) return true;
  // 肺活量は初回受診者のみチェック（リピーターは身体計測データがあるため）
  if (targetKey === 'haikinou' && !r.firstVisit) return true;
  var missing = need.filter(function(k){
    return passApplies(r, k) && !passStationComplete(k, passState(resId, k));
  });
  if (!missing.length) return true;
  var names = missing.map(function(k){ return passStationLabelOf(k); }).join('、');
  return confirm('⚠ 必要な検査が終了していません。\n\n'
    + '【' + passStationLabelOf(targetKey) + '】の前に終了が必要: ' + names + '\n\n'
    + 'それでも案内を行いますか？\n（OK＝案内する／キャンセル＝戻る）');
}
/* ── 通過ステータス定義 ──
   検査進捗：待機中 → 未実施 → 実施中 → 完了 → 保留 → 再検査（→ 待機中に戻る）

var passageData = {};   // 'resId|stationKey' -> {state:'doing'|'done', startAt:'HH:MM', endAt:'HH:MM', by:'担当者'}
var PASSAGE_SYNC_READY = false;
var passPend = {}, passFlushTimer = null;

function passKey(resId, st) { return resId + '|' + st; }
function passGet(resId, st) { return passageData[passKey(resId, st)] || null; }
function passState(resId, st) { var r = passGet(resId, st); return r ? (r.state || '') : ''; }

function passRequireBy() {
  // 通過管理の変更に「誰が変更したか」は問わない（記録はするが入力は求めない）
  return CURRENT_STAFF || '';
}
/* 通過状態を進める（クリックのたびにステータスを1つ進める） */
function passAdvance(resId, st) {
  var by = passRequireBy();
  var cyc = passCycleFor(st);
  var k = passKey(resId, st);
  var cur = passageData[k];
  var curState = cur ? (cur.state || '') : '';
  var idx = cyc.indexOf(curState); if (idx < 0) idx = 0;
  var next = cyc[(idx + 1) % cyc.length];
  if (!next) {
    // 待機中に戻す：ステータスはクリアするが、フリー欄・臥床メモは残す
    if (cur && (cur.note || cur.recumbent)) {
      cur.state = ''; cur.startAt = ''; cur.endAt = ''; cur.by = by;
    } else {
      delete passageData[k];
    }
  } else {
    if (!cur) cur = passageData[k] = {state:'', startAt:'', endAt:'', by:by, note:'', recumbent:false};
    cur.state = next; cur.by = by;
    if (next === 'doing' && !cur.startAt) cur.startAt = hhmm();
    if (next === 'done') { if (!cur.startAt) cur.startAt = hhmm(); cur.endAt = hhmm(); }
  }
  queuePassSync(resId, st);
  saveLocal();
  renderPassage();
}
/* 受診者ごとの「条件（フリー欄）」を保存 */
function passCond(resId) { var r = passageData[resId + '|__cond']; return r ? (r.note || '') : ''; }
function setPassCond(resId, text) {
  var k = resId + '|__cond';
  text = (text || '').trim();
  if (text) passageData[k] = {state:'', startAt:'', endAt:'', by:(CURRENT_STAFF||''), note:text, recumbent:false};
  else if (passageData[k]) delete passageData[k];
  queuePassSync(resId, '__cond');
  saveLocal();
}
/* ステーションごとのメモ（採血のフリー欄など）を保存 */
function setPassStationNote(resId, st, text) {
  var k = passKey(resId, st);
  var cur = passageData[k];
  if (!cur) cur = passageData[k] = {state:'', startAt:'', endAt:'', by:(CURRENT_STAFF||''), note:'', recumbent:false};
  cur.note = (text || '').trim();
  // ステータスもメモも空なら記録を消す
  if (!cur.state && !cur.note && !cur.recumbent) delete passageData[k];
  queuePassSync(resId, st);
  saveLocal();
}
/* 採血の「臥床採血」フラグを切り替え */
function togglePassRecumbent(resId) {
  var k = passKey(resId, 'saiketsu');
  var cur = passageData[k];
  if (!cur) cur = passageData[k] = {state:'', startAt:'', endAt:'', by:(CURRENT_STAFF||''), note:'', recumbent:false};
  cur.recumbent = !cur.recumbent;
  if (!cur.state && !cur.note && !cur.recumbent) delete passageData[k];
  queuePassSync(resId, 'saiketsu');
  saveLocal();
  renderPassage();
}

// ── 当日のキャンセル／追加（検査の対象・対象外を受診者ごとに上書き）──
var passStationOv = {}; // 'resId|key' -> 'add' | 'cancel'
function reservationById(id){ for(var i=0;i<reservations.length;i++){ if(reservations[i].id===id) return reservations[i]; } return null; }
function passBaseApplies(r, key) {
  if (!r) return false;
  if (FIXED_STATIONS.some(function(s){return s.key===key;})) return true;
  return OPT_STATIONS.some(function(s){ return s.key===key && s.cond(r); });
}
function passApplies(r, key) {
  if (!r) return false;
  var ov = passStationOv[r.id + '|' + key];
  if (ov === 'cancel') return false;
  if (ov === 'add') return true;
  return passBaseApplies(r, key);
}
function setPassStationOv(resId, key, mode) {
  var k = resId + '|' + key;
  if (mode) passStationOv[k] = mode; else delete passStationOv[k];
  saveLocal();
  if (typeof sbUpsertPassStationOv === 'function') sbUpsertPassStationOv(resId, key, mode || null);
  closePassMenu();
  renderPassage();
}
function cancelPassStation(resId, key) {
  var r = reservationById(resId);
  if (!confirm(passStationLabelOf(key)+' をこの方の対象外（当日キャンセル）にします。よろしいですか？')) return;
  if (passBaseApplies(r, key)) setPassStationOv(resId, key, 'cancel');
  else setPassStationOv(resId, key, null); // 追加していたものを取消
}
function addPassStation(resId, key) {
  var r = reservationById(resId);
  if (passBaseApplies(r, key)) setPassStationOv(resId, key, null); // キャンセルを取消（元に戻す）
  else setPassStationOv(resId, key, 'add');
}

// ── ステータスを直接選ぶ（クリックで6択メニュー）──
function applyPassStatus(resId, st, target) {
  var by = passRequireBy();
  var k = passKey(resId, st);
  var cur = passageData[k];
  if (target === '') {
    if (cur && (cur.note || cur.recumbent)) { cur.state=''; cur.startAt=''; cur.endAt=''; cur.by=by; }
    else if (cur) delete passageData[k];
  } else {
    if (!cur) cur = passageData[k] = {state:'', startAt:'', endAt:'', by:by, note:'', recumbent:false};
    cur.state = target; cur.by = by;
    if ((target==='doing' || target==='done') && !cur.startAt) cur.startAt = hhmm();
    if (target==='done') cur.endAt = hhmm();
  }
  queuePassSync(resId, st);
}
function setPassStatus(resId, st, target) {
  var curState = passState(resId, st);
  var firstGuide = (target === 'doing' || target === 'machi') && (curState === '' || curState === 'mijisshi');
  if (firstGuide && !passPrereqCheck(resId, st)) { closePassMenu(); return; }
  applyPassStatus(resId, st, target);
  closePassMenu();
  saveLocal();
  renderPassage();
}
// 部署ビュー：ダブルクリックで次の状態へ（未実施→待機中→実施中→完了、問診は確認済）
function passDeptAdvance(resId, st) {
  var order = (st === 'monshin') ? ['', 'machi', 'kakunin'] : ['', 'machi', 'doing', 'done'];
  var cur = passState(resId, st);
  var i = order.indexOf(cur); if (i < 0) i = 0;
  var next = order[(i + 1) % order.length];
  setPassStatus(resId, st, next);
}
// エコー等グループの全検査を一括で同じ状態に
function setGroupAll(resId, grpId, target) {

  if (!grp) return;
  var r = reservationById(resId);
  grp.members.forEach(function(m){ if (passApplies(r, m.key)) applyPassStatus(resId, m.key, target); });

}

function hhmm() {

function queuePassSync(resId, st) {
  if (!SB_READY || !PASSAGE_SYNC_READY) return;
  passPend[passKey(resId, st)] = {resId:resId, st:st};
  if (passFlushTimer) clearTimeout(passFlushTimer);
  passFlushTimer = setTimeout(flushPassSync, 400);
}
async function flushPassSync() {
  passFlushTimer = null;
  if (!SB_READY || !PASSAGE_SYNC_READY) return;
  var pend = passPend; passPend = {};
  var upsFull = [], upsBasic = [], dels = [];
  Object.keys(pend).forEach(function(k) {
    var p = pend[k], rec = passageData[k];
    if (rec) {
      var basic = {reservation_id:p.resId, station:p.st, state:rec.state||'',
                   start_at:rec.startAt||'', end_at:rec.endAt||'', done_by:rec.by||''};
      upsBasic.push(basic);
      upsFull.push(Object.assign({}, basic, {note:rec.note||'', recumbent:!!rec.recumbent}));
    } else dels.push(p);
  });
  try {
    if (upsFull.length > 0) {
      var res = await SB.from('passage_records').upsert(upsFull, {onConflict:'reservation_id,station'});
      if (res.error) {
        // note/recumbent 列が未作成の場合などは基本項目のみで再試行
        // （フリー欄・臥床フラグはこの端末に保存されます。全PC同期するにはSQLで列追加）
        var res2 = await SB.from('passage_records').upsert(upsBasic, {onConflict:'reservation_id,station'});
        if (res2.error) console.error('[SB] passage upsert', res2.error);
      }
    }
    for (var i = 0; i < dels.length; i++) {
      await SB.from('passage_records').delete().eq('reservation_id', dels[i].resId).eq('station', dels[i].st);
    }
  } catch(e) { console.error('[SB] passage flush', e); }
}

/* その予約で実施する検査一覧（固定＋該当分・動線順／当日キャンセル・追加を反映） */
function stationsFor(r) {
  var out = FIXED_STATIONS.filter(function(s){ return passApplies(r, s.key); })
    .map(function(s){ return {key:s.key, label:s.label, fixed:true, extra:false}; });
  OPT_STATIONS.forEach(function(s) {
    if (passApplies(r, s.key)) out.push({key:s.key, label:(s.nameOf ? s.nameOf(r) : s.label), fixed:false, extra:!!s.extra});
  });
  return out;
}
/* そのステーションが「完了」しているか。問診票は確認済(kakunin)＝完了として扱う */
function passStationComplete(stKey, state) {
  return state === 'done' || (stKey === 'monshin' && state === 'kakunin');
}
function passProgress(r) {
  // 進捗率は「任意項目（子B・保健指導・その他）」を除いて計算
  var sts = stationsFor(r).filter(function(s){ return !s.extra; });
  var done = 0, doing = 0;
  sts.forEach(function(s) {
    var st = passState(r.id, s.key);
    if (passStationComplete(s.key, st)) done++;
    else if (st === 'doing') doing++;
  });
  return {done:done, doing:doing, total:sts.length};
}
/* 全員完了か（任意項目を除く全ステーションが「完了」なら true）→ 下へ移動＆色替え */
function passFullyDone(r) {
  var sts = stationsFor(r).filter(function(s){ return !s.extra; });
  if (sts.length === 0) return false;
  return sts.every(function(s){ return passStationComplete(s.key, passState(r.id, s.key)); });
}

function stationColorByKey(key) {

// その人が実際に受ける検査を順番に（任意項目=extraは除く）
function passStationOrder(r) {
  var arr = [];
  FIXED_STATIONS.forEach(function(s){ if (passApplies(r, s.key)) arr.push({key:s.key,label:s.label}); });
  OPT_STATIONS.forEach(function(s){ if (!s.extra && passApplies(r, s.key)) arr.push({key:s.key,label:s.label}); });
  return arr;
}
// 今どこにいて、次にどこへ、残りいくつ
function passNext(r) {
  var order = passStationOrder(r);
  var nowLabel=null, nextLabel=null, nextKey=null, remaining=0;
  order.forEach(function(s){
    var st = passState(r.id, s.key) || '';
    if (st==='doing' && !nowLabel) nowLabel = s.label;
    if (!passStationComplete(s.key, st)) {
      remaining++;
      if (!nextLabel && st!=='doing') { nextLabel = s.label; nextKey = s.key; }
    }
  });
  return {nowLabel:nowLabel, nextLabel:nextLabel, nextKey:nextKey, remaining:remaining, total:order.length};
}

  var m = t.getMonth() - d.getMonth();

  var keys = grp.members.map(function(m){return m.key;}).filter(function(k){ return passApplies(r,k); });
  if (!keys.length) return null;
  var doneN = keys.filter(function(k){ return passStationComplete(k, passState(r.id,k)); }).length;
  var anyDoing = keys.some(function(k){ return passState(r.id,k)==='doing'; });
  if (doneN === keys.length) return {label:'完了', state:'done'};
  if (anyDoing) return {label: doneN>0 ? '検査中（一部完了）' : '検査中', state:'doing'};
  if (doneN > 0) return {label:'待機中（一部完了）', state:'machi'};
  var anyMachi = keys.some(function(k){ return passState(r.id,k)==='machi'; });
  return anyMachi ? {label:'待機中', state:'machi'} : {label:'未実施', state:''};
}
function passStationHTML(key, list) {

  });

    else waiting++;

  var memberKeys = grp.members.map(function(m){ return m.key; });
  var applicable = list.filter(function(r){ return memberKeys.some(function(k){ return passApplies(r,k); }); });
  var waiting=0, doing=0, done=0;
  applicable.forEach(function(r){
    var a = groupAgg(r, grp);
    if (!a) return;
    if (a.state==='done') done++;
    else if (a.state==='doing') doing++;
    else waiting++;
  });
  var remaining = waiting + doing;
  function ord(r){ var a=groupAgg(r,grp)||{state:''}; return a.state==='done'?2:(a.state==='doing'?0:1); }
  applicable.sort(function(a,b){ var oa=ord(a),ob=ord(b); if(oa!==ob)return oa-ob; return (a.createdAt||'')<(b.createdAt||'')?-1:1; });

  function tabBtn2(active,lbl,onclick){

function renderPassage() {
  var el = document.getElementById('tab-passage-content');
  if (!el) return;
  var date = selectedDate || todayStr();
  var list = reservations.filter(function(r) {
    return r.date === date && (r.status === 'reserved' || r.status === 'changed')
      && (passViewSlot === 'all' || r.timeSlot === passViewSlot);
  });
  // 並び順：①完了した人は一番下へ ②AM→PM→未設定 ③登録順
  list.sort(function(a,b) {
    var da = passFullyDone(a) ? 1 : 0, db = passFullyDone(b) ? 1 : 0;
    if (da !== db) return da - db;
    var ord = {am:0, pm:1};
    var oa = (ord[a.timeSlot]!==undefined) ? ord[a.timeSlot] : 2;
    var ob = (ord[b.timeSlot]!==undefined) ? ord[b.timeSlot] : 2;
    if (oa !== ob) return oa - ob;
    return (a.createdAt||'') < (b.createdAt||'') ? -1 : 1;
  });

  // 部署ビュー（検査列タップ時）：その検査だけの一覧を表示
  if (passStationView) {
    el.innerHTML = passStationHTML(passStationView, list);
    return;
  }

  // 全項目を列候補にするが、実際にその日誰かが受ける検査だけに絞って横幅を圧縮
  var cols = FIXED_STATIONS.map(function(s){ return {key:s.key, label:s.label, fixed:true, extra:false}; })
    .concat(OPT_STATIONS.map(function(s){ return {key:s.key, label:s.label, fixed:false, extra:!!s.extra}; }));
  var activeCols = cols.filter(function(c){
    if (c.fixed) return true;
    return list.some(function(r){ return passApplies(r, c.key); });
  });

  var totalDone = 0, totalAll = 0, finished = 0, nowDoing = 0, received = 0, peopleDoing = 0;
  list.forEach(function(r) {
    var p = passProgress(r);
    totalDone += p.done; totalAll += p.total; nowDoing += p.doing;
    if (passFullyDone(r)) finished++;
    if (passState(r.id, 'raiin') === 'done') received++;
    if (stationsFor(r).some(function(s){ return passState(r.id, s.key) === 'doing'; })) peopleDoing++;
  });
  var remaining = list.length - finished; // まだ館内にいる（受診中の）人数。全員終わると0

  var h = '<div class="card"><div class="card-head">'
    + '<span>✅ 通過管理　<span style="font-size:12px;color:#94a3b8;font-weight:400;">' + esc(date) + '（' + DOW[new Date(date).getDay()] + '）</span></span>'
    + '<span style="font-size:13px;color:#475569;display:flex;align-items:baseline;gap:8px;">'
    + '<span style="font-size:12px;color:#94a3b8;">受診者数</span>'
    + '<strong style="font-size:20px;color:' + (remaining===0?'#059669':'#0369A1') + ';">受診中 ' + remaining + '</strong>'
    + '<span style="color:#94a3b8;">/ ' + list.length + '名</span>'
    + '<span style="color:#94a3b8;">・完了 ' + finished + '</span></span>'
    + '</div><div class="card-body">';

  var slotName = passViewSlot==='am' ? '午前' : passViewSlot==='pm' ? '午後' : '全体';
  function tabBtn(active, label, onclick) {
    return '<button onclick="' + onclick + '" style="border:1px solid ' + (active?'#2563EB':'#cbd5e1')
      + ';background:' + (active?'#2563EB':'#fff') + ';color:' + (active?'#fff':'#475569')
      + ';border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;">' + label + '</button>';
  }
  h += '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;">'
    + '<div style="display:flex;gap:4px;">'
    + tabBtn(passViewMode==='overview','🗺 配置ボード',"setPassView('overview')")
    + tabBtn(passViewMode==='detail','🕐 時刻表',"setPassView('detail')")
    + '</div>'
    + '<div style="width:1px;height:24px;background:#e2e8f0;"></div>'
    + '<div style="display:flex;gap:4px;">'
    + tabBtn(passViewSlot==='am','午前',"setPassSlot('am')")
    + tabBtn(passViewSlot==='pm','午後',"setPassSlot('pm')")
    + tabBtn(passViewSlot==='all','全体',"setPassSlot('all')")
    + '</div>'
    + (passViewMode==='detail'
        ? '<div style="width:1px;height:24px;background:#e2e8f0;"></div>'
          + '<div style="display:flex;gap:4px;">'
          + tabBtn(passShowAllCols,'全27項目',"setPassShowAllCols(true)")
          + tabBtn(!passShowAllCols,'使う項目のみ',"setPassShowAllCols(false)")
          + '</div>'
        : '')
    + '<label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#475569;cursor:pointer;background:'+(passOnlyPending?'#FFF7ED':'#F8FAFC')+';border:1px solid '+(passOnlyPending?'#FCD34D':'#e2e8f0')+';border-radius:8px;padding:5px 12px;">'
    + '<input type="checkbox" '+(passOnlyPending?'checked':'')+' onchange="setPassOnlyPending(this.checked)" style="width:16px;height:16px;cursor:pointer;"/> 終わっていない人のみ表示</label>'
    + '<span style="font-size:12px;color:#94a3b8;">' + slotName + '：' + list.length + '名</span>'
    + '</div>';

  if (list.length === 0) {
    h += '<div style="padding:20px;text-align:center;color:#94a3b8;">' + slotName + 'の予約はありません。日付や午前／午後の切替をご確認ください。</div></div></div>';
    el.innerHTML = h;
    return;
  }

  // 表示用リスト（終了者のみ／全体）。集計は全体のまま
  var dispList = passOnlyPending ? list.filter(function(r){ return !passFullyDone(r); }) : list;

  // リアルタイム状態＋更新／印刷
  h += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    + '<div style="display:flex;align-items:center;gap:10px;font-size:12px;color:#64748b;">'
    + (PASSAGE_SYNC_READY
        ? '<span style="display:inline-flex;align-items:center;gap:5px;background:#ECFDF5;color:#059669;border-radius:14px;padding:3px 10px;font-weight:700;"><span style="width:8px;height:8px;border-radius:50%;background:#10B981;display:inline-block;"></span>リアルタイム更新中</span>'
        : '<span style="display:inline-flex;align-items:center;gap:5px;background:#F1F5F9;color:#64748b;border-radius:14px;padding:3px 10px;font-weight:700;">この端末に保存</span>')
    + '<span>最終更新: ' + esc(nowStr()) + '</span>'
    + '</div>'
    + '<div style="display:flex;gap:6px;">'
    + '<button class="btn" onclick="renderPassage()" style="font-size:12px;">🔄 更新</button>'
    + '<button class="btn" onclick="passPrint()" style="font-size:12px;">🖨 印刷</button>'
    + '</div></div>';

  // 上部サマリー（受診者数・受付済・実施中・完了・残り件）
  function passStat(label, val, sub, bg, color) {
    return '<div style="background:' + bg + ';border-radius:10px;padding:8px 12px;min-width:88px;text-align:center;">'
      + '<div style="font-size:11px;color:#64748b;">' + label + '</div>'
      + '<div style="font-size:22px;font-weight:800;color:' + color + ';line-height:1.1;">' + val + '<span style="font-size:12px;font-weight:600;"> ' + sub + '</span></div></div>';
  }
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">'
    + passStat('受付済', received, '名', '#F0F9FF', '#0369A1')
    + passStat('実施中', peopleDoing, '名', '#FFF7ED', '#C2410C')
    + passStat('完了', finished, '名', '#ECFDF5', '#059669')
    + passStat('残り', totalAll - totalDone, '件', '#FEF2F2', '#DC2626')
    + '</div>';

  if (passViewMode === 'overview') {
    h += passOverviewHTML(dispList, activeCols);
    h += '</div></div>';
    el.innerHTML = h;
    return;
  }

  h += '<div style="font-size:12px;color:#64748b;margin-bottom:8px;">各検査マスをクリックすると状態を選べます（<strong>未実施→待機中→実施中→完了→保留→再検査</strong>）。'
    + '<strong>実施中で開始時刻（上段）、完了で終了時刻（下段）</strong>が自動で入ります。'
    + '当日キャンセルはマスのメニューから「対象外」、追加は「—」のマスをクリック。'
    + '<strong>受診者名クリック</strong>でメモ・臥床採血。検査名（見出し）クリックで部署ビュー。完了した方は下へ移動します。</div>';

  var showCols = passShowAllCols ? cols : activeCols;
  h += '<div style="overflow-y:auto;overflow-x:hidden;max-height:76vh;"><table style="border-collapse:separate;border-spacing:0;font-size:11px;width:100%;table-layout:fixed;">'
    + '<thead><tr>'
    + '<th style="position:sticky;top:0;left:0;z-index:5;background:#F1F5F9;border:1px solid #e2e8f0;padding:5px 2px;white-space:nowrap;font-size:10px;width:26px;">No.</th>'
    + '<th style="position:sticky;top:0;left:26px;z-index:5;background:#F1F5F9;border:1px solid #e2e8f0;padding:5px 4px;white-space:nowrap;font-size:11px;text-align:left;width:82px;">受診者名</th>'
    + '<th style="position:sticky;top:0;left:108px;z-index:5;background:#F1F5F9;border:1px solid #e2e8f0;padding:5px 2px;white-space:nowrap;font-size:10px;width:22px;">性</th>';
  showCols.forEach(function(c) {
    var icon = STATION_ICON[c.key] ? '<div style="font-size:11px;line-height:1;">' + STATION_ICON[c.key] + '</div>' : '';
    h += '<th onclick="openPassStation(\'' + c.key + '\')" title="' + esc(c.label) + 'だけの一覧（部署ビュー）を開く" style="position:sticky;top:0;z-index:2;background:#F1F8FF;border:1px solid #e2e8f0;padding:3px 1px;font-size:8.5px;line-height:1.1;overflow:hidden;word-break:break-all;cursor:pointer;">'
      + icon + '<div>' + esc(c.label) + '</div></th>';
  });
  h += '</tr></thead><tbody>';

  dispList.forEach(function(r, idx) {
    var allDone = passFullyDone(r);
    var rowBg = allDone ? '#F0FDF4' : (idx % 2 ? '#FCFCFD' : '#fff');
    var muted = allDone ? 'color:#94a3b8;' : '';
    var slotTag = r.timeSlot === 'am' ? '午前' : r.timeSlot === 'pm' ? '午後' : '—';
    h += '<tr style="background:' + rowBg + ';' + muted + '">'
      + '<td style="position:sticky;left:0;z-index:1;background:' + rowBg + ';border:1px solid #e2e8f0;padding:3px 2px;text-align:center;color:#94a3b8;font-size:10px;width:26px;">' + (idx + 1) + '</td>'
      + '<td onclick="openPassDetail(\'' + r.id + '\')" title="クリックでメモ・臥床の入力へ" style="position:sticky;left:26px;z-index:1;background:' + rowBg + ';border:1px solid #e2e8f0;padding:3px 4px;white-space:nowrap;cursor:pointer;width:82px;max-width:82px;overflow:hidden;text-overflow:ellipsis;">'
      + '<span style="font-weight:700;font-size:11px;">' + esc(dispName(r)) + '</span>'
      + (allDone ? ' <span class="badge bd-green" style="font-size:8px;">済</span>' : '')
      + '<span style="font-size:8px;color:#94a3b8;margin-left:2px;">' + slotTag + '</span></td>'
      + '<td style="position:sticky;left:108px;z-index:1;background:' + rowBg + ';border:1px solid #e2e8f0;padding:3px 2px;text-align:center;font-size:10px;width:22px;">' + (r.gender === 'male' ? '男' : r.gender === 'female' ? '女' : '') + '</td>';

    showCols.forEach(function(c) {
      var applies = passApplies(r, c.key);
      if (!applies) {
        h += '<td onclick="addPassStation(\'' + r.id + '\',\'' + c.key + '\')" title="' + esc(c.label) + 'はこの方は対象外（クリックで追加）" style="border:1px solid #e2e8f0;background:repeating-linear-gradient(45deg,#EEF2F6,#EEF2F6 4px,#DFE5EC 4px,#DFE5EC 8px);text-align:center;color:#b0bac6;cursor:pointer;font-size:10px;">—</td>';
        return;
      }
      var rec = passGet(r.id, c.key);
      var stt = rec ? (rec.state || '') : '';
      var timeInfo = '';
      if (rec && rec.startAt) timeInfo = rec.startAt + (rec.endAt ? '〜' + rec.endAt : '〜（実施中）');
      var noteMark = (rec && rec.note) ? '<span title="' + esc(rec.note) + '" style="position:absolute;top:0;right:0;font-size:7px;color:#F59E0B;">●</span>' : '';
      var recuMark = (c.key === 'saiketsu' && rec && rec.recumbent) ? '<div style="font-size:7px;color:#B45309;font-weight:700;line-height:1;">臥</div>' : '';
      var tip = esc(c.label) + '：' + passStatusLabel(stt) + (timeInfo ? '　' + timeInfo : '') + (rec && rec.note ? '　📝' + esc(rec.note) : '') + ' ／ クリックで状態を選択';
      h += '<td onclick="openPassStatusMenu(\'' + r.id + '\',\'' + c.key + '\',event)" title="' + tip + '" style="border:1px solid #e2e8f0;padding:1px 0;text-align:center;cursor:pointer;background:' + passCellBg(stt) + ';position:relative;overflow:hidden;">'
        + noteMark + passTimeCell(stt, rec) + recuMark
        + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:#475569;align-items:center;">'
    + '<span style="font-family:monospace;background:#EFF6FF;border-radius:4px;padding:2px 6px;">08:23<br>—</span> 実施中（開始のみ）'
    + '<span style="font-family:monospace;background:#F0FDF4;border-radius:4px;padding:2px 6px;">08:23<br>08:26</span> 完了（開始／終了）'
    + '<span><span style="background:#FEF2F2;color:#B91C1C;font-weight:700;border-radius:4px;padding:2px 6px;font-size:10px;">保留</span> / <span style="background:#FFF1F2;color:#BE123C;font-weight:700;border-radius:4px;padding:2px 6px;font-size:10px;">再検査</span></span>'
    + '<span><span style="display:inline-block;width:24px;height:15px;vertical-align:middle;background:#fff;border:1px solid #e2e8f0;color:#64748b;font-size:8px;font-weight:600;text-align:center;line-height:15px;">未実施</span> やる（未着手）　<span style="display:inline-block;width:24px;height:15px;vertical-align:middle;background:repeating-linear-gradient(45deg,#EEF2F6,#EEF2F6 4px,#DFE5EC 4px,#DFE5EC 8px);border:1px solid #e2e8f0;"></span> やらない（対象外）</span>'
    + '<span><span style="color:#F59E0B;">●</span>メモあり　<span style="color:#B45309;font-weight:700;">臥</span>臥床採血</span>'
    + '<span style="margin-left:auto;color:#94a3b8;font-size:11px;">マスをクリック→開始→終了を記録／受診者名クリック→メモ・臥床</span>'
    + '</div></div></div>';
  el.innerHTML = h;
}

// 全体図＝配置ボード（名前→残り数→残っている検査を一望。タブレット対応）
function passOverviewHTML(list, cols) {
  // 完了は下、それ以外は登録（受付）順で安定表示
  var arr = list.slice().sort(function(a,b){
    var da = passFullyDone(a)?1:0, db = passFullyDone(b)?1:0;
    if (da!==db) return da-db;
    return (a.createdAt||'') < (b.createdAt||'') ? -1 : 1;
  });

  var rows = arr.map(function(r, i){
    var allDone = passFullyDone(r);
    var nx = passNext(r);
    // 残っている検査（完了していないもの）＝その人の対象検査のうち未完了
    var remaining = stationsFor(r).filter(function(s){ return !passStationComplete(s.key, passState(r.id, s.key)); });
    var chips = remaining.map(function(s){
      var st = passState(r.id, s.key) || '';
      var pm = PASS_PILL[st] || PASS_PILL[''];
      var tag = st==='doing'?' ●':st==='machi'?' 待':st==='hold'?' 保':st==='saikensa'?' 再':'';
      var isNext = (s.key === nx.nextKey);
      return '<span onclick="openPassStatusMenu(\''+r.id+'\',\''+s.key+'\',event)" title="タップで'+esc(s.label)+'の状態を選ぶ（開始・完了など）" style="display:inline-block;cursor:pointer;background:'+pm.bg+';color:'+pm.color+';border:'+(isNext?'2px solid '+pm.color:'1px solid #e2e8f0')+';border-radius:14px;padding:4px 11px;margin:2px;font-size:12.5px;font-weight:'+(isNext?'800':'600')+';white-space:nowrap;">'+(isNext?'→ ':'')+esc(s.label)+tag+' ▾</span>';
    }).join('');
    if (!chips) chips = '<span style="color:#059669;font-weight:700;font-size:12px;">✓ すべて完了</span>';
    var rowBg = allDone ? '#F6FEF9' : (i % 2 ? '#FCFCFD' : '#fff');
    var nowTag = nx.nowLabel ? '<span style="font-size:10px;color:#B45309;font-weight:700;white-space:nowrap;">今:'+esc(nx.nowLabel)+'</span>' : '';
    return '<tr style="background:' + rowBg + ';' + (allDone?'opacity:.7;':'') + 'cursor:pointer;" onclick="openPassDetail(\''+r.id+'\')" title="クリックで詳細（メモ・次回予約）">'
      + '<td style="padding:6px 6px;text-align:center;color:#94a3b8;font-size:12px;border-bottom:1px solid #eef2f7;vertical-align:top;">' + (i+1) + '</td>'
      + '<td style="padding:6px 8px;white-space:nowrap;font-weight:800;font-size:16px;border-bottom:1px solid #eef2f7;vertical-align:top;">' + esc(dispName(r)) + '<div>'+nowTag+'</div></td>'
      + '<td style="padding:6px 8px;text-align:center;border-bottom:1px solid #eef2f7;vertical-align:top;"><span style="display:inline-block;min-width:34px;background:'+(allDone?'#DCFCE7':'#FEF3C7')+';color:'+(allDone?'#059669':'#B45309')+';font-weight:800;border-radius:8px;padding:3px 8px;font-size:15px;">' + (allDone?'済':'残'+nx.remaining) + '</span></td>'
      + '<td style="padding:5px 8px;border-bottom:1px solid #eef2f7;vertical-align:top;">' + chips + '</td>'
      + '</tr>';
  }).join('');
  if (!rows) rows = '<tr><td colspan="4" style="padding:24px;text-align:center;color:#94a3b8;">対象者はいません。</td></tr>';

  var head = '<thead><tr>'
    + '<th style="position:sticky;top:0;z-index:1;background:#F8FAFC;padding:6px 4px;font-size:11px;border-bottom:1px solid #e2e8f0;">No.</th>'
    + '<th style="position:sticky;top:0;z-index:1;background:#F8FAFC;padding:6px 8px;font-size:12px;text-align:left;border-bottom:1px solid #e2e8f0;">受診者名</th>'
    + '<th style="position:sticky;top:0;z-index:1;background:#F8FAFC;padding:6px 6px;font-size:12px;border-bottom:1px solid #e2e8f0;">残り</th>'
    + '<th style="position:sticky;top:0;z-index:1;background:#F8FAFC;padding:6px 8px;font-size:12px;text-align:left;border-bottom:1px solid #e2e8f0;">残っている検査（→ が次に行く場所）</th>'
    + '</tr></thead>';

  var legend = '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:#64748b;align-items:center;">'
    + '<span>各行に、その人がまだ終えていない検査を表示します。<b>「→」が次に行く場所</b>、<span style="color:#C2410C;font-weight:700;">待</span>＝待機中／<span style="color:#1D4ED8;font-weight:700;">●</span>＝実施中／<span style="color:#B91C1C;font-weight:700;">保</span>＝保留／<span style="color:#BE123C;font-weight:700;">再</span>＝再検査。</span>'
    + '<span style="margin-left:auto;color:#94a3b8;">受診者名クリックで詳細（メモ・次回予約）。</span>'
    + '</div>';

  return '<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;">' + head + '<tbody>' + rows + '</tbody></table></div>' + legend;
}

// 誠寿司
