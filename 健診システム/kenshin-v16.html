<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健診センター予約管理 v15 (Supabase)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* タブレット対応：ダブルタップでの意図しないズームを防ぎ、タップの反応を速く */
button, input, select, textarea, td, th, label, .btn, .tog, [onclick], [ondblclick]{ touch-action: manipulation; }
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;font-size:15px;background:#F1F5F9;color:#1e293b;-webkit-text-size-adjust:100%;}
.app{background:#F1F5F9;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:18px;font-weight:600;}
.topbar p{font-size:12px;color:#94a3b8;}
.tabs{background:#fff;border-bottom:1px solid #e2e8f0;display:flex;flex-wrap:wrap;overflow-x:auto;position:sticky;top:53px;z-index:40;}
.tab-btn{padding:12px 18px;font-size:15px;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;color:#64748b;white-space:nowrap;}
.tab-btn.active{border-bottom-color:#3B82F6;color:#3B82F6;font-weight:500;}
.main{padding:16px;max-width:1240px;margin:0 auto;}
.main.main-wide{max-width:none;padding-left:10px;padding-right:10px;}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden;}
.card-head{padding:10px 14px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.card-body{padding:16px 18px;}
.btn{padding:7px 15px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#1e293b;cursor:pointer;font-size:14px;}
.btn:hover{background:#f8fafc;}
.btn-primary{background:#3B82F6;color:#fff;border-color:#3B82F6;}
.btn-primary:hover{background:#2563EB;}
.btn-danger{color:#DC2626;border-color:#FECACA;}
.btn-danger:hover{background:#FEF2F2;}
.btn-warn{color:#D97706;border-color:#FDE68A;}
.btn-warn:hover{background:#FFFBEB;}
.btn-teal{color:#0F6E56;border-color:#9FE1CB;}
.btn-teal:hover{background:#E1F5EE;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;}
.bd-blue{background:#DBEAFE;color:#1D4ED8;}
.bd-amber{background:#FEF3C7;color:#B45309;}
.bd-red{background:#FEE2E2;color:#DC2626;}
.bd-gray{background:#F1F5F9;color:#64748b;}
.bd-purple{background:#F3E8FF;color:#7C3AED;}
.bd-green{background:#D1FAE5;color:#065F46;}
.bd-teal{background:#CCFBF1;color:#0F6E56;}
.bd-sky{background:#E0F2FE;color:#0369A1;}
.bd-indigo{background:#EEF2FF;color:#4338CA;}
.ny-badge{background:#FDF4FF;color:#7E22CE;border:1px solid #D8B4FE;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:500;margin-left:4px;}

/* トグルボタン */
.tog{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:20px;border:2px solid #cbd5e1;background:#fff;color:#64748b;cursor:pointer;font-size:15px;font-weight:500;transition:all .15s;user-select:none;}
.tog:hover{background:#f1f5f9;}
.tog.on-blue{background:#2563EB;color:#fff;border-color:#1D4ED8;box-shadow:0 0 0 3px #BFDBFE;}
.tog.on-indigo{background:#4F46E5;color:#fff;border-color:#4338CA;box-shadow:0 0 0 3px #C7D2FE;}
.tog.on-green{background:#059669;color:#fff;border-color:#047857;box-shadow:0 0 0 3px #A7F3D0;}
.tog.on-amber{background:#D97706;color:#fff;border-color:#B45309;box-shadow:0 0 0 3px #FDE68A;}
.tog.on-purple{background:#7C3AED;color:#fff;border-color:#6D28D9;box-shadow:0 0 0 3px #DDD6FE;}
.tog-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.exam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;}
.exam-grid .tog{justify-content:center;padding:10px 8px;font-size:14px;}
.exam-grid .tog .exam-note{display:block;margin:2px 0 0 0;font-size:11px;}
@media(max-width:520px){.exam-grid{grid-template-columns:repeat(2,1fr);}}
.exam-note{font-size:11px;opacity:.75;margin-left:2px;}

/* 枠 */
.ss{margin-bottom:12px;}
.ss-title{font-size:11px;font-weight:600;color:#64748b;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #e2e8f0;}
.sg5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.sg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.si{border-radius:8px;padding:11px 12px 8px;border:1px solid;}
.si-ok{background:#F0FDF4;border-color:#86EFAC;}
.si-warn{background:#FFFBEB;border-color:#FCD34D;}
.si-full{background:#FEF2F2;border-color:#FCA5A5;}
.si-none{background:#F8FAFC;border-color:#e2e8f0;}
.si-lbl{font-size:13px;color:#334155;font-weight:600;}
.si-note{font-size:10px;color:#475569;background:#E2E8F0;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:500;}
.si-val{font-size:22px;font-weight:700;}
.si-val.ok{color:#15803D;}.si-val.warn{color:#B45309;}.si-val.full{color:#DC2626;}
.bar-bg{background:#E5E7EB;border-radius:4px;height:3px;margin-top:4px;overflow:hidden;}
.bar-fill{height:3px;border-radius:4px;}

/* カレンダー */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-head{text-align:center;padding:8px 0;font-size:14px;font-weight:600;border-bottom:1px solid #e2e8f0;}
.cal-cell{min-height:132px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:5px;cursor:pointer;}
.sh-table{border-collapse:collapse;font-size:15px;width:100%;table-layout:fixed;}
.sh-table th,.sh-table td{border:1px solid #e2e8f0;text-align:center;padding:0;}
.sh-name-col{position:sticky;left:0;background:#F8FAFC;z-index:2;width:128px;padding:6px 8px!important;text-align:left!important;font-size:13px;line-height:1.25;}
.sh-day-head{padding:5px 0!important;font-size:13px;color:#475569;background:#F8FAFC;}
.sh-day-head.sh-holiday{background:#FEE2E2;color:#DC2626;}
.sh-day-head.sh-sat{background:#E0F2FE;color:#0369A1;}
.sh-vio-head{background:#FEF2F2!important;}
.sh-cell{height:46px;cursor:pointer;font-weight:700;font-size:17px;user-select:none;overflow:hidden;}
.sh-cell:hover{outline:2px solid #3B82F6;outline-offset:-2px;}
.sh-sum-head{width:34px;background:#EFF6FF;color:#1D4ED8;font-size:13px;font-weight:700;padding:5px 0!important;}
.sh-sum{width:34px;background:#F8FAFC;font-size:14px;font-weight:600;color:#1e293b;}
.sh-half{font-size:11px;letter-spacing:-1px;}
.cal-full-wrap{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;}
.cal-full-tag{font-size:11px;font-weight:700;color:#fff;background:#DC2626;border-radius:4px;padding:1px 5px;line-height:1.35;white-space:nowrap;}
.cal-near-tag{font-size:11px;font-weight:600;color:#B45309;background:#FEF3C7;border:0.5px solid #FCD34D;border-radius:4px;padding:1px 5px;line-height:1.35;white-space:nowrap;}
.cal-over-tag{font-size:11px;font-weight:700;color:#fff;background:#7F1D1D;border-radius:4px;padding:1px 5px;line-height:1.35;white-space:nowrap;}
.cal-ampm{font-size:11px;color:#475569;font-weight:600;line-height:1.3;white-space:nowrap;margin-top:2px;}
.cal-cell:hover{background:#EFF6FF;}
.cal-cell.sel{background:#EFF6FF;outline:2px solid #3B82F6;outline-offset:-2px;}
.cal-cell.today-c .cal-dn{background:#3B82F6;color:#fff;border-radius:50%;}
.cal-cell.full-c{background:#FEF2F2;}
.cal-cell.near-c{background:#FFFBEB;}
.cal-cell.empty{background:#F8FAFC;cursor:default;}
.cal-dn{font-size:18px;font-weight:700;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}
.ov-card{border:1px solid #e2e8f0;border-radius:8px;padding:6px 7px;background:#fff;cursor:pointer;}
.ov-card:hover{outline:2px solid #93C5FD;outline-offset:-1px;}
.ov-card.done{opacity:0.5;background:#F0FDF4;}
.ov-name{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:4px;line-height:1.2;}
.ov-name>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ov-rem{font-size:10px;font-weight:700;color:#B45309;background:#FEF3C7;border-radius:8px;padding:0 6px;white-space:nowrap;flex:0 0 auto;}
.ov-next{font-size:13px;font-weight:800;border-radius:6px;padding:3px 6px;margin:4px 0;text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-dots{display:flex;flex-wrap:wrap;gap:2px;}
.ov-dot{width:16px;height:16px;border-radius:3px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;box-sizing:border-box;}
.c-sun{color:#EF4444;}.c-sat{color:#3B82F6;}
.ym-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ym-sel{border:1px solid #cbd5e1;border-radius:8px;padding:9px 14px;font-size:15px;background:#fff;color:#1e293b;cursor:pointer;}

/* 予約行 */
.rr{position:relative;border-bottom:1px solid #e2e8f0;}
.rr:last-child{border-bottom:none;}
.rr.st-reserved{background:#fff;}
.rr.st-changed{background:#FFFBEB;}
.rr.st-cancelled{background:#F9FAFB;opacity:.65;}
.rr.st-rescheduled{background:#EFF6FF;opacity:.8;}
.rr.st-noshow{background:#FFF1F2;opacity:.75;}
.co-stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
.ri{padding:13px 16px 13px 20px;}
.rn{font-weight:600;font-size:17px;}
.rsub{font-size:13px;color:#64748b;margin-top:5px;}
.rmeta{font-size:12px;color:#94a3b8;margin-top:4px;}
.ract{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.hist-box{background:#F8FAFC;border-radius:8px;padding:9px 12px;font-size:12px;color:#64748b;margin-top:6px;line-height:1.6;}
.co-summary{background:#F8FAFC;border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.co-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid;margin:2px;}

/* フォーム */
.fr{margin-bottom:12px;}
.fr label{display:block;font-size:14px;font-weight:600;color:#475569;margin-bottom:6px;}
.fr input,.fr select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;color:#1e293b;}
.f2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.color-sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.color-sw.on{border-color:#1e293b;}
.dp-row{display:flex;gap:6px;align-items:center;}
.dp-sel{border:1px solid #cbd5e1;border-radius:8px;padding:10px 10px;font-size:15px;background:#fff;color:#1e293b;}

/* モーダル */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;}
.md{background:#fff;border-radius:12px;width:min(820px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.md-wide{width:min(940px,96vw);}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start;}
.form-col-divider{border-left:1px solid #e2e8f0;padding-left:24px;}
@media(max-width:760px){.form-2col{grid-template-columns:1fr;}.form-col-divider{border-left:none;padding-left:0;}}
.md-sm{max-width:440px;}
.md-head{padding:16px 20px;font-size:17px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-weight:600;flex-shrink:0;}
.md-body{padding:18px 20px;overflow-y:auto;flex:1;}
.md-foot{padding:11px 16px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#fff;}
.info-box{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:8px 12px;font-size:13px;color:#1D4ED8;margin-bottom:10px;}
.warn-box{background:#FFFBEB;border:1px solid #FCD34D;border-radius:8px;padding:8px 12px;font-size:12px;color:#B45309;margin-bottom:8px;}
.err-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:11px 14px;font-size:14px;color:#DC2626;margin-bottom:10px;}
.locker-box{background:#F0FDF4;border:1px solid #86EFAC;border-radius:8px;padding:11px 14px;font-size:13px;color:#065F46;margin-bottom:10px;}
.search-row{padding:9px 14px;border-bottom:1px solid #e2e8f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.search-row:hover{background:#EFF6FF;}
.sei-day{margin-bottom:8px;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;}
.sei-head{background:#FFFBEB;padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;color:#B45309;font-weight:600;}
.leg-row{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;border-top:1px solid #e2e8f0;}
.leg-it{display:flex;align-items:center;gap:4px;font-size:12.5px;color:#64748b;}
.leg-sq{width:12px;height:12px;border-radius:2px;display:inline-block;}
.slbl{font-size:11px;font-weight:600;color:#64748b;margin-bottom:5px;}
@media(max-width:600px){.sg5{grid-template-columns:repeat(3,1fr);}.f2col{grid-template-columns:1fr;}}
</style>
<style id="akiba-style">
/* ═══ 秋葉医院予約表（#akiba-root スコープ・元デザイン維持）═══ */
#akiba-root{
  --ak-ink:#2b3a42; --ak-base:#f4f6f7; --ak-panel:#ffffff;
  --ak-accent:#3e6b7e; --ak-accent-soft:#e3edf1; --ak-apricot:#e8a06b;
  --ak-closed:#9aa7ad; --ak-line:#d4dce0; --ak-danger:#c25b4e;
  background:var(--ak-base); color:var(--ak-ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  font-size:15px; border-radius:12px; overflow:visible; border:1px solid var(--ak-line);
}
#akiba-root .ak-appbar{background:var(--ak-accent); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
#akiba-root .ak-appbar h2{font-size:17px; margin:0; font-weight:700; letter-spacing:.05em;}
#akiba-root .ak-appbar .ak-sub{font-size:12px; opacity:.85;}
#akiba-root .ak-toolbar{background:var(--ak-panel); border-bottom:1px solid var(--ak-line); padding:10px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
#akiba-root .ak-toolbar label{font-size:13px; color:#5a6a72;}
#akiba-root select,#akiba-root button,#akiba-root input[type="text"]{font-family:inherit; font-size:14px; border:1px solid var(--ak-line); border-radius:8px; padding:7px 10px; background:#fff; color:var(--ak-ink);}
#akiba-root button{cursor:pointer; transition:filter .12s;}
#akiba-root button:hover{filter:brightness(.96);}
#akiba-root .ak-btn-print{background:var(--ak-apricot); color:#fff; border-color:var(--ak-apricot); font-weight:700; padding:8px 18px;}
#akiba-root .ak-btn-ghost{background:#fff;}
#akiba-root .ak-spacer{flex:1;}
#akiba-root .ak-seg{display:flex; border:1px solid var(--ak-line); border-radius:8px; overflow:hidden;}
#akiba-root .ak-seg button{border:none; border-radius:0; background:#fff; padding:7px 14px;}
#akiba-root .ak-seg button.on{background:var(--ak-accent); color:#fff; font-weight:700;}
#akiba-root .ak-main{padding:16px 18px 30px;}
#akiba-root .ak-hint{background:var(--ak-accent-soft); border:1px solid #c7dbe3; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; color:#33555f;}
#akiba-root table.ak-edit{width:100%; table-layout:fixed; border-collapse:collapse; background:#fff; box-shadow:0 1px 4px rgba(43,58,66,.08); border-radius:10px; overflow:hidden;}
#akiba-root table.ak-edit th{background:var(--ak-accent); color:#fff; padding:8px 4px; font-size:14px; letter-spacing:.1em; border-right:1px solid rgba(255,255,255,.25);}
#akiba-root table.ak-edit th.sat{background:#5b7d8d;}
#akiba-root table.ak-edit td{border:1px solid var(--ak-line); vertical-align:top; width:16.66%; padding:6px; background:#fff;}
#akiba-root td.ak-blank{background:#eef1f2;}
#akiba-root .ak-daycell{min-height:130px; display:flex; flex-direction:column; gap:6px;}
#akiba-root .ak-dayhead{display:flex; align-items:center; gap:6px;}
#akiba-root .ak-daynum{font-weight:800; font-size:17px;}
#akiba-root .ak-dayhead select{font-size:12px; padding:3px 4px; border-radius:6px; flex:1; min-width:0; width:100%; max-width:100%;}
#akiba-root td.ak-is-closed{background:#f1f3f4;}
#akiba-root td.ak-is-closed .ak-daynum{color:var(--ak-closed);}
#akiba-root .ak-closed-note input{width:100%; font-size:12px; padding:4px 6px;}
#akiba-root ul.ak-plist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
#akiba-root ul.ak-plist li{display:flex; align-items:center; gap:4px;}
#akiba-root ul.ak-plist input.ak-pname{flex:1; min-width:0; font-size:13px; padding:4px 6px;}
#akiba-root .ak-amtoggle{font-size:11px; font-weight:800; padding:4px 6px; border-radius:6px; background:#fff; color:#9aa7ad; border:1px solid var(--ak-line); line-height:1;}
#akiba-root .ak-amtoggle.on{background:var(--ak-apricot); color:#fff; border-color:var(--ak-apricot);}
#akiba-root .ak-del{font-size:12px; color:var(--ak-danger); background:#fff; border:1px solid var(--ak-line); border-radius:6px; padding:4px 7px; line-height:1;}
#akiba-root .ak-addbtn{font-size:12px; color:var(--ak-accent); background:var(--ak-accent-soft); border:1px dashed var(--ak-accent); border-radius:6px; padding:4px; width:100%;}
#akiba-root #ak-faxwrap{display:block; padding:10px 0; overflow-x:auto;}
#akiba-root .ak-sheet{background:#fff; color:#000; box-shadow:0 2px 10px rgba(0,0,0,.18); padding:9mm 10mm; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;}
#akiba-root .ak-sheet.portrait{width:210mm; min-height:296mm;}
#akiba-root .ak-sheet.landscape{width:297mm; min-height:209mm;}
#akiba-root .fx-titlebar{display:flex; justify-content:space-between; align-items:flex-end; width:100%; box-sizing:border-box; min-width:0; border-bottom:3px solid #000; padding-bottom:2mm;}
#akiba-root .fx-titlebar .fx-doc{font-size:20px; font-weight:900; letter-spacing:.35em; flex-shrink:0;}
#akiba-root .fx-titlebar .fx-date{font-size:12px; min-width:0;}
#akiba-root .fx-parties{display:flex; justify-content:space-between; gap:6mm; margin:3mm 0 2mm; width:100%; box-sizing:border-box; font-size:13px; line-height:1.7;}
#akiba-root .fx-parties > div{min-width:0; overflow:hidden;}
#akiba-root .fx-parties .to{font-size:17px; font-weight:800; border-bottom:1px solid #000; padding:0 6mm 1mm 1mm; display:inline-block; max-width:100%;}
#akiba-root .fx-parties .from{text-align:right; white-space:nowrap; text-overflow:ellipsis;}
#akiba-root .fx-parties .from .org{font-size:15px; font-weight:800;}
#akiba-root .fx-month{text-align:center; font-size:21px; font-weight:900; letter-spacing:.2em; margin:2mm 0 2.5mm;}
#akiba-root table.fx{width:100%; border-collapse:collapse; table-layout:fixed;}
#akiba-root table.fx th{border:2px solid #000; padding:1.6mm 1mm; font-size:13px; letter-spacing:.3em; background:#e8e8e8;}
#akiba-root table.fx td{border:1.5px solid #000; vertical-align:top; padding:1.2mm 1.4mm; font-size:12px;}
#akiba-root table.fx td.blank{background:#f2f2f2;}
#akiba-root .fx-daynum{font-size:14px; font-weight:800; border-bottom:1px solid #888; padding-bottom:.5mm; margin-bottom:.8mm;}
#akiba-root .fx-closed{text-align:center; font-weight:900; font-size:14px; letter-spacing:.25em; padding:2mm 0; color:#000;}
#akiba-root .fx-closed .sub{display:block; font-size:10.5px; letter-spacing:.05em; font-weight:700; margin-top:.5mm;}
#akiba-root ul.fx-names{list-style:none; margin:0; padding:0; line-height:1.55;}
#akiba-root ul.fx-names li{border-bottom:1px dotted #999; padding:.3mm 0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}

function staffSelectHTML(id, current) {
  var cur = current || CURRENT_STAFF || '';

    opts += '<option value="'+esc(m.name)+'"'+(m.name===cur?' selected':'')+'>'+esc(m.name)+'</option>';
  });

  return '<select id="'+id+'" onchange="staffSelChg(\''+id+'\')" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:15px;background:#fff;">'+opts+'</select>'

}
function staffSelChg(id) {
  var sel = document.getElementById(id), oth = document.getElementById(id+'-other');

  oth.style.display = (sel.value === '__other__') ? 'block' : 'none';
  if (sel.value === '__other__') oth.focus();

  var sel = document.getElementById(id);
  if (!sel) return '';
  if (sel.value === '__other__') {
    var oth = document.getElementById(id+'-other');
    return oth ? oth.value.trim() : '';
  }
  return sel.value.trim();
}

}

    return false;
  }
}

/* ─── DB: 全データ初期ロード ─── */
var SB_LAST_LOAD_ERROR = null;   // 最後に失敗したテーブルとコード（バッジ表示用）
function sbLoadErr(table, sel, error) {
  console.error('[SB] loadAll error', {
    table: table,
    select: sel,
    code: error && error.code,
    message: error && error.message,
    details: error && error.details,
    hint: error && error.hint,
    raw: error
  });
  SB_LAST_LOAD_ERROR = table + (error && error.code ? ' [' + error.code + ']' : '');
  if (error) error._table = table;
  return error || new Error(table + ' 読込失敗');
}
/* ═══ anon権限の読み取り診断（1テーブルずつ順番に実行）═══
   Supabase SQL Editor は postgres 権限、アプリは anon キー。
   この関数はアプリと同じ anon 権限で各テーブルを1件ずつ select し、
   どのテーブルで最初に失敗するかを特定する。既存データは変更しない（読み取りのみ）。 */
async function sbDiagnose() {
  if (!SB_READY) { alert('Supabase未接続です（URL/キー未設定またはSDK読込失敗）'); return; }
  var tables = ['reservations','companies','doctor_overrides','locker_overrides','worklists','staff_memos',
                'slot_overrides','exam_type_daily_limits','shift_cells','shift_wishes','shift_staff_memos',
                'shift_settings','akiba_days','change_logs'];
  var lines = [];
  var firstFail = null;
  console.log('════ anon権限 読み取り診断 開始 ════');
  for (var i = 0; i < tables.length; i++) {
    var t = tables[i];
    var res;
    try {
      res = await SB.from(t).select('*').limit(1);
    } catch (ex) {
      res = { data: null, error: { code: '(例外)', message: ex && ex.message } };
    }
    var e = res.error;
    console.log('[診断] ' + t, {
      table: t,
      code: e && e.code,
      message: e && e.message,
      details: e && e.details,
      hint: e && e.hint,
      count: res.data ? res.data.length : null
    });
    if (e) {
      lines.push('✕ ' + t + ' … ' + (e.code || '?') + ' / ' + (e.message || ''));
      if (!firstFail) firstFail = { table: t, code: e.code, message: e.message };
    } else {
      lines.push('○ ' + t + ' … OK（' + (res.data ? res.data.length : 0) + '件取得）');
    }
  }
  console.log('════ 診断終了 ════');
  var head = firstFail
    ? '【最初に失敗したテーブル】\n' + firstFail.table + '\nコード: ' + (firstFail.code || '?') +
      '\n内容: ' + (firstFail.message || '') +
      '\n\n' + (String(firstFail.code) === '42501' ? '→ RLS/権限不足です（anonにSELECT権限がない）'
              : String(firstFail.code) === '42P01' ? '→ テーブルが存在しません'
              : '→ 上記コードをClaudeへ共有してください') + '\n\n'
    : '【すべてのテーブルが anon 権限で読めました】\nDB権限は原因ではありません。\n\n';
  alert(head + lines.join('\n'));
}

      shiftCommittees = dbComs;
      if (dbFixed !== null) fixedCommitteeRules = dbFixed;

      // ローカル→DB 初回移行（DBに存在しない月のみ。バッチupsert）
      function migrate(localMap, dbMap, table, valCol) {
        var rows = [];
        Object.keys(localMap||{}).forEach(function(ym){
          if (dbMap[ym] && Object.keys(dbMap[ym]).length>0) return;  // DBに既にある月はDBを正とする
          var mo = localMap[ym]||{};
          var keys = Object.keys(mo);
          if (keys.length===0) return;
          dbMap[ym] = mo;
          keys.forEach(function(k){
            if (!mo[k]) return;
            var p = k.split('|');
            var row = {ym:ym, staff_name:p[0], date:p[1]};
            if (valCol) row[valCol] = (mo[k]===true ? '1' : mo[k]);
            rows.push(row);
          });
        });
        if (rows.length>0) {
          SB.from(table).upsert(rows, {onConflict:'ym,staff_name,date'}).then(function(res){
            if (res.error) console.error('[SB] '+table+' 移行', res.error);
            else console.log('[SB] '+table+' ローカルから'+rows.length+'件移行');
          });
        }
      }
      migrate(localShift,  shiftData,       'shift_cells',       'shift_type');
      migrate(localWishes, shiftWishes,     'shift_wishes',      null);
      migrate(localMemos,  shiftStaffMemos, 'shift_staff_memos', 'memo');
      Object.keys(localComs||{}).forEach(function(ym){
        if (!shiftCommittees[ym] && (localComs[ym]||[]).length>0) {
          shiftCommittees[ym] = localComs[ym];
          sbSaveShiftSetting('committees|'+ym, localComs[ym]);
        }
      });
      if (dbFixed === null && localFixed && localFixed.length>0) sbSaveShiftSetting('fixed_committee_rules', localFixed);
      saveLocal();
    } else {
      SHIFT_SYNC_READY = false;

    // worklists（当日業務表）— DBを正としてマージ（全PC共有）
    (wRes.data||[]).forEach(function(row) {
      worklistData[row.date] = rowToWorklist(row);

    if (!dyRes.error) {

      diaryData = {};
      (dyRes.data||[]).forEach(function(row) {

      var dyMig = [], dyKeep = {};
      Object.keys(_localDy).forEach(function(d){

          diaryData[d] = _localDy[d];
          dyMig.push({date:d, data:_localDy[d], updated_by:(CURRENT_STAFF||''), updated_at:nowStr()});
        } else if (!migDone('diary_v1') && JSON.stringify(diaryData[d]) !== JSON.stringify(_localDy[d])) {
          dyKeep[d] = _localDy[d];  // 同じ日に別PCの日誌があった場合、この端末の版を控えとして残す
        }
      });
      if (Object.keys(dyKeep).length > 0) {
        try { localStorage.setItem('kenshin_diary_backup_v1', JSON.stringify(dyKeep)); } catch(e) {}
        console.warn('[SB] diaries 同日の別版をこの端末に控えとして保存', Object.keys(dyKeep));
      }
      setMigDone('diary_v1');
      if (dyMig.length > 0) {
        SB.from('diaries').upsert(dyMig, {onConflict:'date'}).then(function(res){
          if (res.error) console.error('[SB] diaries 移行', res.error);
          else console.log('[SB] diaries ローカルから'+dyMig.length+'件移行');
        });
      }
      saveLocal();
    } else {
      DIARY_SYNC_READY = false;
    }

    setSyncBadge('ok', syncIdleLabel());
    return true;
  } catch(e) {
    setSyncBadge('error', 'ロードエラー');
    console.error('[SB] loadAll error（最終）', {
      table: e && e._table || '(テーブル特定前の例外)',
      code: e && e.code, message: e && e.message,
      details: e && e.details, hint: e && e.hint, raw: e
    });
    return false;
  }
}

/* 1000件を超えるテーブルも全件読む（Supabaseは1回の取得が最大1000件のため分割して取得） */
async function sbSelectAll(table, orderCol) {
  var all = [], size = 1000;
  for (var from = 0; ; from += size) {
    var res = await SB.from(table).select('*').order(orderCol).range(from, from + size - 1);
    if (res.error) return res;
    all = all.concat(res.data || []);
    if (!res.data || res.data.length < size) break;
  }
  return {data: all, error: null};
}

/* 子宮検査の実施日: 月・火・水・第2土曜日（祝日・年末年始は除く） */
function isShikyuDay(dateStr) {
  if (!dateStr) return false;
  if (isHolidayOrSunday(dateStr)) return false;   // 日曜・祝日・年末年始は不可
  var p = parseYMD(dateStr);
  var dt = new Date(p.y, p.m-1, p.d);
  var w = dt.getDay();
  if (w===1 || w===2 || w===3) return true;       // 月・火・水
  if (w===6) {                                     // 第2土曜のみ
    var nth = Math.floor((p.d - 1) / 7) + 1;
    return nth === 2;
  }
  return false;
}

/* ═══ 前回メモ参照: 同じ受診者の過去予約からメモを引き継ぐ ═══
   判定の優先順位  1) カルテ番号  2) カナ＋生年月日  3) カナのみ（候補として提示）
   自動では上書きせず、「今回のメモへコピー」で職員が選んで反映する。 */
function normKana(s) {
  if (!s) return '';
  var t = String(s);
  // ① 半角カナの濁点・半濁点（2文字）を先に1文字へ合成
  var DAKU = {'ｶ':'ガ','ｷ':'ギ','ｸ':'グ','ｹ':'ゲ','ｺ':'ゴ','ｻ':'ザ','ｼ':'ジ','ｽ':'ズ','ｾ':'ゼ','ｿ':'ゾ',
              'ﾀ':'ダ','ﾁ':'ヂ','ﾂ':'ヅ','ﾃ':'デ','ﾄ':'ド','ﾊ':'バ','ﾋ':'ビ','ﾌ':'ブ','ﾍ':'ベ','ﾎ':'ボ','ｳ':'ヴ'};
  var HANDAKU = {'ﾊ':'パ','ﾋ':'ピ','ﾌ':'プ','ﾍ':'ペ','ﾎ':'ポ'};
  t = t.replace(/([ｳｶ-ｿﾀ-ﾄﾊ-ﾎ])\uFF9E/g, function(m, c) { return DAKU[c] || c; });
  t = t.replace(/([ﾊ-ﾎ])\uFF9F/g, function(m, c) { return HANDAKU[c] || c; });
  // ② 残りの半角カナ → 全角カナ
  var HALF = {'ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ','ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ',
    'ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ','ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト',
    'ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ','ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ',
    'ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ','ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ',
    'ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ','ﾜ':'ワ','ｦ':'ヲ','ﾝ':'ン','ｰ':'ー',
    'ｧ':'ア','ｨ':'イ','ｩ':'ウ','ｪ':'エ','ｫ':'オ','ｬ':'ヤ','ｭ':'ユ','ｮ':'ヨ','ｯ':'ツ'};
  t = t.replace(/[\uFF61-\uFF9F]/g, function(c) { return HALF[c] || ''; });
  // ③ ひらがな → カタカナ
  t = t.replace(/[\u3041-\u3096]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); });
  // ④ スペース・記号・長音を無視
  t = t.replace(/[\s\u3000ー・、。,.\-]/g, '');
  // ⑤ 小書き文字を通常サイズへ（表記ゆれ吸収）
  t = t.replace(/[ァィゥェォャュョッ]/g, function(c) {
    return {'ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ッ':'ツ'}[c];
  });
  return t;
}
// 同一受診者の過去予約を新しい順に返す（今開いている予約は除く）
function findPastVisits(karteNo, kana, birth, excludeId) {
  var kn = (karteNo||'').trim();
  var nk = normKana(kana);
  var hits = reservations.filter(function(r) {
    if (excludeId && r.id === excludeId) return false;
    if (kn && (r.karteNumber||'').trim() === kn) return true;                 // ① カルテ番号一致
    if (!kn && nk && normKana(r.kana) === nk) {
      if (birth && r.birth) return r.birth === birth;                          // ② カナ＋生年月日
      return true;                                                             // ③ カナのみ（候補）
    }
    return false;
  });
  hits.sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  return hits;
}

/* CSVを1行ずつ配列に変換（引用符・カンマ・改行に対応） */
function parseCSV(text) {
  var rows = [], row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c === '\r') { /* skip */ }
      else cur += c;
    }
  }
  if (cur !== '' || row.length > 0) { row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}
/* 文字コード判定（Shift-JIS / UTF-8） */
function decodeCSVBuffer(buf) {
  var u8 = new TextDecoder('utf-8', {fatal:false}).decode(buf);
  var bad = (u8.match(/\uFFFD/g) || []).length;
  if (bad === 0) return {text:u8, encoding:'UTF-8'};
  try {
    var sj = new TextDecoder('shift_jis', {fatal:false}).decode(buf);
    var badS = (sj.match(/\uFFFD/g) || []).length;
    if (badS < bad) return {text:sj, encoding:'Shift-JIS'};
  } catch(e) {}
  return {text:u8, encoding:'UTF-8（文字化けの可能性あり）'};
}
/* ヘッダー名から対応する項目を推測 */
function guessMapping(headers) {
  var map = {};
  CSV_FIELD_DEFS.forEach(function(f) {
    for (var i = 0; i < headers.length; i++) {
      var hname = String(headers[i]).trim();
      if (!hname) continue;
      if (f.hints.some(function(hint){ return hname === hint; })) { map[f.key] = i; return; }
    }
    for (var j = 0; j < headers.length; j++) {
      var hn = String(headers[j]).trim();
      if (!hn) continue;
      if (f.hints.some(function(hint){ return hn.indexOf(hint) >= 0; })) { map[f.key] = j; return; }
    }
  });
  return map;
}
/* 値の整形 */
function csvNorm(key, v) {
  var s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (key === 'karte_number') {
    // 全角数字・全角英字を半角に（医事システムの出力対策）
    return s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  }
  if (key === 'birth' || key === 'exam_date') {
    s = s.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    // 和暦（S40.4.3 / 昭和40年4月3日 / H1/1/8 など）→ 西暦
    var wm = s.match(/^(明治|大正|昭和|平成|令和|[MTSHRmtshr])\s*(\d{1,2}|元)[\.\/\-年](\d{1,2})[\.\/\-月](\d{1,2})/);
    if (wm) {
      var base = {'明治':1867,'M':1867,'大正':1911,'T':1911,'昭和':1925,'S':1925,'平成':1988,'H':1988,'令和':2018,'R':2018}[wm[1].length === 1 ? wm[1].toUpperCase() : wm[1]];
      var wy = base + (wm[2] === '元' ? 1 : parseInt(wm[2], 10));
      return wy + '-' + ('0' + wm[3]).slice(-2) + '-' + ('0' + wm[4]).slice(-2);
    }
    // 西暦の区切りあり（1965/4/3 / 1965-04-03 / 1965年4月3日）
    var sm = s.match(/^(\d{4})[\.\/\-年](\d{1,2})[\.\/\-月](\d{1,2})/);
    if (sm) return sm[1] + '-' + ('0' + sm[2]).slice(-2) + '-' + ('0' + sm[3]).slice(-2);
    var d = s.replace(/[^0-9]/g, '');
    if (d.length === 8) return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return '';
  }
  if (key === 'gender') {
    if (s === '男' || s === '男性' || s.toLowerCase() === 'male' || s === '1') return 'male';
    if (s === '女' || s === '女性' || s.toLowerCase() === 'female' || s === '2') return 'female';
    return '';
  }
  return s;
}

function onCsvFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function() {
    var dec = decodeCSVBuffer(new Uint8Array(reader.result));
    var rows = parseCSV(dec.text);
    if (rows.length < 2) { document.getElementById('csv-preview').innerHTML = '<div class="err-box">データ行が見つかりません。</div>'; return; }
    CSV_IMPORT = {fileName:f.name, encoding:dec.encoding, headers:rows[0], rows:rows.slice(1), mapping:guessMapping(rows[0])};
    renderCsvPreview();
  };
  reader.readAsArrayBuffer(f);
}
function csvSetMap(key, idx) {
  if (!CSV_IMPORT) return;
  if (idx === '') delete CSV_IMPORT.mapping[key];
  else CSV_IMPORT.mapping[key] = parseInt(idx);
  renderCsvPreview();
}

    seen[kn] = true;
    var rec = {};

    var sel = '<select onchange="csvSetMap(\'' + f.key + '\',this.value)" style="flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:6px;padding:5px 6px;font-size:12px;">'

    sel += '</select>';

      + '<span style="min-width:130px;color:' + (f.required ? '#DC2626' : '#475569') + ';">' + esc(f.label) + (f.required ? ' *' : '') + '</span>'
      + sel + '</div>';
  });
  h += '</div></div>';

  if (missReq.length > 0) {
    h += '<div class="err-box">⚠ ' + missReq.map(function(f){return esc(f.label);}).join('・') + ' の対応付けが必要です</div>';
  }

  // 件数サマリー
  h += '<div class="fr"><label>取込内容の確認</label><div class="sg4">'
    + siHTML('新規登録', stats.newCount, 0, '予定')
    + siHTML('更新', stats.updCount, 0, '内容に差あり')

    + siHTML('取込対象外', stats.errCount + stats.dupInFile, 0, 'エラー・重複')
    + '</div></div>';

    h += '<div class="err-box" style="font-size:12px;">' + errs.map(esc).join('<br>')
      + (stats.errCount + stats.dupInFile > errs.length ? '<br>ほか' + (stats.errCount + stats.dupInFile - errs.length) + '件' : '') + '</div>';
  }

  // プレビュー（先頭5件）
  h += '<div class="fr"><label>データの確認（先頭5件）</label><div style="overflow-x:auto;">'
    + '<table style="border-collapse:collapse;font-size:12px;"><thead><tr>';
  ['karte_number','name','kana','birth','gender','phone','company_code'].forEach(function(k) {
    var f = CSV_FIELD_DEFS.find(function(x){return x.key===k;});
    h += '<th style="border:1px solid #e2e8f0;padding:6px 8px;background:#F8FAFC;white-space:nowrap;">' + esc(f.label) + '</th>';
  });
  h += '<th style="border:1px solid #e2e8f0;padding:6px 8px;background:#F8FAFC;">判定</th></tr></thead><tbody>';
  parsed.slice(0, 5).forEach(function(rec) {
    var isNew = !patientsMaster[rec.karte_number];
    h += '<tr>';
    ['karte_number','name','kana','birth','gender','phone','company_code'].forEach(function(k) {
      var v = rec[k];
      if (k === 'gender') v = v === 'male' ? '男' : v === 'female' ? '女' : '';
      h += '<td style="border:1px solid #e2e8f0;padding:5px 8px;white-space:nowrap;">' + esc(v || '—') + '</td>';
    });
    h += '<td style="border:1px solid #e2e8f0;padding:5px 8px;"><span class="badge ' + (isNew ? 'bd-blue' : 'bd-amber') + '" style="font-size:10px;">'
      + (isNew ? '新規' : '既存あり') + '</span></td></tr>';
  });
  h += '</tbody></table></div></div>';

  // 更新方針
  h += '<div class="fr"><label>既存の受診者がいた場合</label><div class="tog-row">'
    + '<button class="tog on-blue" id="csv-mode-keep" onclick="csvSetMode(\'keep\')">空欄だけ埋める（推奨）</button>'
    + '<button class="tog" id="csv-mode-over" onclick="csvSetMode(\'over\')">CSVの内容で更新</button>'
    + '<button class="tog" id="csv-mode-skip" onclick="csvSetMode(\'skip\')">既存はそのまま</button>'
    + '</div></div>'
    + '<div class="fr"><label>対応者 <span style="color:#EF4444;">*</span></label>' + staffSelectHTML('csv-by', CURRENT_STAFF) + '</div>'
    + '<div id="csv-warn"></div>';

  box.innerHTML = h;
  if (!C.mode) C.mode = 'keep';
  csvSetMode(C.mode);
  var runBtn = document.getElementById('csv-run');
  if (runBtn) runBtn.style.display = (missReq.length === 0 && parsed.length > 0) ? '' : 'none';
}
function csvSetMode(m) {
  if (!CSV_IMPORT) return;
  CSV_IMPORT.mode = m;
  ['keep','over','skip'].forEach(function(k) {
    var el = document.getElementById('csv-mode-' + k);
    if (el) el.classList.toggle('on-blue', k === m);
  });
}
/* 実行：Supabaseへ登録 */
async function runCsvImport() {
  if (!CSV_IMPORT || !CSV_IMPORT.parsed) return;
  var by = requireStaff('csv-by', 'csv-warn');
  if (!by) return;
  if (!SB_READY || !PATIENTS_SYNC_READY) {
    var w = document.getElementById('csv-warn');
    if (w) w.innerHTML = '<div class="err-box">⚠ 受診者マスタに接続できません。SQLの実行状況をご確認ください。</div>';
    return;
  }
  var C = CSV_IMPORT, mode = C.mode || 'keep';
  var rows = [];
  C.parsed.forEach(function(rec) {
    var cur = patientsMaster[rec.karte_number];
    if (cur && mode === 'skip') return;
    var pick = function(key, curVal) {
      var v = rec[key] || '';
      if (!cur) return v;
      if (mode === 'over') return v || (curVal || '');
      return (curVal && String(curVal).trim()) ? curVal : v;   // keep: 既存優先
    };
    rows.push({
      karte_number: rec.karte_number,
      name:         pick('name', cur && cur.name),
      kana:         pick('kana', cur && cur.kana),
      kana_norm:    normKana(pick('kana', cur && cur.kana)),
      birth:        pick('birth', cur && cur.birth) || null,
      gender:       pick('gender', cur && cur.gender),
      phone:        pick('phone', cur && cur.phone),
      company_code: pick('company_code', cur && cur.companyCode),
      company_name: pick('company_name', cur && cur.companyName),
      postal_code:  pick('postal_code', cur && cur.postalCode),
      address:      pick('address', cur && cur.address),
      insurer_no:   pick('insurer_no', cur && cur.insurerNo),
      insured_sym:  pick('insured_sym', cur && cur.insuredSym),
      insured_no:   pick('insured_no', cur && cur.insuredNo),
      mail:         pick('mail', cur && cur.mail),
      course_code:  pick('course_code', cur && cur.courseCode),
      exam_date:    pick('exam_date', cur && cur.examDate) || null,
      qr_id:        pick('qr_id', cur && cur.qrId),
      ident_code:   pick('ident_code', cur && cur.identCode),
      imported_at:  new Date().toISOString(),
      imported_by:  by,
      updated_at:   new Date().toISOString(),
      updated_by:   by
    });
  });
  if (rows.length === 0) { alert('登録する行がありません。'); return; }
  var btn = document.getElementById('csv-run');
  if (btn) { btn.disabled = true; btn.textContent = '取込中...'; }
  try {
    var okCount = 0;
    for (var i = 0; i < rows.length; i += 100) {
      var chunk = rows.slice(i, i + 100);
      var res = await SB.from('patients').upsert(chunk, {onConflict:'karte_number'});
      if (res.error) throw res.error;
      okCount += chunk.length;
    }
    rows.forEach(function(rw) {
      patientsMaster[rw.karte_number] = {
        karteNumber: rw.karte_number, name: rw.name, kana: rw.kana, kanaNorm: rw.kana_norm,
        birth: rw.birth || '', gender: rw.gender, phone: rw.phone,
        companyCode: rw.company_code, companyName: rw.company_name,
        postalCode: rw.postal_code, address: rw.address,
        insurerNo: rw.insurer_no, insuredSym: rw.insured_sym, insuredNo: rw.insured_no,
        mail: rw.mail, courseCode: rw.course_code, examDate: rw.exam_date || '',
        qrId: rw.qr_id, identCode: rw.ident_code, note: ''
      };
    });
    closeModal('csv-modal');
    setSyncBadge('ok', '✓ 受診者マスタに' + okCount + '件を取り込みました');
    alert(okCount + '件を受診者マスタに登録しました。\n予約入力でカルテ番号を入れると氏名などが自動で入ります。');
  } catch(e) {
    var w2 = document.getElementById('csv-warn');
    if (w2) w2.innerHTML = '<div class="err-box">取込に失敗しました: ' + esc(e.message || String(e)) + '</div>';
    if (btn) { btn.disabled = false; btn.textContent = '取り込む'; }
  }
}

/* ═══ 受診者マスタ連携 ═══
   カルテ番号を入れると氏名・カナ・生年月日・性別を自動で読み込む。
   既に入力済みの欄は上書きしない（職員が直した内容を消さないため）。 */
var patientsMaster = {};      // karte_number -> {name, kana, birth, gender, phone, ...}
var PATIENTS_SYNC_READY = false;

function pmSetBox(msg, type) {
  var box = document.getElementById('fm-lookup');
  if (!box) return;
  if (!msg) { box.style.display = 'none'; box.innerHTML = ''; return; }
  var col = type === 'ok'   ? {bg:'#F0FDF4', bd:'#86EFAC', fg:'#065F46'}
          : type === 'warn' ? {bg:'#FFFBEB', bd:'#FDE68A', fg:'#92400E'}
          :                   {bg:'#F8FAFC', bd:'#e2e8f0', fg:'#64748b'};
  box.style.display = 'block';
  box.style.background = col.bg;
  box.style.border = '1px solid ' + col.bd;

/* カルテ番号入力時：マスタから受診者情報を読み込む */
function onKarteNoChange() {
  var el = document.getElementById('fm-karteno');
  if (!el) return;
  var kn = (el.value || '').trim();
  if (!kn) { pmSetBox('', ''); renderPrevMemo(); return; }
  var p = patientsMaster[kn] || patientsMaster[kn.replace(/^0+/, '')] || null;
  if (!p) {
    // 8桁ゼロ埋めでも照合する
    var padded = kn.length < 8 ? ('00000000' + kn).slice(-8) : kn;
    p = patientsMaster[padded] || null;
  }
  if (!p) {
    pmSetBox('該当する受診者が見つかりません（新規の方はそのまま入力してください）', 'warn');
    renderPrevMemo();
    return;
  }
  var filled = [];
  function setIfEmpty(id, val) {
    var e = document.getElementById(id);
    if (!e || !val) return;
    if (!e.value || !e.value.trim()) { e.value = val; filled.push(id); }
  }
  setIfEmpty('fm-name', p.name);
  setIfEmpty('fm-kana', p.kana);
  setIfEmpty('fm-birth', p.birth);
  setIfEmpty('fm-phone', p.phone);
  if (p.gender && !FS.gender) { FS.gender = p.gender; fsRender(); }
  pmSetBox('✓ ' + esc(p.name || '') + '　' + esc(p.kana || '')
    + (p.birth ? '　' + esc(p.birth) : '')
    + (filled.length ? '<br><span style="font-size:11px;">受診者マスタから自動入力しました</span>'
                     : '<br><span style="font-size:11px;">入力済みの内容はそのままにしています</span>'), 'ok');
  renderPrevMemo();
}
/* カナ入力時：表記ゆれを吸収して同一人物の候補を探す */
function onKanaChange() {
  var kEl = document.getElementById('fm-kana');
  var knEl = document.getElementById('fm-karteno');
  renderPrevMemo();
  if (!kEl || (knEl && knEl.value.trim())) return;   // カルテ番号が既にあれば何もしない
  var nk = normKana(kEl.value);
  if (!nk || nk.length < 2) return;
  var hits = Object.keys(patientsMaster).filter(function(k) {
    return patientsMaster[k].kanaNorm === nk;
  }).map(function(k){ return patientsMaster[k]; });
  if (hits.length === 0) return;
  if (hits.length === 1) {
    var p = hits[0];
    pmSetBox('該当する受診者が1件見つかりました：' + esc(p.name) + '（カルテ ' + esc(p.karteNumber) + '）'
      + ' <button class="btn" onclick="applyPatient(\'' + esc(p.karteNumber) + '\')" style="font-size:11px;padding:3px 10px;margin-left:6px;">この方を使う</button>', 'warn');
  } else {
    var html = '同じカナの方が' + hits.length + '件あります。選んでください：<div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">';
    hits.slice(0, 6).forEach(function(p) {
      html += '<button class="btn" onclick="applyPatient(\'' + esc(p.karteNumber) + '\')" style="font-size:11px;text-align:left;">'
        + esc(p.name) + '　' + esc(p.birth || '生年月日不明') + '　カルテ ' + esc(p.karteNumber) + '</button>';
    });
    html += '</div>';
    pmSetBox(html, 'warn');
  }
}
/* 候補から受診者を選んで反映 */
function applyPatient(karteNo) {
  var p = patientsMaster[karteNo];
  if (!p) return;
  var set = function(id, v) { var e = document.getElementById(id); if (e && v) e.value = v; };
  set('fm-karteno', p.karteNumber);
  set('fm-name', p.name);
  set('fm-kana', p.kana);
  set('fm-birth', p.birth);
  set('fm-phone', p.phone);
  if (p.gender) { FS.gender = p.gender; fsRender(); }
  pmSetBox('✓ ' + esc(p.name) + '　' + esc(p.kana) + '　を読み込みました', 'ok');
  renderPrevMemo();
}

var STATUS_LABEL = {reserved:'予約中', changed:'変更あり', rescheduled:'日程変更済み', cancelled:'キャンセル済み', noshow:'当日未受診'};
function hStatus(v) { return STATUS_LABEL[v] || v || ''; }

  {k:'memo',            label:'メモ',          fmt:hShort},

// 旧予約と新予約を比べ、変わった項目だけを配列で返す
function diffRes(oldR, newR) {
  var out = [];
  if (!oldR || !newR) return out;
  TRACK_FIELDS.forEach(function(f) {
    var a = oldR[f.k], b = newR[f.k];
    var na = (a===null||a===undefined) ? '' : a;
    var nb = (b===null||b===undefined) ? '' : b;
    if (String(na) === String(nb)) return;
    var fmt = f.fmt || hText;
    out.push({ field: f.label, before: fmt(a), after: fmt(b) });
  });
  return out;
}
// 変更履歴をDBへ保存（テーブル未作成でもアプリは止めない）
async function sbInsertHistory(r, actionType, diffs, note, by) {
  if (!SB_READY) return;
  var rows = (diffs && diffs.length > 0)
    ? diffs.map(function(d) {
        return { id: uid(), reservation_id: r.id, changed_by: by || '', karte_number: r.karteNumber || '',
                 patient_name: r.name || '', action_type: actionType,
                 field_name: d.field, old_value: String(d.before), new_value: String(d.after), note: note || '' };
      })
    : [{ id: uid(), reservation_id: r.id, changed_by: by || '', karte_number: r.karteNumber || '',
         patient_name: r.name || '', action_type: actionType,
         field_name: '', old_value: '', new_value: '', note: note || '' }];
  try {
    var res = await SB.from('reservation_change_history').insert(rows);
    if (res && res.error) console.warn('[SB] 変更履歴の保存をスキップ（テーブル未作成の可能性）', res.error);
  } catch (e) { console.warn('[SB] 変更履歴', e); }

/* ═══════════════════════════════════════════
   DB: 勤務表フル同期（v14）
   shift_cells / shift_wishes / shift_staff_memos / shift_settings
   セル単位で同期。書き込みは0.5秒デバウンスでまとめて送信するため、
   自動生成（数百セル）でも1回のupsertで済む。
   ═══════════════════════════════════════════ */
var SHIFT_SYNC_READY = false;  // テーブル読込成功でtrue。未作成ならローカル保存のみで動作
var shiftPendCells = {}, shiftPendWishes = {}, shiftPendMemos = {};
var shiftFlushTimer = null;

function queueShiftSync(kind, ym, name, dateStr, val) {
  if (!SB_READY || !SHIFT_SYNC_READY) return;
  var key = ym + '|' + name + '|' + dateStr;
  var rec = {ym:ym, name:name, date:dateStr, val:val};
  if (kind==='cell') shiftPendCells[key] = rec;
  else if (kind==='wish') shiftPendWishes[key] = rec;
  else if (kind==='memo') shiftPendMemos[key] = rec;
  if (shiftFlushTimer) clearTimeout(shiftFlushTimer);
  shiftFlushTimer = setTimeout(flushShiftSync, 500);
}

async function flushShiftSync() {
  shiftFlushTimer = null;
  if (!SB_READY || !SHIFT_SYNC_READY) return;
  var c = shiftPendCells, w = shiftPendWishes, m = shiftPendMemos;
  shiftPendCells = {}; shiftPendWishes = {}; shiftPendMemos = {};
  await flushOneShiftTable('shift_cells', c, 'shift_type');
  await flushOneShiftTable('shift_wishes', w, null);
  await flushOneShiftTable('shift_staff_memos', m, 'memo');
}

async function flushOneShiftTable(table, pend, valCol) {
  var ups = [], dels = [];
  Object.keys(pend).forEach(function(k){
    var r = pend[k];
    if (r.val) {
      var row = {ym:r.ym, staff_name:r.name, date:r.date};
      if (valCol) row[valCol] = (r.val===true ? '1' : r.val);
      ups.push(row);
    } else {
      dels.push(r);
    }
  });
  try {
    if (ups.length>0) {
      var res = await SB.from(table).upsert(ups, {onConflict:'ym,staff_name,date'});
      if (res.error) console.error('[SB] '+table+' upsert', res.error);
    }
    for (var i=0;i<dels.length;i++) {
      var d = dels[i];
      var r2 = await SB.from(table).delete().eq('ym', d.ym).eq('staff_name', d.name).eq('date', d.date);
      if (r2.error) console.error('[SB] '+table+' delete', r2.error);
    }
  } catch(e) { console.error('[SB] '+table+' flush', e); }
}

/* 月まるごと削除（勤務表の全削除ボタン用） */
async function sbClearShiftMonth(ym) {
  if (!SB_READY || !SHIFT_SYNC_READY) return;
  // 送信待ちの同月データも破棄（削除後に古いデータが復活しないように）
  [shiftPendCells, shiftPendWishes].forEach(function(pend){
    Object.keys(pend).forEach(function(k){ if (pend[k].ym===ym) delete pend[k]; });
  });
  try {
    await SB.from('shift_cells').delete().eq('ym', ym);
    await SB.from('shift_wishes').delete().eq('ym', ym);
  } catch(e) { console.error('[SB] shift clear', e); }
}

/* ─── Realtime subscription ─── */
var _realtimeChannels = [];
var RT_FAIL_TABLES = [];
var RT_SUBSCRIBED = false;   // reservationsのリアルタイム確立フラグ
// 現在の同期状態を正確に表すラベル（保存完了後などの待機表示に使用）
function syncIdleLabel() {
  if (RT_SUBSCRIBED) return '● リアルタイム同期中';
  if (_pollTimer) return '● 定期同期中（30秒ごと更新）';
  return '● 接続中（同期方式を確認中...）';
}
var _pollTimer = null;       // 定期同期（ポーリング）タイマー

// リアルタイムが使えないネットワーク（院内プロキシ等でWebSocket遮断）向けの自動フォールバック。
// 30秒ごとにDBから再読込して全PCの変更を取り込む。入力中・モーダル操作中はスキップ。
function startPollingFallback() {
  if (_pollTimer) return;
  console.warn('[SB] リアルタイム未確立のため定期同期モードへ切替（30秒ごと更新）');
  setSyncBadge('ok', '● 定期同期中（30秒ごと更新）');
  _pollTimer = setInterval(function() {
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    if (document.querySelector('.mo')) return;  // モーダル操作中は邪魔しない
    sbLoadAll().then(function(ok) {
      if (ok) {
        renderCurrentTab();
        setSyncBadge('ok', '● 定期同期中（30秒ごと更新）');
      }
    }).catch(function(){});
  }, 30000);
}
function stopPollingFallback() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}
// テーブル1つずつ独立チャンネルで購読するヘルパー。
// 未作成テーブルが混ざっていても、そのテーブルだけ失敗し他は生き続ける。
function rtSub(table, handler) {
  try {
    var ch = SB.channel('rt-' + table)
      .on('postgres_changes', {event: '*', schema: 'public', table: table}, handler)
      .subscribe(function(status) {
        if (status === 'SUBSCRIBED') {
          if (table === 'reservations') {
            RT_SUBSCRIBED = true;
            stopPollingFallback();
            setSyncBadge('ok', '● リアルタイム同期中');
          }
          console.log('[SB] realtime購読OK: ' + table);
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          if (RT_FAIL_TABLES.indexOf(table) < 0) RT_FAIL_TABLES.push(table);
          console.warn('[SB] realtime購読失敗: ' + table + '（setup-all SQL未実行でテーブル未作成の可能性）');
          if (table === 'reservations') setSyncBadge('warn', '予約の同期エラー — 再読込してください');
        } else if (status === 'CLOSED' && table === 'reservations') {
          setSyncBadge('warn', '同期切断 — 再読込してください');
        }
      });
    _realtimeChannels.push(ch);
  } catch(e) { console.warn('[SB] realtime購読例外: ' + table, e); }
}
function sbStartRealtime() {
  if (!SB_READY) return;
  _realtimeChannels.forEach(function(ch){ try { ch.unsubscribe(); } catch(e){} });
  _realtimeChannels = [];
  RT_FAIL_TABLES = [];
  RT_SUBSCRIBED = false;

  // reservations の変更を受信
  rtSub('reservations', function(payload) {
      var eType = payload.eventType;
      if (eType === 'DELETE') {
        var oldId = (payload.old || {}).id;
        if (oldId) reservations = reservations.filter(function(r){return r.id !== oldId;});
      } else {
        var row = payload.new;
        // company情報を補完
        var converted = rowToRes(row);
        if (converted.companyGroupId) {
          converted.companyColorIdx = companyColorMap[converted.companyGroupId] || 0;
        }
        var idx = reservations.findIndex(function(r){return r.id === converted.id;});
        if (idx >= 0) reservations[idx] = converted;
        else          reservations.push(converted);
      }
      renderCurrentTab();
    });
    // doctor_overrides の変更を受信
  rtSub('doctor_overrides', function(payload) {
      var eType = payload.eventType;
      if (eType === 'DELETE') {
        var d = (payload.old||{}).date;
        doctorOverrides = doctorOverrides.filter(function(o){return o.date !== d;});
      } else {
        var row = payload.new;
        var entry = {id:row.id, date:row.date, doctors:safeJSON(row.doctors,[]),
          prev:safeJSON(row.prev_doctors,[]), by:row.changed_by||'', at:'', reason:row.reason||''};
        var idx = doctorOverrides.findIndex(function(o){return o.date === entry.date;});
        if (idx >= 0) doctorOverrides[idx] = entry;
        else          doctorOverrides.push(entry);
      }
      renderCurrentTab();
    });
    // locker_overrides の変更を受信
  rtSub('locker_overrides', function(payload) {
      var eType = payload.eventType;
      if (eType === 'DELETE') {
        delete lockerOverrides[(payload.old||{}).date];
      } else {
        var row = payload.new;
        lockerOverrides[row.date] = {
          amMale:row.am_male, amFemale:row.am_female,
          pmMale:row.pm_male, pmFemale:row.pm_female,
          reason:row.reason||'', by:row.changed_by||'', at:''
        };
      }
      renderCurrentTab();
    });
    // slot_overrides（検査枠変更）の変更を受信
  rtSub('slot_overrides', function(payload) {
      var eType = payload.eventType;
      if (eType === 'DELETE') {
        delete slotOverrides[(payload.old||{}).date];
      } else {
        var row = payload.new;
        slotOverrides[row.date] = {
          gfAm:row.gf_am, gfPm:row.gf_pm,
          bariumAm:row.barium_am, bariumPm:row.barium_pm,
          mammoAm:row.mammo_am, mammoPm:row.mammo_pm,
          mriAm:row.mri_am, mriPm:row.mri_pm,
          keinyuuAm:row.keinyuu_am, keinyuuPm:row.keinyuu_pm,
          reason:row.reason||'', by:row.changed_by||'', at:''
        };
      }
      renderCurrentTab();
    });
    // exam_type_daily_limits（種別枠変更）の変更を受信
  rtSub('exam_type_daily_limits', function(payload) {
      var eType = payload.eventType;
      if (eType === 'DELETE') {
        delete examTypeDailyLimits[(payload.old||{}).date];
      } else {
        var row = payload.new;
        examTypeDailyLimits[row.date] = {
          dockAm:row.dock_am, amOther:row.am_other,
          pmKyokai:row.pm_kyokai, pmGeneral:row.pm_general,
          reason:row.reason||'', by:row.changed_by||'', at:''
        };
      }
      renderCurrentTab();
    });
    // shift_cells（勤務表シフト）の変更を受信
  rtSub('shift_cells', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.ym) return;
      if (!shiftData[row.ym]) shiftData[row.ym] = {};
      var k = (row.staff_name||'') + '|' + (row.date||'');
      if (payload.eventType === 'DELETE') delete shiftData[row.ym][k];
      else if (payload.new) shiftData[row.ym][k] = payload.new.shift_type;
      saveLocal();
      if (currentTab === 'shift') renderShift();
    });
    // shift_wishes（希望休）の変更を受信
  rtSub('shift_wishes', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.ym) return;
      if (!shiftWishes[row.ym]) shiftWishes[row.ym] = {};
      var k = (row.staff_name||'') + '|' + (row.date||'');
      if (payload.eventType === 'DELETE') delete shiftWishes[row.ym][k];
      else if (payload.new) shiftWishes[row.ym][k] = true;
      saveLocal();
      if (currentTab === 'shift') renderShift();
    });
    // shift_staff_memos（A/B/C/F/診メモ）の変更を受信
  rtSub('shift_staff_memos', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.ym) return;
      if (!shiftStaffMemos[row.ym]) shiftStaffMemos[row.ym] = {};
      var k = (row.staff_name||'') + '|' + (row.date||'');
      if (payload.eventType === 'DELETE') delete shiftStaffMemos[row.ym][k];
      else if (payload.new) shiftStaffMemos[row.ym][k] = payload.new.memo || '';
      saveLocal();
      if (currentTab === 'shift') renderShift();
    });
    // shift_settings（委員会・固定ルール）の変更を受信
  rtSub('shift_settings', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.key) return;
      if (payload.eventType === 'DELETE') {
        if (row.key.indexOf('committees|')===0) delete shiftCommittees[row.key.slice(11)];
      } else if (payload.new) {
        if (row.key === 'fixed_committee_rules') {
          var fv = safeJSON(payload.new.value, null);
          if (fv !== null) fixedCommitteeRules = fv;
        } else if (row.key.indexOf('committees|')===0) {
          shiftCommittees[row.key.slice(11)] = safeJSON(payload.new.value, []);
        }
      }
      saveLocal();
      if (currentTab === 'shift') renderShift();
    });
    // patients（受診者マスタ）の変更を受信
    rtSub('patients', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.karte_number) return;
      if (payload.eventType === 'DELETE') delete patientsMaster[row.karte_number];
      else if (payload.new) patientsMaster[payload.new.karte_number] = {
        karteNumber: payload.new.karte_number, name: payload.new.name||'', kana: payload.new.kana||'',
        kanaNorm: payload.new.kana_norm || normKana(payload.new.kana||''),
        birth: payload.new.birth||'', gender: payload.new.gender||'', phone: payload.new.phone||'',
        companyCode: payload.new.company_code||'', companyName: payload.new.company_name||'',
        postalCode: payload.new.postal_code||'', address: payload.new.address||'',
        insurerNo: payload.new.insurer_no||'', insuredSym: payload.new.insured_sym||'', insuredNo: payload.new.insured_no||'',
        mail: payload.new.mail||'', courseCode: payload.new.course_code||'', examDate: payload.new.exam_date||'',
        qrId: payload.new.qr_id||'', identCode: payload.new.ident_code||'', note: payload.new.note||''
      };

    rtSub('massage_offs', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.date) return;
      if (payload.eventType === 'DELETE') delete massageOffs[row.date];
      else if (payload.new) massageOffs[row.date] = {type: payload.new.off_type||'all', note: payload.new.note||'', by: payload.new.changed_by||''};
      if (currentTab === 'calendar') renderCalendar();
      if (currentTab === 'day') renderDay();
    })
    // karte_prep（カルテ準備）の変更を受信
    rtSub('karte_prep', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.date) return;
      if (payload.eventType === 'DELETE' || (payload.new && !payload.new.done)) delete kartePrepDone[row.date];
      else if (payload.new) kartePrepDone[row.date] = { done:true, by: payload.new.changed_by||'', at: payload.new.changed_at||'' };

      if (currentTab === 'calendar') renderCalendar();
      if (currentTab === 'day') renderDay();
    })
    // pass_station_overrides（当日キャンセル/追加）の変更を受信
    rtSub('pass_station_overrides', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.reservation_id) return;
      var k = row.reservation_id + '|' + row.station;
      if (payload.eventType === 'DELETE') delete passStationOv[k];
      else if (payload.new && (payload.new.mode === 'add' || payload.new.mode === 'cancel')) passStationOv[k] = payload.new.mode;
      else delete passStationOv[k];
      saveLocal();
      if (currentTab === 'passage') renderPassage();
    })
    // passage_records（通過管理）の変更を受信
  rtSub('passage_records', function(payload) {
    var row = payload.new || payload.old || {};
    if (!row.reservation_id) return;
    var k = row.reservation_id + '|' + row.station;
    if (payload.eventType === 'DELETE') delete passageData[k];
    else if (payload.new) {
      var _ex = passageData[k] || {};
      passageData[k] = {
        state: payload.new.state || (payload.new.done_at ? 'done' : ''),
        startAt: payload.new.start_at || payload.new.done_at || '',
        endAt: payload.new.end_at || payload.new.done_at || '',
        by: payload.new.done_by || '',
        note: (payload.new.note !== undefined && payload.new.note !== null) ? payload.new.note : (_ex.note || ''),
        recumbent: (payload.new.recumbent !== undefined && payload.new.recumbent !== null) ? !!payload.new.recumbent : !!_ex.recumbent
      };
    }
    saveLocal();
    if (currentTab === 'passage') renderPassage();
  })
  // akiba_days（秋葉医院予約表）の変更を受信
  rtSub('akiba_days', function(payload) {
      var row = payload.new || payload.old || {};
      if (!row.ym) return;
      if (!akibaData[row.ym]) akibaData[row.ym] = {};
      if (payload.eventType === 'DELETE') {
        delete akibaData[row.ym][row.day];
      } else if (payload.new) {
        akibaData[row.ym][payload.new.day] = {
          status: payload.new.status || 'open',
          note: payload.new.note || '',
          patients: Array.isArray(payload.new.patients) ? payload.new.patients : safeJSON(payload.new.patients, [])
        };
      }
      saveLocal();
      if (currentTab === 'akiba') akRerender();
    });
    // worklists（当日業務表）の変更を受信
  rtSub('worklists', function(payload) {
      var eType = payload.eventType;
      var affDate = (payload.new || payload.old || {}).date;
      if (eType === 'DELETE') {
        if (affDate) delete worklistData[affDate];
      } else if (payload.new) {
        worklistData[payload.new.date] = rowToWorklist(payload.new);
      }
      // 編集中フォームの入力を消さないよう、別日付/別タブのときのみ再描画
      if (!(currentTab === 'worklist' && affDate === selectedDate)) {
        renderCurrentTab();
      } else {
        setSyncBadge('warn', '他端末がこの日の業務表を更新しました（保存で上書き／再選択で反映）');
      }
    });
    // diaries（健診センター日誌）の変更を受信
  rtSub('diaries', function(payload) {
      var affDate = (payload.new || payload.old || {}).date;
      if (!affDate) return;
      if (payload.eventType === 'DELETE') delete diaryData[affDate];
      else if (payload.new) {
        var dd = (payload.new.data && typeof payload.new.data === 'object') ? payload.new.data : safeJSON(payload.new.data, null);
        if (dd) diaryData[affDate] = dd;
      }
      saveLocal();
      // 編集中フォームの入力を消さないよう、別日付/別タブのときのみ再描画
      if (!(currentTab === 'diary' && affDate === selectedDate)) renderCurrentTab();
      else setSyncBadge('warn', '他端末がこの日の日誌を更新しました（保存で上書き／再選択で反映）');
    });
    // staff_memos（共有メモ）の変更を受信
  rtSub('staff_memos', function(payload) {
      if (payload.eventType === 'DELETE') {
        var did = (payload.old||{}).id;
        if (did) staffMemos = staffMemos.filter(function(m){ return m.id !== did; });
      } else if (payload.new) {
        var nm = rowToMemo(payload.new);
        var idx = -1;
        for (var i=0;i<staffMemos.length;i++){ if (staffMemos[i].id===nm.id){ idx=i; break; } }
        if (idx>=0) staffMemos[idx] = nm; else staffMemos.push(nm);
      }
      if (currentTab === 'memo') renderMemo();
  });

  // 15秒以内にリアルタイムが確立しない場合（WebSocket遮断ネットワーク等）は定期同期へ自動切替
  setTimeout(function() {
    if (!RT_SUBSCRIBED) startPollingFallback();
  }, 15000);
}
</script>

function dispName(r) {
  if (!r) return '';
  return r.name || r.kana || (r.karteNumber ? 'No.'+r.karteNumber : '(名前未登録)');
}
function parseYMD(s) {
  var parts = s.split('-');
  return {y:parseInt(parts[0]),m:parseInt(parts[1]),d:parseInt(parts[2])};
}
function getYear(s) { return parseInt(s.split('-')[0]); }

function showError(msg) {
  var el = document.getElementById('error-display');
  if (el) { el.style.display = 'block'; el.textContent = 'エラー: ' + msg; }
  console.error(msg);
}

function getLimits(date) {
  var ov = lockerOverrides[date];
  var so = slotOverrides[date] || {};
  function pk(v, def) { return (v===null||v===undefined||v==='') ? def : v; }
  return {
    gf:DEF_LIM.gf, mri:DEF_LIM.mri, keinyuu:DEF_LIM.keinyuu,
    gfAm:pk(so.gfAm,DEF_LIM.gf),           gfPm:pk(so.gfPm,DEF_LIM.gf),
    bariumAm:(so.bariumAm===null||so.bariumAm===undefined||so.bariumAm==='')?null:so.bariumAm,
    bariumPm:(so.bariumPm===null||so.bariumPm===undefined||so.bariumPm==='')?null:so.bariumPm,
    mriAm:pk(so.mriAm,DEF_LIM.mri),        mriPm:pk(so.mriPm,DEF_LIM.mri),
    keinyuuAm:pk(so.keinyuuAm,DEF_LIM.keinyuu), keinyuuPm:pk(so.keinyuuPm,DEF_LIM.keinyuu),
    mammoAm:(so.mammoAm===null||so.mammoAm===undefined||so.mammoAm==='')?null:so.mammoAm,
    mammoPm:(so.mammoPm===null||so.mammoPm===undefined||so.mammoPm==='')?null:so.mammoPm,
    shikyu:DEF_LIM.shikyu, kenshin:DEF_LIM.kenshin,
    amMale:ov?ov.amMale:DEF_LIM.amMale, amFemale:ov?ov.amFemale:DEF_LIM.amFemale,
    pmMale:ov?ov.pmMale:DEF_LIM.pmMale, pmFemale:ov?ov.pmFemale:DEF_LIM.pmFemale
  };
}
function hasSlotOverride(date) {
  var so = slotOverrides[date];
  if (!so) return false;
  var keys = ['gfAm','gfPm','bariumAm','bariumPm','mriAm','mriPm','keinyuuAm','keinyuuPm','mammoAm','mammoPm'];
  for (var i=0;i<keys.length;i++) {
    var v = so[keys[i]];
    if (v!==null && v!==undefined && v!=='') return true;
  }
  return false;
}
function getDoctors(date) {
  var ov = doctorOverrides.find(function(o){return o.date===date;});
  if (ov) return {doctors:ov.doctors,changed:true};
  return {doctors:(DEF_DOCS[new Date(date).getDay()]||[]),changed:false};
}
function calcSlots(date) {
  var ac = reservations.filter(function(r){return r.date===date&&(r.status==='reserved'||r.status==='changed');});
  var am = ac.filter(function(r){return r.timeSlot==='am';});
  var pm = ac.filter(function(r){return r.timeSlot==='pm';});
  function bkt(list, b) {
    return list.filter(function(r){ var et = examTypeById(r.examTypeId); return et && et.bucket===b; }).length;
  }
  return {
    amTotal:am.length, pmTotal:pm.length,
    bDockAm:bkt(am,'dock'),
    bOtherAm:bkt(am,'kyokai')+bkt(am,'general'),
    bKyokaiPm:bkt(pm,'kyokai'),
    bGeneralPm:bkt(pm,'general'),
    bUnsetAm:am.filter(function(r){return !examTypeById(r.examTypeId);}).length,
    bUnsetPm:pm.filter(function(r){return !examTypeById(r.examTypeId);}).length,
    amGf:ac.filter(function(r){return r.stomachExamType==='camera' && (r.stomachExamTime||r.timeSlot)==='am';}).length,
    amBarium:ac.filter(function(r){return r.stomachExamType==='barium' && (r.stomachExamTime||r.timeSlot)==='am';}).length,
    amMri:am.filter(function(r){return r.hasMRI;}).length,
    amKeinyuu:am.filter(function(r){return r.hasKeidou||r.hasNyuecho;}).length,
    amKeidou:am.filter(function(r){return r.hasKeidou;}).length,
    amNyuecho:am.filter(function(r){return r.hasNyuecho;}).length,
    amMammo:ac.filter(function(r){return r.hasMammo && (r.mammoTime||r.timeSlot)==='am';}).length,
    amMale:am.filter(function(r){return r.gender==='male';}).length,
    amFemale:am.filter(function(r){return r.gender==='female';}).length,
    pmGf:ac.filter(function(r){return r.stomachExamType==='camera' && (r.stomachExamTime||r.timeSlot)==='pm';}).length,
    pmBarium:ac.filter(function(r){return r.stomachExamType==='barium' && (r.stomachExamTime||r.timeSlot)==='pm';}).length,
    pmMri:pm.filter(function(r){return r.hasMRI;}).length,
    pmKeinyuu:pm.filter(function(r){return r.hasKeidou||r.hasNyuecho;}).length,
    pmKeidou:pm.filter(function(r){return r.hasKeidou;}).length,
    pmNyuecho:pm.filter(function(r){return r.hasNyuecho;}).length,
    pmMammo:ac.filter(function(r){return r.hasMammo && (r.mammoTime||r.timeSlot)==='pm';}).length,
    pmMale:pm.filter(function(r){return r.gender==='male';}).length,
    pmFemale:pm.filter(function(r){return r.gender==='female';}).length,
    shikyu:ac.filter(function(r){return r.hasShikyu;}).length,
    kenshin:ac.filter(function(r){return r.isKenshin;}).length,
    seisushi:ac.filter(function(r){return r.seisushi==='yes';}).length,
    massage:ac.filter(function(r){return !!r.hasMassage;}).length,
    mrcp:ac.filter(function(r){return r.hasMRCP;}).length,
    dwibs:ac.filter(function(r){return r.hasDWIBS;}).length,
    rocomo:ac.filter(function(r){return r.hasRocomo;}).length,
    daicho:ac.filter(function(r){return r.hasDaicho;}).length
  };
}
function getCC(r) {
  if (!r.companyGroupId) return null;
  if (companyColorMap[r.companyGroupId] === undefined) {
    companyColorMap[r.companyGroupId] = Object.keys(companyColorMap).length % CC.length;
  }
  return CC[companyColorMap[r.companyGroupId]];
}

function goToDayView() { switchTab('day'); }
function switchTab(tab) {
  try {
    currentTab = tab;
    var tabs = ['calendar','day','passage','search','psearch','akiba','seisushi','worklist','diary','memo','shift'];
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i];
      var btn = document.getElementById('tab-' + t + '-btn');
      var content = document.getElementById('tab-' + t + '-content');
      if (btn) btn.classList.toggle('active', t === tab);
      if (content) content.style.display = t === tab ? 'block' : 'none';
    }
    // 勤務表タブのみ横幅を広げる
    var mainEl = document.querySelector('.main');
    if (mainEl) mainEl.classList.toggle('main-wide', tab === 'shift');
    renderCurrentTab();
  } catch(e) {
    showError('switchTab: ' + e.message);
  }
}

function renderCurrentTab() {
  try {
    if (currentTab === 'calendar') renderCalendar();
    else if (currentTab === 'day') renderDay();
    else if (currentTab === 'passage') renderPassage();
    else if (currentTab === 'search') renderSearch();
    else if (currentTab === 'psearch') renderPSearch();
    else if (currentTab === 'akiba') renderAkiba();
    else if (currentTab === 'seisushi') renderSeisushi();
    else if (currentTab === 'worklist') renderWorklist();
    else if (currentTab === 'diary') renderDiary();
    else if (currentTab === 'memo') renderMemo();
    else if (currentTab === 'shift') renderShift();
    // 印刷モードの更新は描画振り分けの後に一度だけ（秋葉医院タブ以外では自動解除）
    if (typeof akUpdatePrintMode === 'function') akUpdatePrintMode();
  } catch(e) {
    showError('renderCurrentTab: ' + e.message);
  }
}

function yearOptions(sel) {
  var now = new Date().getFullYear();
  var h = '';
  for (var y = now-1; y <= now+3; y++) {
    h += '<option value="' + y + '"' + (y===sel?' selected':'') + '>' + y + '年</option>';
  }
  return h;
}
function monthOptions(sel) {
  var h = '';
  for (var m = 1; m <= 12; m++) {
    h += '<option value="' + m + '"' + (m===(sel+1)?' selected':'') + '>' + m + '月</option>';
  }
  return h;
}
function buildDP(cid, dateStr) {
  var ymd = parseYMD(dateStr || todayStr());
  var dm = new Date(ymd.y, ymd.m, 0).getDate();
  var dOpts = '';
  for (var i = 1; i <= dm; i++) {
    dOpts += '<option value="' + i + '"' + (i===ymd.d?' selected':'') + '>' + i + '日</option>';
  }
  return '<div class="dp-row" id="' + cid + '">'
    + '<select class="dp-sel" id="' + cid + '-y" onchange="dpChg(\'' + cid + '\')">' + yearOptions(ymd.y) + '</select>'
    + '<select class="dp-sel" id="' + cid + '-m" onchange="dpChg(\'' + cid + '\')">' + monthOptions(ymd.m-1) + '</select>'
    + '<select class="dp-sel" id="' + cid + '-d" onchange="dpUpdateDow(\'' + cid + '\')">' + dOpts + '</select>'
    + '<span id="' + cid + '-dow" style="font-size:13px;margin-left:6px;align-self:center;"></span>'
    + '</div>';
}
function dpChg(cid) {
  var yEl = document.getElementById(cid+'-y');
  var mEl = document.getElementById(cid+'-m');
  var dEl = document.getElementById(cid+'-d');
  if (!yEl || !mEl || !dEl) return;
  var y = parseInt(yEl.value), m = parseInt(mEl.value);
  var cur = parseInt(dEl.value), mx = new Date(y,m,0).getDate();
  var opts = '';
  for (var i = 1; i <= mx; i++) opts += '<option value="' + i + '"' + (i===Math.min(cur,mx)?' selected':'') + '>' + i + '日</option>';
  dEl.innerHTML = opts;
  dpUpdateDow(cid);
}
/* 選択中の日付から曜日を自動表示（土=青／日祝=赤） */
function dpUpdateDow(cid) {
  if (cid === 'fm-date' && typeof fsRender === 'function' && document.getElementById('form-modal')) {
    setTimeout(function(){ try { fsRender(); checkWarn(); } catch(e){} }, 0);
  }
  var el = document.getElementById(cid+'-dow');
  if (!el) return;
  var v = dpVal(cid);
  if (!v) { el.textContent = ''; return; }
  var p = parseYMD(v);
  var dt = new Date(p.y, p.m-1, p.d);
  var w = dt.getDay();
  var isHol = isHolidayOrSunday(v);
  el.textContent = '（' + DOW[w] + '）';
  el.style.color = isHol ? '#DC2626' : (w===6 ? '#2563EB' : '#475569');
  el.style.fontWeight = '600';
}
function dpVal(cid) {
  var y = document.getElementById(cid+'-y');
  var m = document.getElementById(cid+'-m');
  var d = document.getElementById(cid+'-d');
  if (!y||!m||!d) return '';
  return y.value + '-' + pad(m.value) + '-' + pad(d.value);
}

function siHTML(label, used, max, note) {
  var r = max>0 ? used/max : 0;
  var cl = max ? (used>=max?'si-full':r>=0.8?'si-warn':'si-ok') : 'si-none';
  var tc = max ? (used>=max?'full':r>=0.8?'warn':'ok') : '';
  var bc = used>=max?'#EF4444':r>=0.8?'#F59E0B':'#10B981';
  var bar = max ? '<div class="bar-bg"><div class="bar-fill" style="width:'+Math.min(r*100,100)+'%;background:'+bc+';"></div></div>' : '';
  var n = note ? ' <span class="si-note">'+note+'</span>' : '';
  return '<div class="si '+cl+'">'
    + '<div class="si-lbl">'+label+n+'</div>'
    + '<div class="si-val '+tc+'">'+used+(max?'<span style="font-size:10px;color:#64748b;">'+'/'+max+'</span>':'')+'</div>'
    + bar + '</div>';
}
