function renderSeisushi() {
  var el = document.getElementById('tab-seisushi-content');
  if (!el) return;
  var now = new Date(), baseYear = now.getFullYear();
  var items = reservations.filter(function(r){
    var y = getYear(r.date);
    return (y===baseYear||y===baseYear+1) && (r.seisushi==='yes'||r.seisushi==='unknown') && (r.status==='reserved'||r.status==='changed');
  });
  var mealMap = {store:'店内',bento:'弁当',unknown:'未確認',none:'不要'};
  var mealCl  = {store:'bd-amber',bento:'bd-green',unknown:'bd-gray',none:'bd-gray'};
  var grouped = {};
  items.forEach(function(r){ if(!grouped[r.date])grouped[r.date]=[]; grouped[r.date].push(r); });
  var sorted = Object.keys(grouped).sort();
  var lastY = null;
  var totalPeople = 0;
  var rows = sorted.map(function(date){
    var rs = grouped[date];
    var y = getYear(date);
    var yH = '';
    if (y !== lastY) {
      yH = '<div style="padding:5px 0;font-size:12px;font-weight:600;color:#64748b;">'
        + y+'年'+(y>baseYear?'<span class="ny-badge">翌年</span>':'')+'</div>';
      lastY = y;
    }
    // 日別集計（区分ごと人数）
    var agg = {store:0,bento:0,unknown:0,none:0};
    var dayPeople = 0;
    rs.forEach(function(r){
      var cnt = r.sushiPeopleCount||1;
      var mt = r.seisushi==='unknown' ? 'unknown' : (r.sushiMealType||'unknown');
      agg[mt] = (agg[mt]||0) + cnt;
      dayPeople += cnt;
    });
    totalPeople += dayPeople;
    var aggParts = [];
    if (agg.store>0)   aggParts.push('店内'+agg.store+'名');
    if (agg.bento>0)   aggParts.push('弁当'+agg.bento+'名');
    if (agg.unknown>0) aggParts.push('未確認'+agg.unknown+'名');
    if (agg.none>0)    aggParts.push('不要'+agg.none+'名');
    var rowsHTML = rs.map(function(r){
      var rcc = r.reservationType==='company' ? getCC(r) : null;
      var mt = r.seisushi==='unknown' ? 'unknown' : (r.sushiMealType||'unknown');
      var cnt = r.sushiPeopleCount||1;
      return '<div style="padding:8px 12px;border-bottom:1px solid #e2e8f0;font-size:13px;display:flex;justify-content:space-between;align-items:center;">'
        + '<span>'+esc(dispName(r))+' <span style="font-size:11px;color:#94a3b8;">'+esc(r.kana||'')+'</span> '
        + (r.timeSlot==='am'?'<span class="badge" style="background:#EFF6FF;color:#3B82F6;font-size:10px;">午前</span>':'<span class="badge" style="background:#F5F3FF;color:#7C3AED;font-size:10px;">午後</span>')
        + '<span class="badge '+(mealCl[mt]||'bd-gray')+'" style="font-size:10px;margin-left:3px;">'+(r.seisushi==='unknown'?'🍣?未確認':(mealMap[mt]||'未確認'))+(cnt>1?' '+cnt+'名':'')+'</span>'
        + (rcc?'<span class="badge" style="background:'+rcc.bg+';color:'+rcc.text+';border:1px solid '+rcc.stripe+';font-size:10px;">🏢 '+r.companyName+'</span>':'')
        + '</span><span style="color:#64748b;font-size:12px;">'+r.phone+'</span></div>';
    }).join('');
    return yH + '<div class="sei-day"><div class="sei-head"><span>'+date+'（'+DOW[new Date(date).getDay()]+'）</span><span>'+dayPeople+'名'+(aggParts.length>0?'（'+aggParts.join(' / ')+'）':'')+'</span></div><div>'+rowsHTML+'</div></div>';
  }).join('');
  el.innerHTML = '<div class="card"><div class="card-head"><span style="font-weight:600;">🍣 誠寿司予約一覧</span>'
    + '<span style="display:flex;align-items:center;gap:8px;"><span style="font-size:13px;color:#64748b;">合計 <strong>'+totalPeople+'名</strong></span>'
    + '<button class="btn" onclick="doSeisushiCSV()" style="font-size:11px;padding:4px 10px;">📥 CSV</button></span></div>'
    + '<div class="card-body">'+(sorted.length===0?'<div style="text-align:center;color:#94a3b8;padding:20px;">誠寿司予約はありません</div>':rows)+'</div></div>';
}

// 誠寿司CSV出力
function doSeisushiCSV() {
  var now = new Date(), baseYear = now.getFullYear();
  var mealMap = {store:'店内',bento:'弁当',unknown:'未確認',none:'不要'};
  var items = reservations.filter(function(r){
    var y = getYear(r.date);
    return (y===baseYear||y===baseYear+1) && (r.seisushi==='yes'||r.seisushi==='unknown') && (r.status==='reserved'||r.status==='changed');
  }).sort(function(a,b){ return a.date<b.date?-1:1; });
  var rows = [['予約日','氏名','カナ','電話','午前午後','誠寿司','食事区分','人数','企業名','対応者']];
  items.forEach(function(r){
    rows.push([
      r.date, r.name, r.kana, r.phone,
      r.timeSlot==='am'?'午前':'午後',
      r.seisushi==='yes'?'あり':'未確認',
      r.seisushi==='unknown'?'未確認':(mealMap[r.sushiMealType]||'未確認'),
      r.sushiPeopleCount||1,
      r.companyName||'', r.updatedBy||''
    ]);
  });
  var csv = '\uFEFF' + rows.map(function(row){
    return row.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '誠寿司_' + todayStr() + '.csv';
  a.click();
}

// 当日業務表（Phase 1）

function calcWorklistAuto(date) {
  // 予約データから自動集計
  var ac = reservations.filter(function(r){return r.date===date&&(r.status==='reserved'||r.status==='changed');});
  var am = ac.filter(function(r){return r.timeSlot==='am';});
  var pm = ac.filter(function(r){return r.timeSlot==='pm';});
  return {
    total:    ac.length,
    amTotal:  am.length,
    pmTotal:  pm.length,
    male:     ac.filter(function(r){return r.gender==='male';}).length,

// HTMLテキスト用エスケープ（従来のescもこれ。シングルクォートも安全側でエスケープ）
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// HTML属性値用（両クォートをエスケープ済みなので escHtml と同じで安全）
function escAttr(s) { return escHtml(s); }
// onclick等でJS文字列リテラルに埋め込む用（\ ' " 改行 < をエスケープ）
function escJs(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,'').replace(/\n/g,'\\n').replace(/</g,'\\x3C');
}
function esc(s) { return escHtml(s); }

// 予約から健診種別・主要検査の件数を自動集計
function diaryAutoDetail(date) {
  var byType = {}, ex = {gf:0, barium:0, mammo:0, shikyu:0, keidou:0, nyuecho:0, ct:0, mri:0, kotsu:0, ninchi:0, md:0, hoken:0, seisushi:0};
  var total = 0;
  reservations.forEach(function(r){
    if (r.date !== date || (r.status !== 'reserved' && r.status !== 'changed')) return;
    total++;
    var t = r.examTypeName || '種別未設定';
    byType[t] = (byType[t] || 0) + 1;
    if (r.stomachExamType === 'camera') ex.gf++;
    if (r.stomachExamType === 'barium') ex.barium++;
    if (r.hasMammo) ex.mammo++;
    if (r.hasShikyu) ex.shikyu++;
    if (r.hasKeidou) ex.keidou++;
    if (r.hasNyuecho) ex.nyuecho++;
    if (r.hasCT) ex.ct++;
    if (r.hasMRI) ex.mri++;
    if (r.hasKotsu) ex.kotsu++;
    if (r.hasNinchi) ex.ninchi++;
    if (r.hasMD) ex.md++;
    if (r.hasHoken) ex.hoken++;
    if (r.seisushi === 'yes') ex.seisushi++;
  });
  return { byType: byType, ex: ex, total: total };
}

// 日誌用 小入力欄ヘルパー
function diaryInput(label, id, val, ph) {

    + '<input id="'+id+'" value="'+esc(val)+'" placeholder="'+(ph||'')+'" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;"/></div>';
}
// 予約編集の対応者（事務スタッフ名簿）から選ぶドロップダウン付きの入力欄
function diaryStaffSelect(id, cur) {
  cur = cur || '';
  var opts = '<option value="">-- 選択 --</option>';
  OFFICE_MEMBERS.forEach(function(m){
    opts += '<option value="'+esc(m.name)+'"'+(m.name===cur?' selected':'')+'>'+esc(m.name)+'</option>';
  });
  var isOther = cur && !OFFICE_MEMBERS.some(function(m){return m.name===cur;});
  opts += '<option value="__other__"'+(isOther?' selected':'')+'>その他（直接入力）</option>';
  return '<select id="'+id+'" onchange="staffSelChg(\''+id+'\')" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;font-size:15px;background:#fff;">'+opts+'</select>'
    + '<input id="'+id+'-other" value="'+(isOther?esc(cur):'')+'" placeholder="担当者名を入力" style="display:'+(isOther?'block':'none')+';width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;font-size:15px;"/>';
}
function diaryStaffField(label, id, val) {
  return '<div class="fr" style="margin-bottom:0;"><label style="font-size:12px;font-weight:600;">'+label
    + ' <span style="font-size:10px;font-weight:400;color:#94a3b8;">名簿から選択</span></label>'
    + diaryStaffSelect(id, val||'') + '</div>';
}
// 勤務表から自動反映される読み取り専用欄（入力欄なし・二重入力防止）
function diaryReadonly(label, val) {
  return '<div class="fr" style="margin-bottom:0;"><label style="font-size:11px;">'+label+' <span style="font-size:9px;color:#94a3b8;">勤務表連動</span></label>'
    + '<div style="width:100%;border:1px dashed #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;min-height:31px;background:#F8FAFC;color:'+(val?'#1e293b':'#94a3b8')+';">'+(val?esc(val):'未反映')+'</div></div>';
}
function diaryInputNum(label, id, val, unit) {
  var unitHtml = unit ? '<span style="font-size:12px;color:#64748b;white-space:nowrap;">'+unit+'</span>' : '';
  return '<div class="fr" style="margin-bottom:0;"><label style="font-size:11px;">'+label+'</label>'
    + '<div style="display:flex;align-items:center;gap:5px;">'

// 当日ドクターGS実施件数の行
function renderGsDoctorRows(diary, todayDoctors) {
  // 初回は当日担当医を行として用意
  if (!diary.gsDoctors || diary.gsDoctors.length===0) {
    diary.gsDoctors = (todayDoctors||[]).map(function(d){return {doctor:d, count:''};});
    if (diary.gsDoctors.length===0) diary.gsDoctors = [{doctor:'', count:''}];
  }
  return diary.gsDoctors.map(function(row, i){
    return '<div style="display:grid;grid-template-columns:1fr 100px 36px;gap:8px;margin-bottom:6px;align-items:center;">'
      + '<input value="'+esc(row.doctor)+'" onchange="updateGsDoctor('+i+',\'doctor\',this.value)" placeholder="ドクター名" style="border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;"/>'
      + '<input value="'+esc(row.count)+'" onchange="updateGsDoctor('+i+',\'count\',this.value)" type="number" min="0" step="1" placeholder="件数" style="border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;"/>'
      + '<button class="btn btn-danger" onclick="removeGsDoctorRow('+i+')" style="padding:4px 8px;font-size:11px;">✕</button>'
      + '</div>';
  }).join('');
}
function addGsDoctorRow() {
  var diary = getDiary(selectedDate);
  saveDiaryQuiet();
  if (!diary.gsDoctors) diary.gsDoctors = [];
  diary.gsDoctors.push({doctor:'', count:''});
  renderDiary();
}
function removeGsDoctorRow(i) {
  var diary = getDiary(selectedDate);
  saveDiaryQuiet();
  diary.gsDoctors.splice(i,1);
  renderDiary();
}
function updateGsDoctor(i, key, val) {
  var diary = getDiary(selectedDate);
  if (diary.gsDoctors && diary.gsDoctors[i]) diary.gsDoctors[i][key] = val;
}

function countNurses(workers) {
  // 看護師人数（保健師・看護助手はカウント外）
  return workers.filter(function(name){
    var m = STAFF_MEMBERS.find(function(x){return x.name===name;});
    return m && m.role==='看護師';
  }).length;
}

function toggleDiaryWorker(name) {
  var diary = getDiary(selectedDate);
  var idx = diary.workers.indexOf(name);
  if (idx>=0) diary.workers.splice(idx,1);
  else diary.workers.push(name);
  saveLocal();
  renderDiary();
}

// 勤務表のその日の出勤者を取得（出勤＝日勤/早番/夜勤/半休系/D）
function getShiftWorkers(date) {
  var d = new Date(date), y = d.getFullYear(), m = d.getMonth();
  var workingTypes = ['日勤','早番','夜勤','半休','半AM','半PM','D'];
  return STAFF_MEMBERS.filter(function(s){
    return workingTypes.indexOf(getShift(y, m, s.name, date)) >= 0;
  }).map(function(s){ return s.name; });
}
// 勤務表 → 日誌の勤務者へ反映
function fillWorkersFromShift() {
  var d = new Date(selectedDate), ym = ymKey(d.getFullYear(), d.getMonth());
  if (!shiftData[ym] || Object.keys(shiftData[ym]).length===0) {
    alert((d.getMonth()+1)+'月の勤務表がまだ作成されていません。\n先に勤務表タブで作成してください。');
    return;
  }
  var diary = getDiary(selectedDate);
  diary.workers = getShiftWorkers(selectedDate);
  // 勤務表メモのA/B/C/F/診コードを担当欄へ反映
  var codeMap = {A:[], B:[], C:[], F:[], '診':[]};
  var yy = d.getFullYear(), mm = d.getMonth();
  STAFF_MEMBERS.forEach(function(mem){
    var mv = getStaffMemo(yy, mm, mem.name, selectedDate);
    var pv = parseStaffMemoCode(mv);
    if (pv.code && codeMap[pv.code]) codeMap[pv.code].push(mem.name);
  });
  diary.tantoA = codeMap.A.join('、');
  diary.tantoB = codeMap.B.join('、');
  diary.tantoC = codeMap.C.join('、');
  diary.tantoF = codeMap.F.join('、');
  diary.tantoShinCount = codeMap['診'].join('、');
  saveLocal();
  renderDiary();
  var codeCnt = codeMap.A.length+codeMap.B.length+codeMap.C.length+codeMap.F.length+codeMap['診'].length;
  setSyncBadge('ok', '✓ 勤務表から反映しました（勤務者'+diary.workers.length+'名／担当'+codeCnt+'名）');
}

function collectDiaryFields(diary) {
  function gv(id){ var e=document.getElementById(id); return e?e.value:undefined; }
  // 受付メイン・サブは名簿選択（その他=直接入力）のため staffVal で取得
  if (document.getElementById('dr-receptMain')) diary.receptMain = staffVal('dr-receptMain');
  if (document.getElementById('dr-receptSub'))  diary.receptSub  = staffVal('dr-receptSub');
  var fields = ['monshinCount','dockTotal','dockKenpo','dockKeisatsu',
    'dockSeikan','dockHotei','dockTokutei','gsTotal','gsOral','gsNasal','mdl','mr','mrVsrad','mrVsradDr',
    'csMonshin','laterExam','pmTotal','pmDr','pmSeikan','pmHotei','pmTokutei','pmFuka',
    'tantoA','tantoB','tantoC','tantoACount','tantoBCount','tantoCCount','tantoTotal','tantoShinCount','tantoF',
    'special','trouble','notice','author'];
  fields.forEach(function(f){
    var v = gv('dr-'+f);
    if (v !== undefined) diary[f] = v;
  });
}

function saveDiary() {
  var date = selectedDate;
  var diary = getDiary(date);
  collectDiaryFields(diary);
  diary.updatedAt = nowStr();
  diaryData[date] = diary;
  saveLocal();
  sbUpsertDiary(date, diary);
  renderDiary();
  setSyncBadge('ok', '✓ 健診センター日誌を保存しました');
}

// スタッフ共有メモ（Phase 3）
// 看護日誌とは別管理・日誌/PDFには含めない
// ═══════════════════════════════════════════
var MEMO_CATEGORIES = [
  {key:'配慮事項', color:'#7C3AED', bg:'#F3E8FF'},
  {key:'申し送り', color:'#0369A1', bg:'#E0F2FE'},
  {key:'当日注意点', color:'#B45309', bg:'#FEF3C7'},
  {key:'その他', color:'#475569', bg:'#F1F5F9'}
];

function purgeExpiredMemos() {
  // 削除期限が過ぎたメモを自動削除
  var today = todayStr();
  var removed = [];
  staffMemos = staffMemos.filter(function(m){
    if (!m.expireDate) return true;  // 期限なしは残す
    if (m.expireDate >= today) return true;
    removed.push(m.id);
    return false;
  });
  if (removed.length) {
    saveLocal();
    if (SB_READY) removed.forEach(function(id){ sbDeleteMemo(id); });
  }
}

function renderMemo() {
  var el = document.getElementById('tab-memo-content');
  if (!el) return;
  purgeExpiredMemos();

  // カテゴリ選択肢
  var catOpts = MEMO_CATEGORIES.map(function(c){
    return '<option value="'+c.key+'">'+c.key+'</option>';
  }).join('');

  // メモ一覧（新しい順）
  var sorted = staffMemos.slice().sort(function(a,b){
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });

  var listHTML = sorted.length === 0

function setMemoExpire(days) {
  var el = document.getElementById('memo-expire');

  d.setDate(d.getDate() + days);
  el.value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function addMemo() {
  function gv(id){ var e=document.getElementById(id); return e?e.value:''; }
  var text = gv('memo-text').trim();
  if (!text) { alert('内容を入力してください'); return; }
  var newMemo = {
    id: uid(),

  };

function deleteMemo(id) {
  if (!confirm('このメモを削除しますか？')) return;
  staffMemos = staffMemos.filter(function(m){return m.id !== id;});
  saveLocal();
  if (SB_READY) sbDeleteMemo(id);
  renderMemo();
}

// ═══════════════════════════════════════════
// 勤務表作成（Phase 4）
// 手動配置 + 条件チェック方式
// ═══════════════════════════════════════════
var SHIFT_TYPES = [
  {key:'日勤', short:'〇', color:'#1e293b', bg:'#fff'},
  {key:'早番', short:'早', color:'#0369A1', bg:'#E0F2FE'},
  {key:'公休', short:'休', color:'#DC2626', bg:'#FEE2E2'},
  {key:'フリー', short:'フ', color:'#B45309', bg:'#FEF3C7'},
  {key:'年休', short:'年', color:'#0D9488', bg:'#CCFBF1'},
  {key:'半休', short:'半', color:'#0891B2', bg:'#CFFAFE'},
  {key:'半AM', short:'〇/×', color:'#0891B2', bg:'#CFFAFE'},
  {key:'半PM', short:'×/〇', color:'#0891B2', bg:'#CFFAFE'},
  {key:'出張', short:'出', color:'#15803D', bg:'#DCFCE7'},
  {key:'D', short:'D', color:'#BE185D', bg:'#FCE7F3'},
  {key:'希望休', short:'希', color:'#DC2626', bg:'#FEF9C3'},
  {key:'夜勤', short:'夜', color:'#7C3AED', bg:'#F3E8FF'},
  {key:'明け', short:'明', color:'#9333EA', bg:'#FAF5FF'},
  {key:'', short:'', color:'#cbd5e1', bg:'#fff'}  // 未設定
];

// クリックで切り替わる順番（ご要望の順）：日勤→早番→公休→フリー→年休→半休→半AM→半PM→出張→D→希望休→夜勤→明け
var SHIFT_CYCLE = ['','日勤','早番','公休','フリー','年休','半休','半AM','半PM','出張','D','希望休','夜勤','明け'];

function shiftKey(name, dateStr) { return name + '|' + dateStr; }
function ymKey(y, m) { return y + '-' + pad(m+1); }

function getShift(y, m, name, dateStr) {
  var ym = ymKey(y, m);
  if (!shiftData[ym]) shiftData[ym] = {};
  return shiftData[ym][shiftKey(name, dateStr)] || '';
}
function setShift(y, m, name, dateStr, val) {
  var ym = ymKey(y, m);
  if (!shiftData[ym]) shiftData[ym] = {};
  if (val) shiftData[ym][shiftKey(name, dateStr)] = val;
  else delete shiftData[ym][shiftKey(name, dateStr)];
  queueShiftSync('cell', ym, name, dateStr, val || '');
}

// ── 夜勤は「夜→明→休」の3日1セット ──
// 日付文字列(YYYY-MM-DD)をn日進める（ローカル時刻で計算）
function shiftDateStr(dateStr, n) {
  var p = dateStr.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
// 日付が属する年月のバケットへ設定/取得（月またぎ対応）
function setShiftByDate(name, dateStr, val) {
  var p = dateStr.split('-');
  setShift(parseInt(p[0],10), parseInt(p[1],10)-1, name, dateStr, val);
}
function getShiftByDate(name, dateStr) {
  var p = dateStr.split('-');
  return getShift(parseInt(p[0],10), parseInt(p[1],10)-1, name, dateStr);
}
// 夜勤セット（夜→明→休）を配置
function placeNightSet(name, dateStr) {
  setShiftByDate(name, dateStr, '夜勤');
  setShiftByDate(name, shiftDateStr(dateStr, 1), '明け');
  setShiftByDate(name, shiftDateStr(dateStr, 2), '公休');
}
// 夜勤を外すとき、その後続の明・休（セット由来）も解除
function clearNightTrailing(name, dateStr) {
  var d1 = shiftDateStr(dateStr, 1), d2 = shiftDateStr(dateStr, 2);
  if (getShiftByDate(name, d1) === '明け') setShiftByDate(name, d1, '');
  if (getShiftByDate(name, d2) === '公休') setShiftByDate(name, d2, '');
}
function getWish(y, m, name, dateStr) {
  var ym = ymKey(y, m);
  return !!(shiftWishes[ym] && shiftWishes[ym][shiftKey(name, dateStr)]);
}
function toggleWish(y, m, name, dateStr) {
  var ym = ymKey(y, m);
  if (!shiftWishes[ym]) shiftWishes[ym] = {};
  var k = shiftKey(name, dateStr);
  if (shiftWishes[ym][k]) delete shiftWishes[ym][k];
  else shiftWishes[ym][k] = true;
  queueShiftSync('wish', ym, name, dateStr, shiftWishes[ym][k] ? true : '');
}

// 祝日（簡易版・主要な固定祝日 + 年末年始）
function isHolidayOrSunday(dateStr) {
  var d = new Date(dateStr);
  if (d.getDay() === 0) return true;  // 日曜
  var md = pad(d.getMonth()+1) + '-' + pad(d.getDate());
  // 年末年始
  if (md >= '12-29' || md <= '01-03') return true;
  // 主要固定祝日（簡易）
  var fixed = ['01-01','02-11','02-23','04-29','05-03','05-04','05-05','08-11','11-03','11-23'];
  return fixed.indexOf(md) >= 0;
}

// 条件チェック → 各日付の違反リストを返す
function checkShiftRules(y, m, days) {
  var violations = {};  // dateStr -> [メッセージ]
  var ym = ymKey(y, m);

  days.forEach(function(dateStr){
    if (isHolidayOrSunday(dateStr)) return;  // 休診日はチェック対象外
    var msgs = [];
    // その日の各人の勤務を取得
    var dayShifts = STAFF_MEMBERS.map(function(mem){
      return {member:mem, shift:getShift(y, m, mem.name, dateStr)};
    });

    // ① 看護師人数 6〜7名（日勤+早番+夜勤=出勤、保健師・看護助手カウント外）
    var nurseWorking = dayShifts.filter(function(s){
      return s.member.role==='看護師' && (s.shift==='日勤'||s.shift==='早番'||s.shift==='夜勤');
    }).length;
    if (nurseWorking < 6) msgs.push('看護師'+nurseWorking+'名（6名未満）');
    if (nurseWorking > 7) msgs.push('看護師'+nurseWorking+'名（7名超過）');

    // ② 管理者どちらか日勤
    var adminDay = dayShifts.some(function(s){
      return s.member.admin && (s.shift==='日勤'||s.shift==='早番'||s.shift==='夜勤');
    });
    if (!adminDay) msgs.push('管理者の出勤なし');

    // ③ 保健師どちらか1名出勤
    var hokenWorking = dayShifts.filter(function(s){
      return s.member.role==='保健師' && (s.shift==='日勤'||s.shift==='早番'||s.shift==='夜勤');
    }).length;
    if (hokenWorking < 1) msgs.push('保健師の出勤なし');

    // ④ 早番が毎日必要
    var hasEarly = dayShifts.some(function(s){return s.shift==='早番';});
    if (!hasEarly) msgs.push('早番なし');

    // ⑤ 早番が土曜のみの人（SHIFT_RULESで設定）
    var konoEarly = SHIFT_RULES.satOnlyEarlyMember ? dayShifts.find(function(s){return s.member.name===SHIFT_RULES.satOnlyEarlyMember&&s.shift==='早番';}) : null;
    if (konoEarly && new Date(dateStr).getDay() !== 6) msgs.push('河野の早番は土曜のみ');

    // 早番に入れない人（SHIFT_RULESで設定）
    var takaEarly = dayShifts.find(function(s){return SHIFT_RULES.noEarlyMembers.indexOf(s.member.name)>=0 && s.shift==='早番';});
    if (takaEarly) msgs.push(takaEarly.member.name+'は早番なし');

    // ⑥ 夜勤は指定担当者のみ・土or日祝（SHIFT_RULESで設定）
    dayShifts.forEach(function(s){
      if (s.shift==='夜勤') {
        if (ruleNightMember() && s.member.name!==ruleNightMember()) msgs.push(s.member.name+'の夜勤（夜勤は'+ruleNightMember()+'のみ）');
        else {
          var dow = new Date(dateStr).getDay();
          if (dow!==6 && dow!==0 && !isHolidayOrSunday(dateStr)) msgs.push(s.member.name+'の夜勤は土or日祝');
        }
      }
    });

    if (msgs.length>0) violations[dateStr] = msgs;
  });

  // ⑥ 夜勤担当者の夜勤は月2回（SHIFT_RULESで設定）
  var takahashiNights = 0;
  days.forEach(function(dateStr){
    if (ruleNightMember() && getShift(y, m, ruleNightMember(), dateStr)==='夜勤') takahashiNights++;
  });
  var monthMsgs = [];
  if (takahashiNights !== 2 && takahashiNights > 0) monthMsgs.push(ruleNightMember()+'の夜勤: '+takahashiNights+'回（月2回が基準）');

  // ⑦ 各人の公休+フリー（希望休含む）が月10日
  var staffDayOff = {};
  STAFF_MEMBERS.forEach(function(mem){
    var cnt = 0;
    days.forEach(function(dateStr){
      var sh = getShift(y, m, mem.name, dateStr);
      var wish = getWish(y, m, mem.name, dateStr);
      // 公休・フリー・希望休はカウント。希望休（右クリック）で未配置の日もカウント。空欄はカウントしない
      if (sh==='公休'||sh==='フリー'||sh==='希望休') cnt++;
      else if (wish && !sh) cnt++;
    });
    staffDayOff[mem.name] = cnt;
  });

  return {daily:violations, month:monthMsgs, takahashiNights:takahashiNights, staffDayOff:staffDayOff};
}

function renderShift() {
  var el = document.getElementById('tab-shift-content');
  if (!el) return;
  if (!shiftYear) { shiftYear = currentYear; shiftMonth = currentMonth; }
  var y = shiftYear, m = shiftMonth;

  // その月の日付リスト
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var days = [];
  for (var d=1; d<=daysInMonth; d++) days.push(y+'-'+pad(m+1)+'-'+pad(d));

  var check = checkShiftRules(y, m, days);

  // ヘッダー行（日付）
  var headCells = '<th class="sh-name-col">スタッフ</th>';
  days.forEach(function(dateStr){
    var d = new Date(dateStr);
    var dow = d.getDay();
    var holiday = isHolidayOrSunday(dateStr);
    var dowName = DOW[dow];
    var cls = 'sh-day-head' + (holiday?' sh-holiday':'') + (dow===6?' sh-sat':'');
    var vio = check.daily[dateStr] ? ' sh-vio-head' : '';
    headCells += '<th class="'+cls+vio+'" title="'+(check.daily[dateStr]?check.daily[dateStr].join('\n'):'')+'">'
      + d.getDate() + '<br><span style="font-size:9px;">'+dowName+'</span>'
      + (check.daily[dateStr]?'<br><span style="color:#DC2626;font-size:9px;">⚠</span>':'')
      + '</th>';
  });
  // 集計列ヘッダー（休/フ/年/早/日）
  headCells += '<th class="sh-sum-head">休</th><th class="sh-sum-head">フ</th><th class="sh-sum-head">年</th><th class="sh-sum-head">早</th><th class="sh-sum-head">日</th>';

  // スタッフ行
  var dayTotals = {};  // dateStr -> 日勤人数（看護師）
  days.forEach(function(ds){ dayTotals[ds] = 0; });

  var rows = STAFF_MEMBERS.map(function(mem){
    var roleTag = mem.role!=='看護師' ? '<span style="font-size:9px;color:#7C3AED;">('+mem.role.charAt(0)+')</span>' : (mem.admin?'<span style="font-size:9px;color:#0369A1;">(管)</span>':'');
    var dayOff = check.staffDayOff[mem.name];
    var offClass = dayOff===10 ? 'color:#15803D;' : 'color:#DC2626;';
    var cells = '<td class="sh-name-col">'+mem.name+' '+roleTag+'<br><span style="font-size:9px;'+offClass+'">休F:'+dayOff+'/10</span></td>';
    // 各区分カウント
    var cnt = {公休:0, フリー:0, 年休:0, 早番:0, 日勤:0};
    days.forEach(function(dateStr){
      var sh = getShift(y, m, mem.name, dateStr);
      var wish = getWish(y, m, mem.name, dateStr);
      var st = SHIFT_TYPES.find(function(t){return t.key===sh;}) || SHIFT_TYPES[SHIFT_TYPES.length-1];
      var holiday = isHolidayOrSunday(dateStr);
      // 空欄は本当の空欄として表示する（削除＝空白。休は明示配置または自動生成時のみ）
      var emptyOff = false;
      var offType = SHIFT_TYPES.find(function(t){return t.key==='公休';});
      var dispType = emptyOff ? offType : st;
      var bg = wish ? '#FEF9C3' : dispType.bg;
      var fg = wish ? '#DC2626' : dispType.color;
      var cellStyle = 'background:'+bg+';color:'+fg+';';
      if (wish) cellStyle += 'border:1.5px solid #F59E0B;';
      if (holiday) cellStyle += 'opacity:0.5;';
      var label = (wish || emptyOff) ? '休' : st.short;
      // 半AM/半PM の〇/×表記は小さく表示
      if (sh==='半AM'||sh==='半PM') label = '<span class="sh-half">'+st.short+'</span>';
      cells += '<td class="sh-cell" style="'+cellStyle+'" '
        + 'onclick="cycleShift(event,\''+mem.name+'\',\''+dateStr+'\')" '
        + 'oncontextmenu="toggleShiftWish(event,\''+mem.name+'\',\''+dateStr+'\')" '
        + 'title="'+mem.name+' '+dateStr+(wish?' [希望休]':'')+' / Shift+クリックで削除">'
        + label
        + '</td>';
      // カウント集計（空欄は集計しない。明示配置と希望休のみ）
      var effective = wish ? '公休' : (sh ? sh : '');
      if (cnt[effective] !== undefined) cnt[effective]++;
      // 日勤合計（看護師の日勤・早番を出勤としてカウント）
      if (mem.role==='看護師' && (sh==='日勤'||sh==='早番')) dayTotals[dateStr]++;
    });
    // 集計セル（休/フ/年/早/日）
    cells += '<td class="sh-sum">'+cnt.公休+'</td>'
      + '<td class="sh-sum">'+cnt.フリー+'</td>'
      + '<td class="sh-sum">'+cnt.年休+'</td>'
      + '<td class="sh-sum">'+cnt.早番+'</td>'
      + '<td class="sh-sum">'+cnt.日勤+'</td>';
    // スタッフ別メモ行（勤務の下に一行、クリックで記入）
    var memoRow = '';
    if (shiftShowMemoRows) {
      var mCells = '<td class="sh-name-col" style="font-size:9px;color:#94a3b8;background:#FFFDF5;">└ メモ</td>';
      days.forEach(function(dateStr){
        var mv = getStaffMemo(y, m, mem.name, dateStr);
        var pv = parseStaffMemoCode(mv);
        var holiday = isHolidayOrSunday(dateStr);
        var disp = (pv.code?'<span style="font-weight:700;color:#1D4ED8;font-size:12px;">'+pv.code+'</span>':'')
          + (pv.code&&pv.rest?' ':'') + (pv.rest||'');
        mCells += '<td class="sh-cell" style="background:'+(mv?'#FEF9C3':'#FFFDF5')+';font-size:8px;color:#92400E;cursor:pointer;overflow:hidden;white-space:nowrap;'+(holiday?'opacity:0.5;':'')+'" '
          + 'onclick="editStaffMemo(\''+mem.name+'\',\''+dateStr+'\')" '
          + 'title="'+mem.name+' '+dateStr+' メモ'+(mv?': '+mv.replace(/"/g,'&quot;'):'（クリックで記入）')+'">'
          + disp
          + '</td>';
      });
      mCells += '<td class="sh-sum" colspan="5" style="background:#FFFDF5;"></td>';
      memoRow = '<tr>'+mCells+'</tr>';
    }
    return '<tr>'+cells+'</tr>'+memoRow;
  }).join('');

  // 集計行（日ごとの看護師日勤+早番の合計）
  var totalRow = '<td class="sh-name-col" style="font-weight:700;">日勤計（看護師）</td>';
  days.forEach(function(dateStr){
    var n = dayTotals[dateStr];
    var holiday = isHolidayOrSunday(dateStr);
    var warn = (!holiday && (n<6||n>7)) ? 'color:#DC2626;font-weight:700;' : 'color:#1e293b;';
    totalRow += '<td class="sh-cell" style="background:#F8FAFC;'+(holiday?'opacity:0.4;':'')+warn+'">'+(holiday?'-':n)+'</td>';
  });
  totalRow += '<td class="sh-sum" colspan="5" style="background:#F8FAFC;"></td>';
  rows += '<tr>'+totalRow+'</tr>';

  // 月違反サマリー
  var monthVioHTML = check.month.length>0
    ? '<div style="background:#FEE2E2;border:1px solid #FCA5A5;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:#DC2626;">⚠ '+check.month.join(' / ')+'</div>'
    : '';

  el.innerHTML =
    '<div class="card"><div class="card-head">'
    + '<div style="display:flex;align-items:center;gap:8px;">'
    + '<button class="btn" onclick="shiftPrevMonth()" style="padding:4px 10px;">◀</button>'
    + '<span style="font-weight:600;font-size:15px;">'+y+'年 '+(m+1)+'月 勤務表</span>'
    + '<button class="btn" onclick="shiftNextMonth()" style="padding:4px 10px;">▶</button>'
    + '</div>'
    + '<div style="display:flex;gap:5px;flex-wrap:wrap;">'
    + '<button class="btn btn-primary" onclick="autoGenerateShift()" style="font-size:11px;">⚙️ 自動生成</button>'
    + '<button class="btn" onclick="toggleShiftMemoRows()" style="font-size:11px;">📝 メモ行 '+(shiftShowMemoRows?'非表示':'表示')+'</button>'
    + '<button class="btn" onclick="openCommitteeModal()" style="font-size:11px;">📋 委員会予定</button>'
    + '<button class="btn" onclick="printShiftTable()" style="font-size:11px;">🖨️ 印刷</button>'
    + '<button class="btn btn-danger" onclick="clearShift()" style="font-size:11px;">🗑 全削除</button>'
    + '</div></div>'
    + '<div class="card-body">'
    // 凡例
    + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:11px;align-items:center;">'
    + '<span style="color:#64748b;">クリックで勤務切替 / 右クリックで希望休 / Shift+クリックで削除</span>'
    + SHIFT_TYPES.filter(function(t){return t.key;}).map(function(t){
        return '<span style="display:inline-flex;align-items:center;gap:3px;"><span style="display:inline-block;width:16px;height:16px;border-radius:3px;background:'+t.bg+';border:1px solid #cbd5e1;text-align:center;line-height:16px;color:'+t.color+';font-size:10px;font-weight:700;">'+t.short+'</span>'+t.key+'</span>';
      }).join('')
    + '<span style="display:inline-flex;align-items:center;gap:3px;"><span style="display:inline-block;width:16px;height:16px;border-radius:3px;background:#FEF9C3;border:1.5px solid #F59E0B;text-align:center;line-height:14px;color:#DC2626;font-size:10px;font-weight:700;">休</span>希望休</span>'
    + '</div>'
    + monthVioHTML
    // 勤務表
    + '<div style="overflow-x:auto;max-width:100%;"><table class="sh-table"><thead><tr>'+headCells+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    // 委員会予定（表の下）
    + renderCommitteeList(y, m)
    + '</div></div>';
}

function cycleShift(event, name, dateStr) {
  var y = shiftYear, m = shiftMonth;
  // Shift+クリックで削除（夜勤なら夜→明→休をまとめて削除）
  if (event && event.shiftKey) {
    if (getShift(y, m, name, dateStr) === '夜勤') clearNightTrailing(name, dateStr);
    setShift(y, m, name, dateStr, '');
    saveLocal();
    renderShift();
    return;
  }
  var cur = getShift(y, m, name, dateStr);
  var order = SHIFT_CYCLE;
  var idx = order.indexOf(cur);
  var next = order[(idx+1) % order.length];
  // 夜勤を外す（別の勤務に変える）ときは、後続の明・休も解除
  if (cur === '夜勤' && next !== '夜勤') clearNightTrailing(name, dateStr);
  if (next === '夜勤') {
    placeNightSet(name, dateStr);   // 夜→明→休を1セットで配置
  } else {
    setShift(y, m, name, dateStr, next);
  }
  saveLocal();
  renderShift();
}

function toggleShiftWish(event, name, dateStr) {
  event.preventDefault();
  toggleWish(shiftYear, shiftMonth, name, dateStr);
  saveLocal();
  renderShift();
  return false;
}

function shiftPrevMonth() {
  shiftMonth--;
  if (shiftMonth<0) { shiftMonth=11; shiftYear--; }
  renderShift();
}
function shiftNextMonth() {
  shiftMonth++;
  if (shiftMonth>11) { shiftMonth=0; shiftYear++; }
  renderShift();
}
function clearShift() {
  if (!confirm(shiftYear+'年'+(shiftMonth+1)+'月の勤務表をすべて削除しますか？'+(SHIFT_SYNC_READY?'\n（全PCから削除されます）':''))) return;
  var ym = ymKey(shiftYear, shiftMonth);
  shiftData[ym] = {};
  shiftWishes[ym] = {};
  sbClearShiftMonth(ym);
  saveLocal();
  renderShift();
}

// ── 自動生成 ──
function autoGenerateShift() {
  if (!confirm(shiftYear+'年'+(shiftMonth+1)+'月の勤務表を自動生成しますか？\n（希望休は尊重されます。既存の配置は上書きされます）')) return;
  var y = shiftYear, m = shiftMonth;
  var ym = ymKey(y, m);
  shiftData[ym] = {};

  var daysInMonth = new Date(y, m+1, 0).getDate();
  var days = [];
  for (var d=1; d<=daysInMonth; d++) days.push(y+'-'+pad(m+1)+'-'+pad(d));
  var workdays = days.filter(function(ds){ return !isHolidayOrSunday(ds); });
  var closedCount = days.length - workdays.length;

  var nurses   = STAFF_MEMBERS.filter(function(s){return s.role==='看護師';});
  var hokenshi = STAFF_MEMBERS.filter(function(s){return s.role==='保健師';});
  var helpers  = STAFF_MEMBERS.filter(function(s){return s.role==='看護助手';});
  var admins   = STAFF_MEMBERS.filter(function(s){return s.admin;});

  var TOTAL_OFF = 10, FREE_TARGET = 2, MIN_NURSE = 6, MAX_NURSE = 7;
  function setS(n, ds, v){ shiftData[ym][shiftKey(n, ds)] = v; }
  function getS(n, ds){ return shiftData[ym][shiftKey(n, ds)] || ''; }
  function monthOff(name){ var c=0; days.forEach(function(ds){var v=getS(name,ds); if(v==='公休'||v==='フリー')c++;}); return c; }

  // 1) 初期化：休診日=公休 / 希望休=公休 / それ以外=空
  days.forEach(function(ds){
    var holiday = isHolidayOrSunday(ds);
    STAFF_MEMBERS.forEach(function(s){
      if (getWish(y, m, s.name, ds)) setS(s.name, ds, '公休');
      else if (holiday) setS(s.name, ds, '公休');
      else setS(s.name, ds, '');
    });
  });

  // 2) 夜勤セット（夜→明→休）月2回・間隔10日以上・土日祝始まり（SHIFT_RULESで担当者を設定）
  var nightM = ruleNightMember();
  var lastIdx = -99, placed = 0;
  for (var di=0; di<days.length-2 && placed<2; di++) {
    var ds0 = days[di], dow0 = new Date(ds0).getDay();
    if (nightM && (dow0===6 || isHolidayOrSunday(ds0)) && !getWish(y,m,nightM,ds0) && (di-lastIdx)>=10) {
      setS(nightM, days[di],   '夜勤');
      if (days[di+1]) setS(nightM, days[di+1], '明け');
      if (days[di+2]) setS(nightM, days[di+2], '公休');
      lastIdx = di; placed++;
    }
  }

  // 3) 各人へ平日休を均等配置（目標 公休+フリー=10、うちフリー2／人ごとに位相をずらして分散）
  STAFF_MEMBERS.forEach(function(s, si){
    var already = 0;
    days.forEach(function(ds){ var v=getS(s.name,ds); if(v==='公休'||v==='フリー')already++; });
    var need = Math.max(0, TOTAL_OFF - already);
    var avail = workdays.filter(function(ds){ return getS(s.name,ds)===''; });
    if (need > avail.length) need = avail.length;
    var chosen = [];
    if (need > 0) {
      var used = {};
      for (var k=0; k<need; k++) {
        var base = Math.floor((k+0.5)*avail.length/need);
        var pos = (base + si) % avail.length;   // 人ごとに位相シフトして全体で分散
        var g2 = 0;
        while (used[pos] && g2++ < avail.length) pos = (pos+1) % avail.length;
        used[pos] = true; chosen.push(avail[pos]);
      }
    }
    // フリーを2つ（広めに分散）
    var freeN = Math.min(FREE_TARGET, chosen.length), freeSet = {};
    for (var f=0; f<freeN; f++) { var p = Math.floor((f+0.5)*chosen.length/freeN); freeSet[chosen[p]] = true; }
    chosen.forEach(function(ds){ setS(s.name, ds, freeSet[ds] ? 'フリー' : '公休'); });
  });

  // 4) 出勤割り当て（日勤優先）
  var earlyCount = {}; STAFF_MEMBERS.forEach(function(s){ earlyCount[s.name]=0; });
  workdays.forEach(function(ds){
    var dow = new Date(ds).getDay();
    // 看護助手 → 日勤
    helpers.forEach(function(s){ if (getS(s.name,ds)==='') setS(s.name, ds, '日勤'); });
    // 保健師 最低1名出勤
    if (!hokenshi.some(function(s){ return getS(s.name,ds)==='日勤'; })) {
      var ah = hokenshi.filter(function(s){ return getS(s.name,ds)===''; });
      if (ah.length) setS(ah[new Date(ds).getDate()%ah.length].name, ds, '日勤');
    }
    // 早番1名（SHIFT_RULESの設定に従う）
    if (!STAFF_MEMBERS.some(function(s){ return getS(s.name,ds)==='早番'; })) {
      var cand = nurses.filter(function(s){
        if (getS(s.name,ds)!=='') return false;
        if (SHIFT_RULES.noEarlyMembers.indexOf(s.name)>=0) return false;
        if (SHIFT_RULES.satOnlyEarlyMember && s.name===SHIFT_RULES.satOnlyEarlyMember && dow!==6) return false;
        return true;
      });
      if (dow===6 && SHIFT_RULES.satOnlyEarlyMember) { var kono = cand.find(function(s){return s.name===SHIFT_RULES.satOnlyEarlyMember;}); if (kono) cand = [kono].concat(cand.filter(function(s){return s.name!==SHIFT_RULES.satOnlyEarlyMember;})); }
      cand.sort(function(a,b){ return earlyCount[a.name]-earlyCount[b.name]; });
      if (cand.length) { setS(cand[0].name, ds, '早番'); earlyCount[cand[0].name]++; }
    }
    // 管理者 最低1名出勤
    if (!admins.some(function(s){ var v=getS(s.name,ds); return v==='日勤'||v==='早番'||v==='夜勤'||v==='明け'; })) {
      var aa = admins.filter(function(s){ return getS(s.name,ds)===''; });
      if (aa.length) setS(aa[0].name, ds, '日勤');
    }
    // 残りの看護師 → 日勤
    nurses.forEach(function(s){ if (getS(s.name,ds)==='') setS(s.name, ds, '日勤'); });
  });

  // 5) 日勤優先の人数調整（看護師6〜7名を維持）
  workdays.forEach(function(ds){
    function nurseWorking(){ return nurses.filter(function(s){ var v=getS(s.name,ds); return v==='日勤'||v==='早番'||v==='夜勤'; }).length; }
    var guard = 0;
    while (nurseWorking() < MIN_NURSE && guard++ < 20) {
      // 公休を優先的に崩し、足りなければフリーも出勤に回す（希望休・夜勤明け・夜勤明けの翌休は触らない）
      var offNurses = nurses.filter(function(s){
        var v = getS(s.name,ds);
        if (v!=='公休' && v!=='フリー') return false;
        if (getWish(y,m,s.name,ds)) return false;
        // 夜勤セットの休（前日が「明け」の公休）は崩さない＝夜→明→休を1セットで維持
        if (v==='公休' && getShiftByDate(s.name, shiftDateStr(ds,-1))==='明け') return false;
        return true;
      });
      if (!offNurses.length) break;
      offNurses.sort(function(a,b){
        var pa = getS(a.name,ds)==='公休'?0:1, pb = getS(b.name,ds)==='公休'?0:1;
        if (pa!==pb) return pa-pb;
        return monthOff(b.name)-monthOff(a.name);
      });
      setS(offNurses[0].name, ds, '日勤');
    }
  });

  // 6) 残った空欄は公休（休）として確定（＝空欄→休の変換は自動生成時のみ実行）
  days.forEach(function(ds){
    STAFF_MEMBERS.forEach(function(s){
      if (getS(s.name, ds) === '') setS(s.name, ds, '公休');
    });
  });

  saveLocal();
  renderShift();
  setSyncBadge('ok', '✓ 勤務表を自動生成しました（条件違反は赤で確認してください）');
}
// ── 委員会予定 ──
// 定例委員会（曜日ベース）を計算
function getFixedCommittees(y, m) {
  // 第n週の指定曜日の日付を返す
  function nthWeekday(week, weekday) {
    var count = 0;
    var daysInMonth = new Date(y, m+1, 0).getDate();
    for (var d=1; d<=daysInMonth; d++) {
      var dt = new Date(y, m, d);
      if (dt.getDay() === weekday) {
        count++;
        if (count === week) return y+'-'+pad(m+1)+'-'+pad(d);
      }
    }
    return null;
  }
  // 編集可能な定例ルールから日付を算出
  var items = fixedCommitteeRules.map(function(r){
    return {date:nthWeekday(r.week, r.weekday), title:r.title};
  });
  return items.filter(function(c){return c.date;});
}

function renderCommitteeList(y, m) {
  var ym = ymKey(y, m);
  var fixed = getFixedCommittees(y, m);
  var manual = shiftCommittees[ym] || [];
  var all = fixed.concat(manual.map(function(c){return {date:c.date, title:c.title, name:c.name, manual:true};}));
  // 日付順にソート
  all.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  return '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">'
    + '<strong style="color:#1D4ED8;">📋 委員会・会議予定（'+(m+1)+'月）</strong>'
    + '<button class="btn btn-primary" onclick="openCommitteeModal()" style="font-size:11px;padding:4px 10px;">＋ 委員会・ミーティングを追加</button>'
    + '</div>'
    + '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;">'
    + (all.length===0 ? '<span style="color:#94a3b8;">予定はありません</span>' : all.map(function(c){
        var dd = c.date ? parseInt(c.date.slice(8)) : '';
        var dow = c.date ? DOW[new Date(c.date).getDay()] : '';
        return '<span style="background:#fff;border:1px solid #BFDBFE;border-radius:6px;padding:4px 10px;">'
          + '<strong>'+dd+'日('+dow+')</strong> '+esc(c.title)+(c.name?' <span style="color:#64748b;">'+esc(c.name)+'</span>':'')
          + (c.manual?'':' <span style="font-size:9px;color:#94a3b8;">定例</span>')
          + '</span>';
      }).join(''))
    + '</div></div>';
}

function openCommitteeModal() {
  var ym = ymKey(shiftYear, shiftMonth);
  var list = shiftCommittees[ym] || [];

  // 定例委員会（編集可能）
  var weekOpts = function(sel){ var h=''; for(var w=1;w<=5;w++){ h+='<option value="'+w+'"'+(w===sel?' selected':'')+'>第'+w+'</option>'; } return h; };
  var dowOpts  = function(sel){ var h=''; for(var d=0;d<=6;d++){ h+='<option value="'+d+'"'+(d===sel?' selected':'')+'>'+DOW[d]+'</option>'; } return h; };
  var fixedRows = fixedCommitteeRules.map(function(r, i){
    return '<div style="display:grid;grid-template-columns:64px 64px 1fr 36px;gap:6px;margin-bottom:6px;align-items:center;">'
      + '<select onchange="updateFixedCommittee('+i+',\'week\',this.value)" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 6px;font-size:12px;">'+weekOpts(r.week)+'</select>'
      + '<select onchange="updateFixedCommittee('+i+',\'weekday\',this.value)" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 6px;font-size:12px;">'+dowOpts(r.weekday)+'</select>'
      + '<input value="'+esc(r.title)+'" onchange="updateFixedCommittee('+i+',\'title\',this.value)" placeholder="委員会名" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px;font-size:12px;"/>'
      + '<button class="btn btn-danger" onclick="removeFixedCommittee('+i+')" style="padding:4px 8px;font-size:11px;">✕</button>'
      + '</div>';
  }).join('');

  var rows = list.map(function(c, i){
    return '<div style="display:grid;grid-template-columns:130px 1fr 100px 36px;gap:6px;margin-bottom:6px;align-items:center;">'
      + '<input type="date" value="'+c.date+'" onchange="updateCommittee('+i+',\'date\',this.value)" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px;font-size:12px;"/>'
      + '<input value="'+esc(c.title)+'" onchange="updateCommittee('+i+',\'title\',this.value)" placeholder="委員会名" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px;font-size:12px;"/>'
      + '<input value="'+esc(c.name)+'" onchange="updateCommittee('+i+',\'name\',this.value)" placeholder="担当者" style="border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px;font-size:12px;"/>'
      + '<button class="btn btn-danger" onclick="removeCommittee('+i+')" style="padding:4px 8px;font-size:11px;">✕</button>'
      + '</div>';
  }).join('');
  var html = '<div class="mo" onclick="closeModal(\'committee-modal\')">'
    + '<div class="md" onclick="event.stopPropagation()">'
    + '<div class="md-head"><span>📋 委員会予定 — '+shiftYear+'年'+(shiftMonth+1)+'月</span><button class="btn" onclick="closeModal(\'committee-modal\')" style="padding:2px 8px;">✕</button></div>'
    + '<div class="md-body">'
    // 定例委員会（編集可能）
    + '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">🔁 定例委員会（第n週・曜日で毎月自動表示）</div>'
    + '<div style="background:#F8FAFC;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:6px;">'
    + (fixedRows||'<div style="color:#94a3b8;font-size:12px;padding:4px;">定例の登録はありません</div>')
    + '</div>'
    + '<button class="btn" onclick="addFixedCommittee()" style="font-size:11px;margin-bottom:14px;">＋ 定例を追加</button>'
    // その他ミーティング（日付指定）
    + '<div style="font-weight:600;font-size:13px;margin-bottom:6px;border-top:1px solid #e2e8f0;padding-top:12px;">📌 その他のミーティング等（日付を指定して追加）</div>'
    + '<div id="committee-rows">'+(rows||'<div style="color:#94a3b8;font-size:13px;padding:8px;">追加の予定はありません</div>')+'</div>'
    + '<button class="btn" onclick="addCommittee()" style="font-size:11px;margin-top:8px;">＋ 予定を追加</button></div>'
    + '<div class="md-foot"><button class="btn btn-primary" onclick="closeModal(\'committee-modal\');renderShift();">完了</button></div>'
    + '</div></div>';
  var box = document.getElementById('committee-modal');
  if (!box) { box = document.createElement('div'); box.id='committee-modal'; document.body.appendChild(box); }
  box.innerHTML = html;
}
// 定例委員会の編集
function addFixedCommittee() {
  fixedCommitteeRules.push({week:1, weekday:2, title:''});
  saveLocal();
  sbSaveFixedRules();
  openCommitteeModal();
}
function updateFixedCommittee(i, key, val) {
  if (!fixedCommitteeRules[i]) return;
  if (key==='week' || key==='weekday') val = parseInt(val);
  fixedCommitteeRules[i][key] = val;
  saveLocal();
  sbSaveFixedRules();
}
function removeFixedCommittee(i) {
  fixedCommitteeRules.splice(i, 1);
  saveLocal();
  sbSaveFixedRules();
  openCommitteeModal();
}
function addCommittee() {
  var ym = ymKey(shiftYear, shiftMonth);
  if (!shiftCommittees[ym]) shiftCommittees[ym] = [];
  shiftCommittees[ym].push({date: shiftYear+'-'+pad(shiftMonth+1)+'-01', title:'', name:''});
  saveLocal();
  sbSaveCommittees(ym);
  openCommitteeModal();
}
function updateCommittee(i, key, val) {
  var ym = ymKey(shiftYear, shiftMonth);
  if (shiftCommittees[ym] && shiftCommittees[ym][i]) shiftCommittees[ym][i][key] = val;
  saveLocal();
  sbSaveCommittees(ym);
}
function removeCommittee(i) {
  var ym = ymKey(shiftYear, shiftMonth);
  if (shiftCommittees[ym]) shiftCommittees[ym].splice(i,1);
  saveLocal();
  sbSaveCommittees(ym);
  openCommitteeModal();
}

function doCSV() {
  var statusMap = {reserved:'予約中',changed:'変更あり',rescheduled:'日程変更済み',cancelled:'キャンセル済み',noshow:'当日未受診'};
  var karteMap = {prepared:'準備済み',unprepared:'未準備',sent:'発送済み',unnecessary:'不要'};
  var mealMap = {store:'店内',bento:'弁当',unknown:'未確認',none:'不要'};
  var rows = [['予約日','氏名','カナ','生年月日','電話','カルテ番号','性別','午前午後','健診種別','人間ドック枠対象','協会健保枠対象','一般・その他枠対象','予約区分','企業名','健診枠','胃検査種類','胃検査時間帯','胃カメラ指名医','マンモ','マンモ時間帯','MRI','CT','認知','骨密度','M-D','視野','結果説明','MRI結果説明','マッサージ','頚動脈','乳エコー','子宮','MRCP','DWIBS','ロコモ','大腸F','誠寿司','誠寿司区分','誠寿司人数','事前送付','発送日','ステータス','キャンセル理由','最終変更','メモ','受付メモ(旧)','検査メモ(旧)','連絡メモ(旧)','重要メモ(旧)','対応者']];
  reservations.filter(function(r){return r.date===selectedDate;}).forEach(function(r){
    var et = examTypeById(r.examTypeId);
    var bucket = et ? et.bucket : '';
    var lastChange = (r.changeHistory&&r.changeHistory.length>0) ? (r.changeHistory[r.changeHistory.length-1].memo||'') : '';
    rows.push([
      r.date,r.name,r.kana,r.birth,r.phone,
      r.karteNumber||'',
      r.gender==='male'?'男':'女',r.timeSlot==='am'?'午前':'午後',
      r.examTypeName||'',
      bucket==='dock'?'○':'',
      bucket==='kyokai'?'○':'',
      bucket==='general'?'○':'',
      r.reservationType==='company'?'企業':'個人',r.companyName||'',
      r.isKenshin?'○':'',
      r.stomachExamType==='camera'?'胃カメラ':r.stomachExamType==='barium'?'胃バリウム':r.stomachExamType==='none'?'胃なし':'未選択',
      r.stomachExamTime==='am'?'AM':r.stomachExamTime==='pm'?'PM':'',
      r.gfDoctor||'',
      r.hasMammo?'○':'',
      r.hasMammo?((r.mammoTime||r.timeSlot)==='pm'?'PM':'AM'):'',
      r.hasMRI?'○':'',
      r.hasCT?'○':'',r.hasNinchi?'○':'',r.hasKotsu?'○':'',r.hasMD?'○':'',r.hasShiya?'○':'',r.hasKekka?'○':'',r.hasMRIKekka?'○':'',r.hasMassage?'○':'',r.hasKeidou?'○':'',r.hasNyuecho?'○':'',r.hasShikyu?'○':'',
      r.hasMRCP?'○':'',r.hasDWIBS?'○':'',r.hasRocomo?'○':'',r.hasDaicho?'○':'',
      r.seisushi==='yes'?'あり':r.seisushi==='unknown'?'未確認':'なし',
      r.seisushi==='no'?'':(mealMap[r.sushiMealType]||''),
      r.seisushi==='no'?'':(r.sushiPeopleCount||1),
      karteMap[r.karte]||'',r.documentSentAt||'',statusMap[r.status]||r.status,
      r.cancelReason||'',lastChange,
      buildMergedMemo(r),
      r.receptionMemo||'',r.examMemo||'',r.contactMemo||'',r.importantMemo||'',
      r.updatedBy||''
    ]);
  });
  var csv = '\uFEFF' + rows.map(function(row){
    return row.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '予約_' + selectedDate + '.csv';
  a.click();
}

// ─── アプリ起動 ─────────────────────────────────────
(function() {
  // どんなエラーが起きても、最低限カレンダー画面は表示する
  function bootOffline(msg) {
    try { setSyncBadge('warn', msg || 'オフライン'); } catch(_) {}
    try { resetData(); } catch(_) {
      try { renderCurrentTab(); } catch(__) {}
    }
  }
  // 接続はできているが読込に失敗したとき：サンプルは入れず空表示（DBを汚さない）
  function bootEmptyConnected(msg) {
    try {
      reservations = []; doctorOverrides = []; lockerOverrides = {}; companyColorMap = {};
    } catch(_) {}
    try { setSyncBadge('warn', msg); } catch(_) {}
    try { renderCurrentTab(); } catch(_) {}
  }
  try {
    var now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    selectedDate = todayStr();
    var sd = document.getElementById('sel-disp');
    if (sd) sd.textContent = '選択: ' + selectedDate;

    loadLocal();  // 当日業務表・日誌・共有メモをこの端末から復元

    // 開発モード(?dev=1)のときだけリセットボタンを表示（本番は非表示のまま）
    if (DEV_MODE) {
      var rb = document.getElementById('dev-reset-btn');
      if (rb) rb.style.display = '';
    }

    var connected = false;
    try { connected = sbInit(); }
    catch (e) { console.error('[SB] init error', e); connected = false; }

    if (connected) {
      // Supabase接続あり → DBからロード → Realtime開始
      sbLoadAll().then(function(ok) {
        if (ok) {
          try { sbStartRealtime(); } catch(e) { console.error('[SB] realtime error', e); }
          renderCurrentTab();
        } else {
          // 接続OKだが読込失敗（テーブル未作成など）→ 空表示。サンプルは書き込まない
          bootEmptyConnected('DB読込失敗：' + (SB_LAST_LOAD_ERROR || '原因不明') + '（F12コンソールに詳細）');
        }
      }).catch(function(e) {
        console.error('[SB] load error', e);
        bootEmptyConnected('DB読込エラー（オフライン表示）');
      });
    } else {
      // URL未設定／初期化失敗 → ローカルのサンプルで起動（デモ）
      bootOffline();
    }
  } catch (e) {
    // 最後の砦：起動中に何が起きても画面を出す
    console.error('[BOOT] fatal', e);
    bootOffline('オフライン');
  }
})();
