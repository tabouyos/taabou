<title>エステ予約帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style id="css">
/* Layout: one narrow column (phone first), sticky tab bar, shift calendar as a 7-col grid. */
:root {
  --bg: #fff5f8;
  --surface: #ffffff;
  --fg: #4a2c3a;
  --muted: #8f6b7c;
  --line-c: #f5d9e4;
  --accent: #e2648f;
  --accent-soft: #ffe4ee;
  --on-accent: #ffffff;
  --lilac: #b79ae6;
  --glow: rgba(226, 100, 143, .12);
  --line-green: #06a64b;
  --warn: #a2571c;
  --warn-soft: #fff0dd;
  --danger: #d1435b;
  --s-day: #c47a10;   --s-day-bg: #fff1d6;
  --s-night: #6a5acd; --s-night-bg: #ece8ff;
  --s-ake: #7d7591;   --s-ake-bg: #f0edf5;
  --s-off: #d94c80;   --s-off-bg: #ffe0ec;
  --s-late: #2f9b8a;  --s-late-bg: #dcf5f0;
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #241820; --surface: #30212b; --fg: #fbe9f1; --muted: #c9a7b7; --line-c: #4a3240;
  --accent: #ff8fb4; --accent-soft: #4a2638; --on-accent: #2a1220; --lilac: #c9b2f5; --glow: rgba(255, 143, 180, .10);
  --line-green: #3ddc84; --warn: #f5be7a; --warn-soft: #3d2c1c; --danger: #ff8fa0;
  --s-day: #f6c56b; --s-day-bg: #43331a; --s-night: #b6a9ff; --s-night-bg: #2f2950;
  --s-ake: #c4bbd4; --s-ake-bg: #3a3242; --s-off: #ff8fb4; --s-off-bg: #4d2338;
  --s-late: #7fdccb; --s-late-bg: #1f3d38; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #241820; --surface: #30212b; --fg: #fbe9f1; --muted: #c9a7b7; --line-c: #4a3240;
  --accent: #ff8fb4; --accent-soft: #4a2638; --on-accent: #2a1220; --lilac: #c9b2f5; --glow: rgba(255, 143, 180, .10);
  --line-green: #3ddc84; --warn: #f5be7a; --warn-soft: #3d2c1c; --danger: #ff8fa0;
  --s-day: #f6c56b; --s-day-bg: #43331a; --s-night: #b6a9ff; --s-night-bg: #2f2950;
  --s-ake: #c4bbd4; --s-ake-bg: #3a3242; --s-off: #ff8fb4; --s-off-bg: #4d2338;
  --s-late: #7fdccb; --s-late-bg: #1f3d38; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); background-image: radial-gradient(circle at 12% 0%, var(--accent-soft) 0, transparent 320px), radial-gradient(circle at 100% 8%, var(--glow) 0, transparent 280px); background-repeat: no-repeat; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; letter-spacing: .04em; color: var(--accent); }
h1::after { content: " ♡"; color: var(--lilac); font-size: .8em; }
h2 { color: var(--fg); }
h2::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--accent); box-shadow: .35em 0 0 var(--lilac); margin-right: .9em; vertical-align: .12em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .85rem; }
header.top { padding-top: 20px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-radius: 0 0 16px 16px; display: flex; gap: 6px; padding-block: 8px; overflow-x: auto; }
nav.tabs button { flex: 1 0 auto; border: 1px solid var(--line-c); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line-c); border-radius: 22px; box-shadow: 0 6px 20px var(--glow); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > * { min-width: 0; }
label.f { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 140px; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line-c); border-radius: 12px; padding: 8px 10px; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-size: .9rem; border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn.line { background: var(--line-green); border-color: var(--line-green); color: #fff; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .85rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .85rem; z-index: 20; }

.badge { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: .75rem; font-weight: 700; line-height: 1.6; }
.b-day { color: var(--s-day); background: var(--s-day-bg); }
.b-night { color: var(--s-night); background: var(--s-night-bg); }
.b-ake { color: var(--s-ake); background: var(--s-ake-bg); }
.b-off { color: var(--s-off); background: var(--s-off-bg); }
.b-late { color: var(--s-late); background: var(--s-late-bg); }
.b-none { color: var(--muted); background: var(--bg); }

/* booking list */
.day-group { display: grid; gap: 8px; }
.day-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.bk { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line-c); border-radius: 10px; }
.bk .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
.bk .who { min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); text-align: center; padding: 20px 8px; font-size: .9rem; }

/* calendar */
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: .75rem; color: var(--muted); }
.cal .dow.sun { color: var(--danger); }
.cell { border: 1px solid var(--line-c); background: var(--bg); border-radius: 12px; padding: 4px; min-height: 58px; display: grid; align-content: start; gap: 2px; cursor: pointer; font: inherit; color: var(--fg); text-align: left; }
.cell .d { font-size: .8rem; font-variant-numeric: tabular-nums; }
.cell.today { border-color: var(--accent); border-width: 2px; }
.cell .cnt { font-size: .7rem; color: var(--muted); }
.cell.blank { visibility: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--muted); align-items: center; }

/* public */
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { font-variant-numeric: tabular-nums; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
.pub-day { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line-c); }
.pub-day:first-of-type { border-top: 0; }
.today-card { border: 2px solid var(--line-green); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.lineid { font-family: ui-monospace, monospace; font-size: 1.05rem; user-select: all; background: var(--bg); padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; }

/* settings */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span { display: inline-block; border: 1px solid var(--line-c); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: .95rem; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip input:disabled + span { opacity: .45; cursor: not-allowed; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.br-day input:checked + span { background: var(--s-day-bg); color: var(--s-day); border-color: var(--s-day); }
.chip.br-night input:checked + span { background: var(--s-night-bg); color: var(--s-night); border-color: var(--s-night); }
.chip.br-ake input:checked + span { background: var(--s-ake-bg); color: var(--s-ake); border-color: var(--s-ake); }
.chip.br-off input:checked + span { background: var(--s-off-bg); color: var(--s-off); border-color: var(--s-off); }
.chip.br-late input:checked + span { background: var(--s-late-bg); color: var(--s-late); border-color: var(--s-late); }
.chip.br-clear input:checked + span { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.chip input:checked + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor; }
.cell { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.cell .ng { font-size: .7rem; color: var(--danger); font-weight: 700; }
.blk { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px dashed var(--danger); border-radius: 10px; }
.blk .when { font-variant-numeric: tabular-nums; font-weight: 700; }
/* お客様向け かんたん表示：大きな文字・少ない情報 */
.simple { display: grid; gap: 16px; font-size: 19px; line-height: 1.8; }
.s-card { background: var(--surface); border: 2px solid var(--line-c); border-radius: 22px; padding: 20px; display: grid; gap: 10px; }
.s-title { font-size: 1.5rem; color: var(--accent); }
.s-title::before { display: none; }
.s-lead { font-size: 1.05rem; }
.s-howto { border-color: var(--line-green); }
.s-howto h3 { font-size: 1.2rem; }
.s-howto ol { margin: 0; padding-left: 1.6em; font-weight: 700; }
.s-line-id { font-size: 1.6rem; font-weight: 700; letter-spacing: .06em; font-family: ui-monospace, monospace; user-select: all; background: var(--bg); border-radius: 12px; padding: 4px 14px; display: inline-block; }
.s-day { display: grid; gap: 2px; padding-block: 12px; border-top: 2px dotted var(--line-c); }
.s-day:first-child { border-top: 0; padding-top: 0; }
.s-date { font-weight: 700; font-size: 1.15rem; }
.s-slots { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.s-slot { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; color: var(--accent); background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 999px; padding: 2px 14px; }
button.s-slot { cursor: pointer; font-family: inherit; }
button.s-slot:hover, button.s-slot:focus-visible { background: var(--accent); color: var(--on-accent); }
.s-tap { font-size: .9rem; color: var(--muted); }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(40, 20, 30, .45); display: grid; align-items: end; justify-items: center; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.sheet-body { width: 100%; max-width: 520px; background: var(--surface); color: var(--fg); border-radius: 22px; padding: 20px; display: grid; gap: 14px; font-size: 17px; box-shadow: 0 10px 30px var(--glow); }
.s-when { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.s-foot { text-align: center; font-size: .8rem; }
.linklike { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .75rem; cursor: pointer; padding: 4px; }
.s-time { font-size: 1.1rem; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
body.is-simple header.top, body.is-simple nav.tabs, body.is-simple #sampleNote { display: none !important; }
body.is-simple .wrap > section:not(#simpleView) { display: none !important; }
.simple:first-child, body.is-simple .simple { padding-top: 16px; }
@media (max-width: 460px) { .bk { grid-template-columns: 54px 1fr auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="root"></div>
<script type="text/html" id="markup">
<div class="wrap">
  <header class="top">
    <h1>エステ予約帳</h1>
    <p class="muted" id="todayLabel"></p>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="book" aria-selected="true">予約</button>
    <button role="tab" data-tab="shift" aria-selected="false">勤務シフト</button>
    <button role="tab" data-tab="public" aria-selected="false">お客様向け空き</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </nav>

  <p class="note" id="sampleNote" hidden>いま表示されているシフトはサンプルです。「勤務シフト」タブでチャットの勤務表を貼り付けると上書きされます。</p>

  <!-- 予約 -->
  <section id="tab-book" class="wrap" style="padding:0">
    <form class="panel" id="bookForm" autocomplete="off">
      <h2>予約を登録</h2>
      <div class="row">
        <label class="f">お客様名<input id="bName" required placeholder="山田 花子"></label>
        <label class="f">LINEの名前<input id="bContact" placeholder="はなこ"></label>
      </div>
      <div class="row">
        <label class="f">日付<input type="date" id="bDate" required></label>
      </div>
      <div class="f" style="display:grid;gap:6px">
        <span class="muted" id="bItemsLabel">メニュー（2つまで選べます）</span>
        <div class="chips" id="bItems" role="group" aria-labelledby="bItemsLabel"></div>
      </div>
      <p class="muted" id="bDayInfo"></p>
      <div class="row">
        <label class="f">開始時間<select id="bTime"></select></label>
      </div>
      <label class="f" style="flex-basis:100%"><span><input type="checkbox" id="bOverride" style="width:auto;vertical-align:middle"> 勤務外・時間外でも登録する</span></label>
      <label class="f">メモ（肌の状態・アレルギーなど）<textarea id="bNote" style="min-height:60px"></textarea></label>
      <div class="row"><button class="btn" type="submit">登録する</button></div>
    </form>

    <div class="panel">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2>これからの予約</h2>
        <span class="muted" id="bCount"></span>
      </div>
      <div id="bookList" class="wrap" style="gap:16px"></div>
    </div>
  </section>

  <!-- シフト -->
  <section id="tab-shift" class="wrap" style="padding:0" hidden>
    <div class="panel">
      <div class="cal-nav">
        <button class="btn ghost small" id="prevM" type="button" aria-label="前の月">‹ 前月</button>
        <h2 id="monthLabel"></h2>
        <button class="btn ghost small" id="nextM" type="button" aria-label="次の月">次月 ›</button>
      </div>
      <div class="f" style="display:grid;gap:6px">
        <span class="muted" id="brushLabel">① 入れたい勤務を選ぶ → ② カレンダーの日付をタップ</span>
        <div class="chips" id="brush" role="radiogroup" aria-labelledby="brushLabel"></div>
      </div>
      <div class="cal" id="cal"></div>
      <p class="muted" id="shiftSaveState" aria-live="polite"></p>
      <div class="legend" id="legend"></div>
      <p class="muted">同じ勤務の日をもう一度タップすると消えます。「消す」を選んでタップしても消せます。数字は予約件数です。</p>
    </div>

    <form class="panel" id="blockForm" autocomplete="off">
      <h2>予約を入れない日時</h2>
      <p class="muted">用事がある日や、早めに終わりたい日を登録します。お客様向けの空き枠からも消えます。</p>
      <div class="row">
        <label class="f">日付<input type="date" id="kDate" required></label>
        <label class="f"><span><input type="checkbox" id="kAllDay" checked style="width:auto;vertical-align:middle"> 終日</span>
          <span class="muted" style="font-size:.75rem">外すと時間を指定できます</span></label>
      </div>
      <div class="row" id="kTimes" hidden>
        <label class="f">この時刻から<input type="time" id="kFrom" value="18:00"></label>
        <label class="f">この時刻まで<input type="time" id="kTo" value="21:00"></label>
      </div>
      <label class="f">メモ（自分用・お客様には見えません）<input id="kMemo" placeholder="例: 歯医者"></label>
      <div class="row"><button class="btn" type="submit">NGにする</button></div>
      <div id="blockList" class="wrap" style="gap:8px"></div>
    </form>

    <div class="panel">
      <h2>チャットの勤務表を貼り付け</h2>
      <p class="muted">職場チャットの勤務連絡をそのまま貼り付けてください。「10/1 日勤」「1日 夜勤」「3(土) 休み」「5 明」のような書き方を読み取ります。月の指定がない行は、上のカレンダーで表示中の月として扱います。</p>
      <textarea id="pasteBox" placeholder="例）&#10;10/1 日勤&#10;10/2 夜勤&#10;10/3 明け&#10;10/4 休み"></textarea>
      <div class="row">
        <button class="btn" id="parseBtn" type="button">読み取ってシフトに反映</button>
        <span class="muted" id="parseResult"></span>
      </div>
    </div>
  </section>

  <!-- お客様向け -->
  <section id="tab-public" class="wrap" style="padding:0" hidden>
    <div class="panel" id="linkPanel">
      <h2>お客様用リンク</h2>
      <p class="muted">このページのリンクを送ると、お客様はログインなしで空き時間を見られます（予約はLINEで受けます）。予約・シフト・NG日時を変えたら、下のボタンでお客様用の表示を新しくしてください。</p>
      <p class="note" id="snapState"></p>
      <div class="row"><button class="btn" id="publishSnap" type="button">お客様用リンクを更新</button></div>
    </div>
    <div class="panel">
      <h2>ご予約可能な日時</h2>
      <div class="today-card" id="todayCard"></div>
      <div id="pubList"></div>
      <div class="row" id="pubCopyRow"><button class="btn ghost" id="copyPub" type="button">案内文をコピー</button><span class="muted">LINEにそのまま貼れる、年配の方にも読みやすい文章です</span></div>
      <textarea id="pubText" readonly hidden></textarea>
      <div class="row" id="previewRow"><button class="btn" id="previewBtn" type="button">お客様の見え方を確認</button></div>
    </div>
  </section>

  <!-- お客様向け かんたん表示 -->
  <section id="simpleView" class="simple" hidden>
    <div class="row" id="previewBackRow" style="padding-top:16px"><button class="btn" id="previewBack" type="button">← 管理画面にもどる</button><span class="muted">ここから下がお客様に見える画面です</span></div>
    <div class="s-card">
      <h2 class="s-title">ご予約できる日と時間</h2>
      <p class="s-lead" id="sLead"></p>
    </div>
    <div class="s-card" id="sDays"></div>
    <div class="s-card s-howto">
      <h3>ご予約のしかた</h3>
      <p>LINEで、つぎの3つを送ってください。</p>
      <ol>
        <li>お名前</li>
        <li>ご希望の日と時間</li>
        <li>メニュー</li>
      </ol>
      <p id="sMenu"></p>
      <div id="sLine"></div>
      <p>今日のご予約も、LINEでお気軽にどうぞ。</p>
    </div>
    <p class="muted s-foot" id="sUpdated"></p>
    <p class="s-foot"><button class="linklike" id="ownerLink" type="button">管理画面（スタッフ用）</button></p>
    <div class="sheet" id="reqSheet" hidden role="dialog" aria-modal="true" aria-labelledby="reqTitle">
      <form class="sheet-body" id="reqForm" autocomplete="off">
        <div class="row" style="justify-content:space-between;align-items:center">
          <h3 id="reqTitle">ご予約のお申し込み</h3>
          <button class="btn ghost small" type="button" id="reqClose">閉じる</button>

    <form class="panel" id="setForm" autocomplete="off">
      <h2>個人LINE（当日予約の窓口）</h2>
      <div class="row">
        <label class="f">LINE ID<input id="sLineId" placeholder="例: esthe_hanako"></label>
        <label class="f">友だち追加URL（任意）<input id="sLineUrl" placeholder="https://line.me/ti/p/..."></label>
      </div>

      <h2>受付できる時間</h2>
      <p class="muted">勤務ごとに、エステの受付を始める時刻を決めます。空欄の勤務日は受付しません。</p>
      <div class="row">
        <label class="f"><span><span class="badge b-day">日勤</span> の日は</span><input type="time" id="st-day"></label>
        <label class="f"><span><span class="badge b-off">休み</span> の日は</span><input type="time" id="st-off"></label>
        <label class="f"><span><span class="badge b-ake">明け</span> の日は</span><input type="time" id="st-ake"></label>
        <label class="f"><span><span class="badge b-night">夜勤</span> の日は</span><input type="time" id="st-night"></label>
        <label class="f"><span><span class="badge b-late">遅番</span> の日は</span><input type="time" id="st-late"></label>

      <div class="row">
        <label class="f">1件の時間（分）<input type="number" id="sDuration" min="15" step="15"></label>
        <label class="f">最終終了時刻<input type="time" id="sClose"></label>
        <label class="f">予約の刻み（分）<select id="sStep"><option>15</option><option>30</option><option>60</option></select></label>
        <label class="f">施術後の片付け（分）<input type="number" id="sBuffer" min="0" step="5"></label>
      </div>

      <h2>メニュー</h2>
      <div class="row">
        <label class="f" style="flex-basis:260px">メニュー名（「、」で区切る）<input id="sItems" placeholder="エステ、美容点滴、整体"></label>
        <label class="f">1回に選べる数<select id="sMaxPick"><option>1</option><option>2</option><option>3</option></select></label>
      </div>

      <div class="row"><button class="btn" type="submit">設定を保存</button><span class="muted" id="storeInfo"></span></div>
    </form>
  </section>
</div>

<script id="app">
(() => {
  "use strict";
  // 画面の部品は #markup にまとめてある（お客様用リンクの更新時に、このページ自身を作り直すため）
  document.getElementById("root").innerHTML = document.getElementById("markup").textContent;
  const $ = (id) => document.getElementById(id);
  const DOW = "日月火水木金土";
  const SHIFT = {
    day:   { label: "日勤", short: "日" },
    night: { label: "夜勤", short: "夜" },
    ake:   { label: "明け", short: "明" },
    off:   { label: "休み", short: "休" },
    late:  { label: "遅番", short: "遅" },
  };
  const CYCLE = ["", "day", "night", "ake", "off", "late"];
  const DEFAULT_SETTINGS = {
    v: 2, lineId: "rx445h", lineUrl: "", close: "21:00", step: 30, buffer: 15, duration: 90,
    starts: { day: "18:00", off: "08:00", ake: "", night: "", late: "" },
    items: ["エステ", "美容点滴", "整体"], maxPick: 2,
  };
  // Settings saved by the first version had per-menu prices/times and 休み from 10:00.
  function normalizeSettings(s) {
    const out = { ...structuredClone(DEFAULT_SETTINGS), ...structuredClone(s || {}) };
    out.starts = { ...DEFAULT_SETTINGS.starts, ...(out.starts || {}) };
    if (!s?.v) { out.starts.off = "08:00"; out.duration = 90; out.v = 2; if (!out.lineId) out.lineId = DEFAULT_SETTINGS.lineId; }
    if (!Array.isArray(out.items) || !out.items.length) out.items = [...DEFAULT_SETTINGS.items];
    delete out.menus;
    return out;
  }
  const dur = () => Number(state.settings.duration) || 90;

  const state = {
    settings: structuredClone(DEFAULT_SETTINGS),
    shifts: {},      // "YYYY-MM" -> { days: { "DD": code }, sample?: bool }
    bookings: [],    // {id, date, start, items[], min, name, contact, via, note}
    blocks: [],      // {id, date, allDay, from, to, memo}  予約を入れない日時
    busy: {},        // public busy map from db (for viewers who can't read bookings)
    month: null,     // Date of 1st of month shown
    readOnly: false,
    customer: false, // お客様用リンクで開いた人（ログインなし・スタッフ以外）
  };

  // ---------- helpers ----------
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayStr = () => ymd(new Date());
  const toMin = (t) => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const toHm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  let toastTimer;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200); };

  const shiftOf = (date) => { const [y, m, d] = date.split("-"); return state.shifts[`${y}-${m}`]?.days?.[d] || ""; };
  const itemsText = (b) => (Array.isArray(b.items) && b.items.length ? b.items.join("＋") : b.menuName || "");
  const blockIv = (k) => (k.allDay ? [0, 24 * 60] : [toMin(k.from), toMin(k.to)]);

  function dayWindow(date) {
    const code = shiftOf(date);
    const st = code ? state.settings.starts[code] : "";
    if (!st) return null;
    const s = toMin(st), e = toMin(state.settings.close);
    return e > s ? [s, e] : null;
  }
  function busyIntervals(date, excludeId) {
    const buf = Number(state.settings.buffer) || 0;
    const list = state.bookings.filter((b) => b.date === date && b.id !== excludeId)
      .map((b) => [toMin(b.start), toMin(b.start) + Number(b.min) + buf]);
    for (const iv of state.busy[date] || []) list.push(iv);
    for (const k of state.blocks) if (k.date === date) list.push(blockIv(k));
    return list;
  }
  function freeStarts(date, min, { excludeId, fromNow } = {}) {
    const w = dayWindow(date);
    if (!w) return [];
    const step = Number(state.settings.step) || 30;
    const buf = Number(state.settings.buffer) || 0;
    const busy = busyIntervals(date, excludeId);
    let from = w[0];
    if (fromNow && date === todayStr()) { const n = new Date(); from = Math.max(from, Math.ceil((n.getHours() * 60 + n.getMinutes()) / step) * step); }
    const out = [];
    for (let t = w[0]; t + min <= w[1]; t += step) {
      if (t < from) continue;
      if (busy.some(([s, e]) => t < e && t + min + buf > s)) continue;
      out.push(t);
    }
    return out;
  }

  // ---------- chat parsing ----------
  const TOKEN_MAP = [
    [/^(日勤|日|早番|早)$/, "day"], [/^(夜勤|夜|準夜|深夜|入り|入)$/, "night"], [/^(明け|明)$/, "ake"],
    [/^(休み|休|公休|公|有休|有給|有|希望休|希)$/, "off"], [/^(遅番|遅)$/, "late"],
  ];
  const TOKEN_RE = "日勤|夜勤|準夜|深夜|明け|公休|休み|有休|有給|希望休|遅番|早番|入り|日|夜|明|休|公|有|希|遅|早|入";
  function parseChat(text, baseMonth) {
    const re = new RegExp(`(?:(\\d{1,2})\\s*[\\/／月]\\s*)?(\\d{1,2})\\s*日?\\s*(?:[(（][^)）]{0,4}[)）])?\\s*[:：\\-－ー・\\s]*(${TOKEN_RE})`, "g");
    const out = [];
    const norm = text.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
    let m;
    while ((m = re.exec(norm))) {
      const month = m[1] ? Number(m[1]) : baseMonth.getMonth() + 1;
      const day = Number(m[2]);
      const code = TOKEN_MAP.find(([r]) => r.test(m[3]))?.[1];
      if (!code || month < 1 || month > 12 || day < 1 || day > 31) continue;
      let year = baseMonth.getFullYear();
      if (month < baseMonth.getMonth() + 1 - 6) year += 1; // e.g. showing Dec, text says 1/5
      const d = new Date(year, month - 1, day);
      if (d.getMonth() !== month - 1) continue;
      out.push({ date: ymd(d), code });
    }
    return out;
  }

  // ---------- storage (db capability, or this browser as fallback) ----------
  const LS_KEY = "esthe-yoyaku-v1";
  const store = {
    db: null,
    loadLocal() {
      try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); Object.assign(state, { settings: normalizeSettings(d.settings), shifts: d.shifts || {}, bookings: d.bookings || [], blocks: d.blocks || [] }); } } catch {}
    },
    saveLocal() {
      if (this.db) return;
      try { localStorage.setItem(LS_KEY, JSON.stringify({ settings: state.settings, shifts: state.shifts, bookings: state.bookings, blocks: state.blocks })); } catch {}
    },
    async saveSettings() {
      if (this.db) await this.db.doc("settings/main").set(structuredClone(state.settings)); else this.saveLocal();
    },
    async saveMonth(key) {
      if (this.db) await this.db.doc(`shifts/${key}`).set({ days: { ...(state.shifts[key]?.days || {}) } }); else this.saveLocal();
    },
    async saveBooking(b) {
      if (this.db) { await this.db.doc(`bookings/${b.id}`).set(b); await this.publishBusy(); } else this.saveLocal();
    },
    async deleteBooking(id) {
      if (this.db) { await this.db.doc(`bookings/${id}`).delete(); await this.publishBusy(); } else this.saveLocal();
    },
    async saveBlock(k) {
      if (this.db) { await this.db.doc(`blocks/${k.id}`).set(k); await this.publishBusy(); } else this.saveLocal();
    },
    async deleteBlock(id) {
      if (this.db) { await this.db.doc(`blocks/${id}`).delete(); await this.publishBusy(); } else this.saveLocal();
    },
    // Free/busy only (no names) so the customer view works for people who cannot read bookings.
    async publishBusy() {
      const today = todayStr(), buf = Number(state.settings.buffer) || 0, map = {};
      for (const b of state.bookings) {
        if (b.date < today) continue;
        (map[b.date] ||= []).push([toMin(b.start), toMin(b.start) + Number(b.min) + buf]);
      }
      for (const k of state.blocks) if (k.date >= today) (map[k.date] ||= []).push(blockIv(k));
      await this.db.doc("public/busy").set({ days: map });
    },
  };

  async function connectDb() {
    if (!window.claude?.use) return;
    let db = null;
    try { db = await window.claude.use("db"); } catch { db = null; }
    if (!db) return;
    store.db = db;
    $("storeInfo").textContent = "データはクラウドに保存されます（スマホ・PC共通）";
    const onErr = () => {};
    db.doc("settings/main").onSnapshot((s) => { if (s.exists) { state.settings = normalizeSettings(s.data()); } renderAll(); }, onErr);
    db.collection("shifts").onSnapshot((q) => {
      const next = {};
      q.docs.forEach((d) => (next[d.id] = d.data()));
      for (const k of pendingMonths) if (state.shifts[k]) next[k] = state.shifts[k]; // まだ保存中の入力は消さない
      state.shifts = next; renderAll();
    }, onErr);
    db.collection("bookings").onSnapshot((q) => { state.bookings = q.docs.map((d) => d.data()); renderAll(); }, onErr);
    db.collection("blocks").onSnapshot((q) => { state.blocks = q.docs.map((d) => d.data()); renderAll(); }, onErr);
    db.doc("public/busy").onSnapshot((s) => { state.busy = s.exists ? (s.data().days || {}) : {}; renderAll(); }, onErr);
  }


  // ---------- tabs ----------
  function showTab(name) {
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    ["book", "shift", "public", "settings"].forEach((t) => ($("tab-" + t).hidden = t !== name));
    try { localStorage.setItem(LS_KEY + ":tab", name); } catch {}
  }
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });

  // ---------- render: booking ----------
  function renderItems() {
    const box = $("bItems"), picked = new Set([...box.querySelectorAll("input:checked")].map((i) => i.value));
    const max = Number(state.settings.maxPick) || 2;
    $("bItemsLabel").textContent = `メニュー（${max}つまで選べます・1件${dur()}分）`;
    box.innerHTML = state.settings.items.map((name, i) =>
      `<label class="chip"><input type="checkbox" id="bItem${i}" value="${esc(name)}" ${picked.has(name) ? "checked" : ""}><span>${esc(name)}</span></label>`).join("");
    limitItems();
  }
  function limitItems() {
    const boxes = [...$("bItems").querySelectorAll("input")], max = Number(state.settings.maxPick) || 2;
    const n = boxes.filter((b) => b.checked).length;
    boxes.forEach((b) => (b.disabled = !b.checked && n >= max));
  }
  $("bItems").addEventListener("change", limitItems);
  function renderTimeOptions() {
    const date = $("bDate").value, sel = $("bTime"), cur = sel.value, min = dur();
    const info = $("bDayInfo");
    if (!date) { sel.innerHTML = ""; info.textContent = ""; return; }
    const code = shiftOf(date), w = dayWindow(date);
    const shiftTxt = code ? SHIFT[code].label : "シフト未入力";
    const isToday = date === todayStr();
    const ng = state.blocks.filter((k) => k.date === date).map((k) => (k.allDay ? "終日" : `${k.from}〜${k.to}`));
    const ngTxt = ng.length ? `（NG：${ng.join("・")}）` : "";
    let times;
    if ($("bOverride").checked) {
      times = []; for (let t = 7 * 60; t + min <= 23 * 60; t += Number(state.settings.step) || 30) times.push(t);
      info.textContent = `${md(date)}：${shiftTxt}${ngTxt}。時間外登録モードです。`;
    } else {
      times = freeStarts(date, min);
      info.textContent = w
        ? `${md(date)}：${shiftTxt}のため ${toHm(w[0])}〜${toHm(w[1])} 受付${ngTxt}。空き ${times.length} 枠${isToday ? "（当日分は個人LINEで受けた予約を登録してください）" : ""}`
        : `${md(date)}：${shiftTxt}のため受付なし。登録するときは「勤務外・時間外でも登録する」にチェックを入れてください。`;
    }
    sel.innerHTML = times.length ? times.map((t) => `<option>${toHm(t)}</option>`).join("") : `<option value="">空きがありません</option>`;
    if (times.some((t) => toHm(t) === cur)) sel.value = cur;
  }
  function renderBookings() {
    const today = todayStr();
    const list = state.bookings.filter((b) => b.date >= today).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    $("bCount").textContent = `${list.length}件`;
    if (!list.length) { $("bookList").innerHTML = `<p class="empty">まだ予約はありません。上のフォームから登録できます。</p>`; return; }
    const groups = {};
    list.forEach((b) => (groups[b.date] ||= []).push(b));
    $("bookList").innerHTML = Object.entries(groups).map(([date, items]) => {
      const code = shiftOf(date);
      return `<div class="day-group">
        <div class="day-head">${md(date)} ${date === today ? '<span class="badge b-off">今日</span>' : ""}
          <span class="badge b-${code || "none"}">${code ? SHIFT[code].label : "シフト未入力"}</span></div>
        ${items.map((b) => {
          const end = toHm(toMin(b.start) + Number(b.min));
          return `<div class="bk"><div class="t">${esc(b.start)}<div class="muted" style="font-weight:400">〜${end}</div></div>
            <div class="who"><strong>${esc(b.name)}</strong> 様 <span class="muted">${esc(itemsText(b))}</span>
            ${b.contact ? `<div class="muted">LINE：${esc(b.contact)}</div>` : ""}${b.note ? `<div class="muted">📝 ${esc(b.note)}</div>` : ""}</div>
            <button class="btn danger small" type="button" data-del="${esc(b.id)}">取消</button></div>`;
        }).join("")}</div>`;
    }).join("");
  }
  $("bookList").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-del]");
    if (!btn) return;
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "本当に取消"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "取消"; }, 3000); return; }
    const id = btn.dataset.del;
    state.bookings = state.bookings.filter((b) => b.id !== id);
    renderAll();
    try { await store.deleteBooking(id); toast("予約を取り消しました"); } catch { toast("取消を保存できませんでした。通信を確認してもう一度お試しください"); }
  });
  ["bDate", "bOverride"].forEach((id) => $(id).addEventListener("change", renderTimeOptions));
  $("bookForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const items = [...$("bItems").querySelectorAll("input:checked")].map((i) => i.value), start = $("bTime").value, date = $("bDate").value;
    if (!items.length || !start || !date) { toast("日付・メニュー・開始時間を選んでください"); return; }
    const b = { id: uid(), date, start, items, min: dur(),
      name: $("bName").value.trim(), contact: $("bContact").value.trim(), via: "LINE", note: $("bNote").value.trim(), createdAt: new Date().toISOString() };
    state.bookings = [...state.bookings, b];
    renderAll();
    try { await store.saveBooking(b); toast(`${md(date)} ${start} ${b.name}様を登録しました`); } catch { toast("保存できませんでした。通信を確認してもう一度お試しください"); }
    $("bName").value = ""; $("bContact").value = ""; $("bNote").value = ""; $("bOverride").checked = false;
    $("bItems").querySelectorAll("input").forEach((i) => (i.checked = false)); limitItems();
    renderTimeOptions();
  });

  // ---------- render: shift calendar ----------
  function renderCalendar() {

      const ng = state.blocks.filter((k) => k.date === date);

        <span class="d">${d}</span><span class="badge b-${code || "none"}">${code ? SHIFT[code].short : "—"}</span>${ngTxt}${n ? `<span class="cnt">予約${n}</span>` : ""}</button>`;

  const monthTimers = {};

  function setSaveState(text) { $("shiftSaveState").textContent = text; }

    pendingMonths.add(key);

      catch (err) { setSaveState(`保存できませんでした（${err?.code || "通信エラー"}）。電波の良い所でもう一度タップしてください。`); toast("シフトを保存できませんでした"); }

  $("nextM").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); renderCalendar(); };
  $("parseBtn").addEventListener("click", async () => {
    const found = parseChat($("pasteBox").value, state.month);
    if (!found.length) { $("parseResult").textContent = "勤務を読み取れませんでした。「10/1 日勤」のように日付と勤務が並んでいるか確認してください。"; return; }
    const touched = new Set();
    for (const { date, code } of found) {
      const [y, m, d] = date.split("-"), key = `${y}-${m}`;
      // 保存済みの月はサーバーから届いた書き換え不可のデータなので、コピーしてから変更する
      if (!touched.has(key)) { state.shifts[key] = { days: { ...(state.shifts[key]?.days || {}) } }; }

    catch (err) { setSaveState(`保存できませんでした（${err?.code || "通信エラー"}）`); toast("シフトを保存できませんでした"); }
    finally { touched.forEach((k) => pendingMonths.delete(k)); }
    const counts = {}; found.forEach((x) => (counts[x.code] = (counts[x.code] || 0) + 1));
    $("parseResult").textContent = `${found.length}日分を反映しました（` + Object.entries(counts).map(([k, n]) => `${SHIFT[k].label}${n}`).join("・") + "）";

    $("blockList").innerHTML = list.length ? list.map((k) => `<div class="blk"><div><span class="when">${md(k.date)} ${k.allDay ? "終日" : `${esc(k.from)}〜${esc(k.to)}`}</span>
      ${k.memo ? `<span class="muted"> ${esc(k.memo)}</span>` : ""}</div><button class="btn danger small" type="button" data-unblock="${esc(k.id)}">解除</button></div>`).join("")

  $("blockForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!date) { toast("日付を選んでください"); return; }
    if (!allDay && (!from || !to || toMin(to) <= toMin(from))) { toast("終わりの時刻は始まりより後にしてください"); return; }
    const k = { id: uid(), date, allDay, from: allDay ? "" : from, to: allDay ? "" : to, memo: $("kMemo").value.trim() };
    const clash = state.bookings.filter((b) => b.date === date && (allDay || (toMin(b.start) < toMin(to) && toMin(b.start) + Number(b.min) > toMin(from))));
    state.blocks = [...state.blocks, k];
    renderAll();
    try { await store.saveBlock(k); toast(`${md(date)} ${allDay ? "終日" : `${from}〜${to}`} をNGにしました` + (clash.length ? `（この時間に予約が${clash.length}件あります）` : "")); }

    try { await store.deleteBlock(id); toast("NGを解除しました"); } catch { toast("解除を保存できませんでした"); }
  });

  // ---------- render: public view ----------
  function lineBlock() {
    const s = state.settings;
    const id = s.lineId ? `<span class="lineid" id="lineIdText">${esc(s.lineId)}</span> <button class="btn small ghost" type="button" id="copyLine">IDをコピー</button>` : `<span class="muted">（設定タブでLINE IDを入れると、ここに表示されます）</span>`;
    const link = s.lineUrl && /^https:\/\//.test(s.lineUrl) ? `<div><a class="btn line" href="${esc(s.lineUrl)}" target="_blank" rel="noopener">LINEで友だち追加</a></div>` : "";
    return `<h3>本日（${md(todayStr())}）のご予約は個人LINEで</h3>
      <p class="muted">当日のご予約・空き確認は、LINEで直接メッセージをお送りください。</p><div>LINE ID：${id}</div>${link}`;
  }
  // 勤務は月末に翌月分が出るので、シフトが入っている最後の月の末日まで予約を受け付ける。
  function publicEnd() {
    const base = new Date();
    const keys = Object.keys(state.shifts).filter((k) => Object.keys(state.shifts[k]?.days || {}).length).sort();
    const last = keys.length ? keys[keys.length - 1].split("-").map(Number) : [base.getFullYear(), base.getMonth() + 1];
    const end = new Date(last[0], last[1], 0);
    const cap = new Date(base.getFullYear(), base.getMonth() + 2, 0); // 来月末まで
    return end < cap ? end : cap;
  }
  function publicDays() {
    const out = [], base = new Date(), end = ymd(publicEnd());
    for (let i = 1; i <= 62; i++) {
      const date = ymd(new Date(base.getFullYear(), base.getMonth(), base.getDate() + i));
      if (date > end) break;
      if (!shiftOf(date)) continue; // 勤務がまだ出ていない日は出さない
      out.push({ date, w: dayWindow(date), times: freeStarts(date, dur()) });
    }
    return out;
  }
  function renderPublic() {
    $("todayCard").innerHTML = lineBlock();
    const days = publicDays();
    if (!days.length) { $("pubList").innerHTML = `<p class="empty">まだ予約できる日がありません。月末に翌月分の勤務が出たらご案内します。</p>`; return; }
    $("pubList").innerHTML = `<p class="muted">翌日から${publicEnd().getMonth() + 1}月${publicEnd().getDate()}日までご予約いただけます（勤務が出た日のみ）。1回${dur()}分の開始時刻です。メニュー：${esc(state.settings.items.join("・"))}から${Number(state.settings.maxPick) || 2}つまでお選びいただけます。</p>` + days.map(({ date, w, times }) => {
      const body = !w ? `<span class="muted">受付していません</span>` : times.length ? `<div class="slots">${times.map((t) => `<span class="slot">${toHm(t)}</span>`).join("")}</div>` : `<span class="muted">空きがありません</span>`;
      return `<div class="pub-day"><div class="day-head">${md(date)}${w ? ` <span class="muted" style="font-weight:400">${toHm(w[0])}〜${toHm(w[1])}</span>` : ""}</div>${body}</div>`;
    }).join("");
  }
  // ---------- お客様向けのやさしい表現 ----------
  const jpTime = (m) => { const h = Math.floor(m / 60), mm = m % 60; return `${h < 12 ? "午前" : "午後"}${h <= 12 ? h : h - 12}時${mm === 0 ? "" : mm === 30 ? "半" : mm + "分"}`; };
  const jpDate = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };
  const jpDur = (m) => `${Math.floor(m / 60) ? Math.floor(m / 60) + "時間" : ""}${m % 60 === 30 && m >= 60 ? "半" : m % 60 ? (m % 60) + "分" : ""}`;
  function timeRanges(times) {
    const step = Number(state.settings.step) || 30, out = [];
    for (const t of times) { const last = out[out.length - 1]; if (last && t - last[1] === step) last[1] = t; else out.push([t, t]); }
    return out.map(([a, b]) => {
      if (a === b) return `${jpTime(a)}から`;
      const ta = jpTime(a), tb = jpTime(b);
      return `${ta}〜${tb.slice(0, 2) === ta.slice(0, 2) ? tb.slice(2) : tb}のあいだ`;
    });
  }
  const simpleDays = () => publicDays().filter((x) => x.w && x.times.length);
  const menuSentence = (src) => `メニュー：${src.items.join("・")}（${src.maxPick}つまで選べます）`;
  // お客様に見せる内容（名前などは含めない）

    return { end: ymd(publicEnd()), step: Number(state.settings.step) || 30, duration: dur(), items: [...state.settings.items],
      maxPick: Number(state.settings.maxPick) || 2, lineId: state.settings.lineId || "", lineUrl: state.settings.lineUrl || "",
      days: simpleDays().map((x) => ({ d: x.date, t: x.times })) };
  }
  const SNAP = (() => { try { return JSON.parse($("snap").textContent); } catch { return null; } })();
  const sameSnap = (a, b) => {
    if (!a || !b) return false;
    const strip = (x) => JSON.stringify({ ...x, at: undefined, days: x.days.filter((d) => d.d > todayStr()) });

  });

  // ---------- render: settings ----------
  function renderSettings() {
    const s = state.settings;
    if (document.activeElement?.closest?.("#setForm")) return; // don't clobber while typing
    $("sLineId").value = s.lineId || ""; $("sLineUrl").value = s.lineUrl || "";
    for (const k of Object.keys(SHIFT)) $("st-" + k).value = s.starts?.[k] || "";
    $("sClose").value = s.close; $("sStep").value = String(s.step); $("sBuffer").value = s.buffer; $("sDuration").value = s.duration;
    $("sItems").value = s.items.join("、"); $("sMaxPick").value = String(s.maxPick);
  }
  $("setForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const items = $("sItems").value.split(/[、,，\n]/).map((x) => x.trim()).filter(Boolean);
    if (!items.length) { toast("メニューを1つ以上入れてください"); return; }
    const starts = {}; for (const k of Object.keys(SHIFT)) starts[k] = $("st-" + k).value;
    state.settings = { v: 2, lineId: $("sLineId").value.trim(), lineUrl: $("sLineUrl").value.trim(), close: $("sClose").value || "21:00",
      step: Number($("sStep").value) || 30, buffer: Math.max(0, Number($("sBuffer").value) || 0), duration: Math.max(15, Number($("sDuration").value) || 90),
      starts, items, maxPick: Number($("sMaxPick").value) || 2 };
    document.activeElement?.blur?.();
    renderAll();
    try { await store.saveSettings(); toast("設定を保存しました"); } catch { toast("設定を保存できませんでした"); }
  });

  function renderAll() {
    renderItems();
    renderTimeOptions();
    renderBookings();
    renderCalendar();
    renderBlocks();
    renderPublic();
    if (!$("simpleView").hidden) renderSimple(state.customer ? SNAP : liveSnapshot());
    renderSnapState();
    renderSettings();
  }

  // ---------- boot ----------
  const now = new Date();
  $("todayLabel").textContent = `今日 ${now.getMonth() + 1}月${now.getDate()}日(${DOW[now.getDay()]})`;
  state.month = new Date(now.getFullYear(), now.getMonth(), 1);
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  $("bDate").value = ymd(tomorrow);
  $("kDate").value = ymd(tomorrow);
  $("storeInfo").textContent = "データはこのブラウザに保存されます";
  store.loadLocal();
  try { const t = localStorage.getItem(LS_KEY + ":tab"); if (t && $("tab-" + t)) showTab(t); } catch {}
  renderBrush();
  renderAll();
  if (window.claude?.use) {
    // Claudeのページとして開かれた：まずお客様向けを出し、オーナーと分かったら管理画面に切り替える
    state.customer = true;
    setSimple(true);
    (async () => {
      let staff = false;
      try {
        const user = await window.claude.use("user");
        if (user) staff = (await user.isOwner()) || (await user.canEdit()) || (await user.can("data.write")) === true;
      } catch {}
      if (staff) enterAdmin();
    })();
  } else {
    connectDb(); // ファイルを直接開いたとき（このブラウザに保存）
  }
  window.__esthe = { parseChat, freeStarts, state }; // for quick checks
})();
</script>
